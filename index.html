  `;

  const MICAH_FACE = '<svg viewBox="0 0 50 56" aria-hidden="true">' +
    '<path d="M6 56c1-11 8-16 19-16s18 5 19 16z" fill="#56763a" stroke="#2a221c" stroke-width="2"/>' +
    '<ellipse cx="8.5" cy="25" rx="3.5" ry="5" fill="#e9b994" stroke="#2a221c" stroke-width="2"/>' +
    '<ellipse cx="41.5" cy="25" rx="3.5" ry="5" fill="#e9b994" stroke="#2a221c" stroke-width="2"/>' +
    '<ellipse cx="25" cy="24" rx="16" ry="18" fill="#e9b994" stroke="#2a221c" stroke-width="2"/>' +
    '<path d="M9 22C7 8 22 2 36 9c4 2 6 6 6 10-5-5-12-6-19-5-5 1-10 3-14 8z" fill="#5a3a22" stroke="#2a221c" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M16 24.5q3-3 6 0M28 23.5q3-2.5 6 .5" fill="none" stroke="#2a221c" stroke-width="2.2" stroke-linecap="round"/>' +
    '<path d="M18 32q8 6 15-1" fill="none" stroke="#2a221c" stroke-width="2.2" stroke-linecap="round"/>' +
    '<ellipse cx="14" cy="29" rx="3" ry="1.8" fill="rgba(232,110,120,.35)"/><ellipse cx="36" cy="29" rx="3" ry="1.8" fill="rgba(232,110,120,.35)"/>' +
    '</svg>';

  function tallySvg(n, animateLast) {
    const groups = Math.ceil(Math.max(n, 1) / 5);
    const w = Math.max(1, groups) * 34 + 4;
    let s = `<svg viewBox="0 0 ${w} 28" width="${w}" height="26" aria-hidden="true" fill="none" stroke="#f4f1e6" stroke-width="2.6" stroke-linecap="round">`;
    for (let i = 0; i < n; i++) {
      const gI = Math.floor(i / 5), k = i % 5, x0 = 4 + gI * 34;
      const cls = animateLast && i === n - 1 ? ' class="tv-draw"' : '';
      if (k < 4) { const x = x0 + k * 6 + ((i * 7) % 3) * 0.4; s += `<path${cls} d="M${x} ${3 + (i % 2)} L${x + 0.8} ${25 - (i % 3) * 0.6}"/>`; }
      else s += `<path${cls} d="M${x0 - 3} 21 L${x0 + 23} 7"/>`;
    }
    return s + '</svg>';
  }

  /* a fresh set each round: spread across categories, skip questions seen in earlier rounds */
  const seen = new Set();
  const keyOf = (q) => q.q;
  function drawRound(pool, n, util) {
    let fresh = pool.filter((q) => !seen.has(keyOf(q)));
    if (fresh.length < n) { seen.clear(); fresh = pool.slice(); }
    const byCat = new Map();
    util.shuffle(fresh).forEach((q) => { const c = q.cat || 'General'; if (!byCat.has(c)) byCat.set(c, []); byCat.get(c).push(q); });
    const cats = util.shuffle(Array.from(byCat.keys()));
    const out = [];
    while (out.length < Math.min(n, fresh.length)) {
      let added = false;
      for (const c of cats) {
        const list = byCat.get(c);
        if (list.length && out.length < n) { out.push(list.shift()); added = true; }
      }
      if (!added) break;
    }
    out.forEach((q) => seen.add(keyOf(q)));
    return util.shuffle(out);
  }

  SCQ.registerGame('trivia', {
    title: 'Trivia Night',
    howTo: [
      'Tap the right answer before the chalk line runs out (or press 1 to 4).',
      'Micah will chime in with an answer. He is always wrong.',
      'Seven questions, and you need every one.',
    ],
    defaults: {
      questions: 7,       // questions per round, drawn at random from content.trivia
      need: 7,            // correct answers needed to win
      seconds: 10,        // time per question
      micahAt: 1.2,       // seconds into each question when Micah "helps"
      revealMs: 1400,     // how long the right answer stays up after a miss
      eased: { seconds: 14 },
    },

    start(stage, ctx) {
      const util = ctx.util, sound = ctx.sound, signal = ctx.signal, h = util.h;
      const K = Object.assign({ questions: 7, need: 7, seconds: 10, micahAt: 1.2, revealMs: 1400 }, ctx.params || {});
      const pool = (ctx.content && ctx.content.trivia) || [];
      const qs = drawRound(pool, K.questions, util);
      const total = qs.length;
      const need = Math.min(K.need, total);
      const P = ctx.palette || {};

      return new Promise((resolve, reject) => {
        if (!total) { reject(new Error('no trivia questions')); return; }
        const style = h('style', {}, CSS);
        const qn = h('b');
        const tally = h('span');
        const needEl = h('span', {}, 'need ' + need);
        const timerBar = h('i');
        const timer = h('div', { class: 'tv-timer', role: 'progressbar', 'aria-label': 'Time left' }, timerBar);
        const catEl = h('div', { class: 'tv-cat' });
        const qEl = h('div', { class: 'tv-q', 'aria-live': 'polite' });
        const bubbleText = h('span');
        const bubble = h('div', { class: 'tv-bubble' }, h('b', {}, 'Micah:'), bubbleText);
        const micahRow = h('div', { class: 'tv-micah' }, h('span', { html: MICAH_FACE }), bubble);
        const answers = h('div', { class: 'tv-answers' });
        const board = h('div', { class: 'tv-board' },
          h('div', { class: 'tv-top' }, h('div', {}, 'Question ', qn, ' of ' + total), h('div', { class: 'tv-score' }, tally, needEl)),
          timer, catEl, qEl, micahRow, answers);
        const tray = h('div', { class: 'tv-tray', 'aria-hidden': 'true' }, h('i', { class: 'ch1' }), h('i', { class: 'ch2' }), h('i', { class: 'er' }));
        const wrap = h('div', { class: 'tv-wrap' + (P.dark ? ' tv-dark' : '') }, h('div', { class: 'tv-frame' }, board, tray));
        stage.append(style, wrap);

        let right = 0, wrong = 0, phase = 'intro', presses = 0, frames = 0, settled = false;
        let cur = null; // { correct, micah, buttons, t, done, answer(k) }

        function paintScore(anim) {
          tally.innerHTML = right ? tallySvg(right, anim) : '';
          needEl.textContent = right ? right + ' / need ' + need : 'need ' + need;
        }
        paintScore(false);

        function check(btn) {
          const s = h('span', { html: '<svg viewBox="0 0 34 34" aria-hidden="true"><path class="tv-draw" d="M6 18 L14 26 L29 7" fill="none" stroke="#c8ef9c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>' });
          btn.append(s.firstChild);
        }
        function circle(btn) {
          const s = h('span', { html: '<svg class="tv-ring" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path class="tv-draw" pathLength="80" d="M60 3C86 2 99 10 98 20S80 38 50 38 2 31 2 20 22 2 56 4" fill="none" stroke="#ffd36b" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>' });
          btn.append(s.firstChild);
        }
        function cross(btn) {
          const s = h('span', { html: '<svg viewBox="0 0 34 34" aria-hidden="true"><path class="tv-draw" d="M8 8 L26 26 M26 8 L8 26" fill="none" stroke="#ff9a7a" stroke-width="4" stroke-linecap="round"/></svg>' });
          btn.append(s.firstChild);
        }

        function ask(i) {
          const q = qs[i];
          // keep the right answer plus up to 3 others, then shuffle the order (tracking where the right one lands)
          const others = util.shuffle(q.choices.map((_, k) => k).filter((k) => k !== q.answer));
          if (Number.isInteger(q.micah) && others.includes(q.micah)) { others.splice(others.indexOf(q.micah), 1); others.unshift(q.micah); }
          const shuffled = util.shuffle([q.answer].concat(others.slice(0, 3)));
          const correct = shuffled.indexOf(q.answer);
          let mPick = Number.isInteger(q.micah) && q.micah !== q.answer && shuffled.includes(q.micah) ? q.micah : null;
          if (mPick == null) { const wrongs = shuffled.filter((k) => k !== q.answer); mPick = util.pick(wrongs); }
          qn.textContent = String(i + 1);
          catEl.textContent = q.cat || '';
          qEl.textContent = q.q;
          qEl.classList.remove('out');
          qEl.style.opacity = '';
          micahRow.classList.remove('on');
          bubbleText.textContent = "It's definitely " + String(q.choices[mPick]).replace(/[.!?]$/, '').replace(/^(A|An|The) /, (m) => m.toLowerCase()) + '.';
          const stack = (stage.clientWidth || 390) < 350 || shuffled.some((k) => String(q.choices[k]).length > 26);
          answers.classList.toggle('stack', stack);
          const buttons = shuffled.map((k, j) => h('button', { class: 'tv-a', type: 'button', 'aria-keyshortcuts': String(j + 1) },
            h('span', { class: 'tv-n' }, String(j + 1)), h('span', { class: 'tv-t' }, q.choices[k])));
          buttons.forEach((b, j) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); presses++; pick(j); }, { signal }));
          buttons.forEach((b, j) => b.addEventListener('click', (e) => { if (e.detail === 0) { presses++; pick(j); } }, { signal })); // keyboard activation
          answers.replaceChildren(...buttons);
          timer.classList.remove('low');
          timerBar.style.transform = 'scaleX(1)';
          cur = { i, correct, micahIdx: shuffled.indexOf(mPick), buttons, t: 0, done: false, micahShown: false, lastTick: K.seconds };
          phase = 'question';

          function pick(j) {
            if (signal.aborted || !cur || cur.done || cur.i !== i) return;
            finish(j);
          }
          cur.answer = pick;
        }

        function finish(j) {
          const c = cur;
          c.done = true;
          phase = 'reveal';
          const ok = j === c.correct;
          c.buttons.forEach((b, k) => { b.disabled = true; if (k !== c.correct && k !== j) b.classList.add('dim'); });
          if (ok) {
            right++;
            c.buttons[j].classList.add('right'); check(c.buttons[j]);
            sound.play('good');
            paintScore(true);
          } else {
            wrong++;
            if (j >= 0) { c.buttons[j].classList.add('wrong'); cross(c.buttons[j]); }
            else { board.append(h('div', { class: 'tv-stamp' }, 'Time!')); qEl.style.opacity = '0.55'; }
            c.buttons[c.correct].classList.add('reveal'); circle(c.buttons[c.correct]);
            sound.play('bad');
            if (j === c.micahIdx && c.micahShown) bubbleText.textContent = '...okay, that one is on me.';
          }
          const lost = wrong > total - need;
          const last = c.i >= total - 1;
          util.wait(ok ? 950 : K.revealMs, signal).then(() => {
            board.querySelectorAll('.tv-stamp').forEach((el) => el.remove());
            if (lost || last) {
              phase = 'over'; settled = true;
              resolve(right >= need ? 'win' : 'lose');
              return;
            }
            qEl.classList.add('out');
            return util.wait(180, signal).then(() => ask(c.i + 1));
          }).catch(() => {});
        }

        window.addEventListener('keydown', (e) => {
          if (!cur || cur.done || e.repeat) return;
          const k = Number(e.key);
          if (k >= 1 && k <= cur.buttons.length) { e.preventDefault(); presses++; cur.answer(k - 1); }
        }, { signal });

        util.loop((dt) => {
          if (settled) return false;
          frames++;
          if (phase === 'question' && cur && !cur.done) {
            cur.t += dt;
            const left = Math.max(0, K.seconds - cur.t);
            timerBar.style.transform = 'scaleX(' + (left / K.seconds).toFixed(4) + ')';
            if (left < K.seconds * 0.3) timer.classList.add('low');
            if (!cur.micahShown && cur.t >= K.micahAt) { cur.micahShown = true; micahRow.classList.add('on'); sound.play('pop'); }
            if (left <= 3 && Math.ceil(left) < cur.lastTick) { cur.lastTick = Math.ceil(left); if (left > 0) sound.play('tick'); }
            if (left <= 0) finish(-1);
          }
          return true;
        }, signal);

        if (ctx.debug) {
          SCQ.test.trivia = {
            state: () => ({ phase, idx: cur ? cur.i : -1, right, wrong, need, total, correct: cur ? cur.correct : -1, micah: cur ? cur.micahIdx : -1, micahShown: !!(cur && cur.micahShown), presses, frames, t: cur ? cur.t : 0 }),
            params: K,
          };
        }
        ask(0);
      });
    },
  });
})();

</script>
<script>window.SCQ && window.SCQ.boot();</script>
</body>
