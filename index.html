<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f0e4c8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23b3362b%22%2F%3E%3Cpath%20d%3D%22M6%2010l6-2%208%202%206-2v14l-6%202-8-2-6%202z%22%20fill%3D%22%23f0e4c8%22%2F%3E%3Cpath%20d%3D%22M12%208v14M20%2010v14%22%20stroke%3D%22%232a221c%22%20stroke-width%3D%221.5%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f0e4c8}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stella's Cozy Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Overpass:wght@400..900&family=Shrikhand&display=swap">
<style>
/* Layout: a 1950s service-station road map unfolded into one vertical trip strip;
   story stops are postcards, rewards are ticket stubs, extras live in the glovebox. */
:root {
  --paper: #f0e4c8;      /* map stock */
  --paper-2: #e3d2ad;    /* fold shadow, wells */
  --card: #fbf4e2;       /* postcards, tickets */
  --ink: #2a221c;        /* printing ink */
  --ink-soft: #5e5042;
  --route: #b3362b;      /* highway red */
  --shield: #22477e;     /* interstate blue */
  --park: #56763a;       /* park green */
  --water: #8db6b2;      /* rivers, bay */
  --gold: #c98f22;       /* postmarks, grand prize */
  --on-accent: #fbf4e2;
  --bar-bg: #2a221c;
  --bar-fg: #f0e4c8;
  --scrim: rgba(30, 22, 16, .58);
  --shade: rgba(42, 34, 28, .16);
  --grain-blend: multiply;
  --grain-opacity: .55;

  --f-sign: 'Overpass', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-story: 'Libre Caslon Text', Georgia, 'Times New Roman', serif;
  --f-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --f-mark: 'Shrikhand', 'Cooper Black', Georgia, serif;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --t-xs: .75rem; --t-sm: .875rem; --t-md: 1rem; --t-lg: 1.25rem; --t-xl: 1.6rem; --t-2xl: 2.2rem; --t-3xl: 3rem;
  --radius: 6px;
  --bar-h: 56px;
  --tab-h: 64px;
  --col: 560px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1b24; --paper-2: #262533; --card: #24232f;
    --ink: #efe3c8; --ink-soft: #b7aa92;
    --route: #e0624f; --shield: #86a8e3; --park: #94b56f; --water: #3e6c72; --gold: #e6b24a;
    --on-accent: #1b1b24;
    --bar-bg: #111018; --bar-fg: #efe3c8; --scrim: rgba(4, 4, 8, .72);
    --shade: rgba(0, 0, 0, .45);
    --grain-blend: screen; --grain-opacity: .18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1b24; --paper-2: #262533; --card: #24232f;
  --ink: #efe3c8; --ink-soft: #b7aa92;
  --route: #e0624f; --shield: #86a8e3; --park: #94b56f; --water: #3e6c72; --gold: #e6b24a;
  --on-accent: #1b1b24;
  --bar-bg: #111018; --bar-fg: #efe3c8; --scrim: rgba(4, 4, 8, .72);
  --shade: rgba(0, 0, 0, .45);
  --grain-blend: screen; --grain-opacity: .18;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-sign);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before {
  /* paper grain + fold creases */
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: var(--grain-opacity);
  mix-blend-mode: var(--grain-blend);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .25  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    linear-gradient(90deg, transparent 33.1%, var(--shade) 33.3%, transparent 33.6%, transparent 66.4%, var(--shade) 66.6%, transparent 66.9%);
}
body.in-game { overflow: hidden; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--shield); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell ---------- */
.app { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: var(--s-3);
  min-height: var(--bar-h);
  padding-inline: 16px;
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  box-shadow: 0 2px 0 var(--paper-2);
}
.topbar .brand {
  font-family: var(--f-mark); font-size: clamp(.95rem, 4.4vw, 1.15rem); color: var(--route);
  background: none; border: 0; padding: 4px 0; cursor: pointer; white-space: nowrap;
  line-height: 1.1; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto;
}
.topbar > * { flex-shrink: 0; }
.topbar > .brand { flex-shrink: 1; }
.odometer {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 2px;
  font-family: var(--f-sign); font-weight: 800; font-size: var(--t-xs); letter-spacing: .08em;
  font-variant-numeric: tabular-nums;
}
.odometer .digits { display: inline-flex; gap: 1px; }
.odometer .d {
  display: inline-block; min-width: 1.05em; text-align: center;
  background: var(--ink); color: var(--paper);
  border-radius: 2px; padding: 2px 0; font-size: .8rem;
}
.odometer .unit { margin-left: 4px; color: var(--ink-soft); }
.icon-btn {
  display: inline-grid; place-items: center;
  width: 40px; height: 40px; border-radius: 50%;
  background: transparent; border: 2px solid transparent; cursor: pointer; color: var(--ink);
}
.icon-btn:hover { border-color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }

.screen {
  flex: 1;
  width: 100%; max-width: var(--col);
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: var(--s-5) calc(var(--tab-h) + var(--s-6) + env(safe-area-inset-bottom, 0px));
  min-width: 0;
}
.screen.no-tabs { padding-block-end: var(--s-7); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(3, minmax(0, 180px)); justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bar-bg); color: var(--bar-fg);
}
.tabbar button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--tab-h); border: 0; background: transparent; color: inherit; cursor: pointer;
  font-family: var(--f-sign); font-weight: 800; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  opacity: .7;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { opacity: 1; color: var(--gold); }
.tabbar .badge {
  position: absolute; transform: translate(14px, -14px);
  min-width: 18px; height: 18px; border-radius: 9px; padding-inline: 4px;
  background: var(--route); color: var(--on-accent); font-size: .65rem; line-height: 18px; letter-spacing: 0;
}
.tabbar .tab-icon { position: relative; display: grid; place-items: center; }

/* ---------- type ---------- */
.eyebrow {
  font-family: var(--f-sign); font-weight: 800; font-size: var(--t-xs);
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
}
.sign {
  font-family: var(--f-sign); font-weight: 900; text-transform: uppercase;
  letter-spacing: .02em; line-height: 1.02; text-wrap: balance;
}
.story { font-family: var(--f-story); font-size: 1.06rem; line-height: 1.65; }
.story p { margin: 0 0 .9em; max-width: 34em; }
.hand { font-family: var(--f-hand); font-size: 1.45rem; line-height: 1.2; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 48px; padding: 0 var(--s-5);
  font-family: var(--f-sign); font-weight: 900; font-size: .95rem; letter-spacing: .1em; text-transform: uppercase;
  border: 2px solid var(--ink); border-radius: 999px;
  background: var(--route); color: var(--on-accent);
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer; transition: transform .08s ease, box-shadow .08s ease;
  text-decoration: none;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn svg { width: 20px; height: 20px; }
.btn.secondary { background: var(--card); color: var(--ink); }
.btn.blue { background: var(--shield); }
.btn.green { background: var(--park); }
.btn.small { min-height: 38px; padding: 0 var(--s-4); font-size: .78rem; box-shadow: 0 3px 0 var(--ink); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-btn {
  background: none; border: 0; padding: var(--s-2) 0; cursor: pointer;
  font-family: var(--f-sign); font-weight: 800; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px;
}
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }

/* ---------- title / map cover ---------- */
.cover {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: var(--s-4);
  text-align: center;
  padding-block: var(--s-6) var(--s-5);
}
.cover .compliments {
  font-family: var(--f-sign); font-weight: 800; font-size: .72rem; letter-spacing: .3em; text-transform: uppercase;
  border-block: 2px solid var(--ink); padding: 6px 12px;
}
.cover h1 {
  font-family: var(--f-mark); font-weight: 400; color: var(--route);
  font-size: clamp(2.8rem, 15vw, 4.6rem); line-height: .92;
  text-shadow: 3px 3px 0 var(--paper-2);
  transform: rotate(-4deg);
  margin-block: var(--s-3);
}
.cover h1 span { display: block; }
.cover .tagline { font-weight: 900; letter-spacing: .14em; text-transform: uppercase; font-size: .95rem; }
.cover .edition { font-family: var(--f-hand); font-size: 1.35rem; color: var(--shield); }
.cover-art { width: 100%; max-width: 420px; }
.cover-art svg { width: 100%; height: auto; display: block; }
.cover .progress-line { font-weight: 800; font-size: .85rem; letter-spacing: .08em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.cover .fine { font-size: .78rem; color: var(--ink-soft); }

/* quote ticket */
.quote-ticket {
  position: relative; max-width: 360px; width: 100%;
  background: var(--card); border: 2px dashed var(--ink-soft);
  padding: var(--s-3) var(--s-4); transform: rotate(1.5deg);
  text-align: left;
}
.quote-ticket .eyebrow { margin-bottom: 4px; }
.quote-ticket .hand { font-size: 1.5rem; }
.quote-ticket .by { font-size: .8rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--route); margin-top: 4px; }

/* ---------- map strip ---------- */
.map-head {
  display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--s-3);
  margin-bottom: var(--s-3);
}
.map-head .sign { font-size: var(--t-xl); }
.map-head .meta { font-weight: 800; font-size: .8rem; letter-spacing: .08em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.strip-wrap {
  position: relative;
  border: 2px solid var(--ink);
  background: var(--paper);
  box-shadow: 6px 6px 0 var(--paper-2);
}
.strip-wrap svg { display: block; width: 100%; height: auto; }
.strip .stop { cursor: pointer; }
.strip .stop:focus { outline: none; }
.strip .stop:focus-visible .pin-ring { stroke: var(--shield); stroke-width: 4; }
.strip .stop.locked { cursor: default; }
.strip .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }
.strip .car { transition: none; }
.strip .egg { cursor: pointer; }
.strip text { font-family: var(--f-sign); }
.strip .halo { paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }

.legend {
  display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4);
  font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  margin-top: var(--s-3);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }

/* ---------- stop page (postcard) ---------- */
.stop-page { display: flex; flex-direction: column; gap: var(--s-5); }
.stop-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.route-sign {
  display: inline-flex; flex-direction: column; gap: 2px;
  background: #1f6b45; color: #fbf4e2; /* MUTCD guide-sign green, same in both themes */
  border: 3px solid #fbf4e2; outline: 2px solid #1f6b45;
  border-radius: 8px; padding: var(--s-3) var(--s-4);
  max-width: 100%;
}
.route-sign .sign { font-size: clamp(1.5rem, 7vw, 2.1rem); }
.route-sign .town { font-weight: 700; font-size: .85rem; letter-spacing: .06em; opacity: .9; }
.chapter { font-family: var(--f-story); font-style: italic; font-size: 1.15rem; color: var(--ink-soft); }
.stop-page .story p { opacity: 1; }
.stop-page .story.reveal p { animation: rise .6s ease both; }
.stop-page .story.reveal p:nth-child(2) { animation-delay: .5s; }
.stop-page .story.reveal p:nth-child(3) { animation-delay: 1s; }
.stop-page .story.reveal p:nth-child(4) { animation-delay: 1.5s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.texts {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  background: #1c1c1e; border-radius: 18px; padding: 14px 14px 16px; max-width: 360px; width: 100%;
  font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; /* a phone screen, so a phone font */
}
.texts-head { display: flex; justify-content: space-between; width: 100%; font-size: .72rem; color: #8e8e93; margin-bottom: 4px; }
.texts-head b { color: #e5e5ea; font-weight: 600; }
.texts .bubble { background: #3a3a3c; color: #f2f2f7; border-radius: 16px; padding: 8px 12px; font-size: .92rem; line-height: 1.3; max-width: 85%; }
.strip .car { cursor: pointer; }
.strip .car .car-body.squish { animation: squish .5s ease; transform-box: fill-box; transform-origin: center; }
.road-note { display: flex; align-items: center; gap: var(--s-2); font-weight: 800; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.road-note svg { height: 26px; width: auto; flex: none; }
.road-note > span:last-child { min-width: 0; }
.stop-actions { display: flex; flex-direction: column; gap: var(--s-3); align-items: stretch; }
.stop-actions .note { font-size: .85rem; color: var(--ink-soft); text-align: center; }
.earned {
  display: flex; align-items: center; gap: var(--s-3);
  border: 2px solid var(--ink); background: var(--card); padding: var(--s-3);
}
.earned svg { width: 28px; height: 28px; flex: none; color: var(--route); }

/* polaroid */
.polaroid {
  position: relative; align-self: center;
  width: min(300px, 82%);
  background: #fdfbf5; /* photo paper stays white in both themes */
  padding: 12px 12px 0;
  box-shadow: 0 10px 24px var(--shade), 0 1px 2px var(--shade);
  transform: rotate(-2.5deg);
  color: #2a221c;
}
.polaroid.tilt-r { transform: rotate(2deg); }
.polaroid .ph { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #d8c9a6; }
.polaroid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.18) saturate(1.05) contrast(1.02); }
.polaroid .ph .fallback {
  position: absolute; inset: 0; display: grid; place-items: center;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 55%),
    linear-gradient(160deg, #e6c98f, #c99a5b 55%, #8f6a3f);
  color: rgba(42, 34, 28, .72);
}
.polaroid .ph .fallback svg { width: 42%; height: auto; }
.polaroid .ph .fallback small {
  position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
  font-family: var(--f-sign); font-weight: 800; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7;
}
.polaroid .cap { font-family: var(--f-hand); font-size: 1.35rem; text-align: center; padding: 8px 4px 12px; line-height: 1.1; }
.tape {
  position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; transform: translateX(-50%) rotate(3deg);
  background: rgba(214, 196, 150, .7); box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.polaroid.contain .ph img { object-fit: contain; background: #111; }
.strip .map-photo { cursor: pointer; }
.strip .map-photo:focus { outline: none; }
.strip .map-photo:focus-visible rect:nth-child(2) { stroke: var(--shield); stroke-width: 3; }
.collage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; padding-top: 8px; }
.collage .polaroid.collage-item { width: 100%; padding: 8px 8px 0; cursor: pointer; transform: rotate(var(--rot, -2deg)); }
.collage .polaroid.collage-item:nth-child(3n+2) { margin-top: 18px; }
.collage .polaroid .cap { font-size: 1.05rem; padding: 6px 2px 8px; min-height: 1.6em; }
@media (min-width: 640px) { .collage { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.overlay .polaroid.album-big { width: min(420px, 100%); transform: none; }

/* postmark */
.postmark {
  position: absolute; right: -14px; bottom: 34px; width: 112px; height: 112px;
  color: var(--route); transform: rotate(-14deg); pointer-events: none;
  mix-blend-mode: multiply;
}
:root[data-theme="dark"] .postmark { mix-blend-mode: normal; }
.postmark.carried { color: var(--shield); }
.postmark.stamp-in { animation: stampIn .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampIn { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }

.date-page {
  text-align: center; padding: var(--s-5); border: 2px solid var(--ink); background: var(--card);
  display: flex; flex-direction: column; gap: var(--s-2); align-items: center;
}
.date-page .big { font-family: var(--f-mark); font-size: 2.6rem; color: var(--route); line-height: 1; }

/* ---------- game screen ---------- */
.game-screen {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  background: var(--paper);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.game-bar {
  display: flex; align-items: center; gap: var(--s-2);
  min-height: var(--bar-h); padding-inline: 12px;
  border-bottom: 2px solid var(--ink);
  background: var(--paper);
}
.game-bar .title { font-weight: 900; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-bar .attempt { font-weight: 800; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.game-body { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; }
.game-stage {
  position: relative; flex: 1; max-width: var(--col); min-width: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
.game-canvas { display: block; touch-action: none; }
.game-hud {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 3;

  SCQ.screens.stop = function (root, params) {

  /* ------------------------------------------------------------------ game runner */
  function getParams(gid, eased) {
    const def = SCQ.games[gid] || {};
    const dflt = def.defaults || {};
    const over = (C.difficulty && C.difficulty[gid]) || {};
    const base = Object.assign({}, dflt, over);
    const easedOver = Object.assign({}, dflt.eased || {}, over.eased || {});
    delete base.eased;
    return eased ? Object.assign(base, easedOver) : base;
  }
  const lossesFor = (gid) => Store.state.attempts[gid] || 0;
  const isEased = (gid) => Store.forceEase || lossesFor(gid) >= C.difficulty.easeAfter;

  function startStopGame(stop, opts = {}) {
    Sound.unlock();
    openGame(stop.game, { stop, replay: !!opts.replay, autoplay: !!opts.autoplay });
  }

  function openGame(gid, opts = {}) {
    const def = SCQ.games[gid];
    const stop = opts.stop || null;
    if (!def) { toast('This minigame is still being built. Check back soon.'); return; }
    const sideQuest = !!opts.sideQuest;
    const screen = h('section', { class: 'game-screen', role: 'dialog', 'aria-modal': 'true', 'aria-label': def.title });
    const attemptEl = h('div', { class: 'attempt' });
    const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Leave the game', html: icon('close'), onclick: () => close() });
    const stage = h('div', { class: 'game-stage', tabindex: '-1' });
    const layer = h('div', { class: 'game-card-layer', hidden: true });
    const body = h('div', { class: 'game-body' }, stage, layer);
    screen.append(h('div', { class: 'game-bar' }, closeBtn, h('div', { class: 'title' }, def.title), attemptEl, soundBtn()), body);
    document.body.append(screen);
    document.body.classList.add('in-game');
    let ac = null, resolveDebug = null, closed = false, playing = false;

    function updateAttempt() { attemptEl.textContent = sideQuest || opts.replay ? '' : 'Try ' + (lossesFor(gid) + 1); }
    function showCard(nodes) {
      layer.replaceChildren(h('div', { class: 'game-card' }, nodes));
      layer.hidden = false;
      const b = layer.querySelector('button'); if (b) setTimeout(() => b.focus({ preventScroll: true }), 30);
    }
    function hideCard() { layer.hidden = true; layer.replaceChildren(); }
    function close() {
      if (closed) return;
      closed = true;
      if (ac && !ac.signal.aborted) ac.abort();
      if (resolveDebug) resolveDebug('abort');
      screen.remove();
      document.body.classList.remove('in-game');
      SCQ.test.resolve = null;
      if (SCQ.currentGame && SCQ.currentGame.close === close) SCQ.currentGame = null;
      if (opts.onClose) opts.onClose();
    }

    function intro() {
      updateAttempt();
      const eased = isEased(gid) && !sideQuest;
      showCard([
        h('div', { class: 'eyebrow' }, stop ? stop.place + ' ∙ ' + stop.town : 'Side quest'),
        h('h2', {}, def.title),
        stop && stop.gameIntro ? h('p', { class: 'intro' }, stop.gameIntro) : (def.intro ? h('p', { class: 'intro' }, def.intro) : null),
        def.howTo && def.howTo.length ? h('ul', {}, def.howTo.map((t) => h('li', {}, t))) : null,
        eased && stop && stop.easeLine ? h('p', { class: 'ease-note' }, stop.easeLine) : null,
        h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: play }, 'Start')),
      ]);
    }

    async function play() {
      if (playing) return;
      playing = true;
      hideCard();
      stage.replaceChildren();
      updateAttempt();
      ac = new AbortController();
      const eased = isEased(gid) && !sideQuest;
      const ctx = {
        params: getParams(gid, eased), eased, attempt: lossesFor(gid) + 1, signal: ac.signal,
        sound: Sound, util: SCQ.util, content: C, palette: palette(), debug: Store.debug,
        reducedMotion: reducedMotion(), stop,
      };
      const debugP = new Promise((r) => { resolveDebug = r; });
      SCQ.test.resolve = (r) => resolveDebug && resolveDebug(r);
      let dbar = null;
      if (Store.debug) {
        dbar = h('div', { class: 'debug-bar' }, 'TEST',
          h('button', { type: 'button', onclick: () => resolveDebug('win') }, 'Win'),
          h('button', { type: 'button', onclick: () => resolveDebug('lose') }, 'Lose'));
        const bar = screen.querySelector('.game-bar');
        bar.insertBefore(dbar, bar.lastElementChild);
      }
      let result;
      try {
        result = await Promise.race([Promise.resolve().then(() => def.start(stage, ctx)), debugP]);
      } catch (err) {
        if (!(err && err.name === 'AbortError')) { console.error('[game]', gid, err); result = 'error'; } else result = 'abort';
      } finally {
        if (ac && !ac.signal.aborted) ac.abort();
        if (dbar) dbar.remove();
        playing = false;
      }
      if (closed || result === 'abort') return;
      if (result === 'win') onWin();
      else if (result === 'lose') onLose();
      else onError();
    }

    function finishFirstTime(carried) {
      const first = stop && !opts.replay ? completeStop(stop, carried) : false;
      return first;
    }
    function afterComplete() {
      close();
      const idx = stopIndex(stop.id);
      const next = () => {
        if (stop.afterPage) showAfterPage(stop, () => continueTrip());
        else continueTrip();
      };
      const continueTrip = () => {
        if (stop.finale) go('letter', { fromFinale: true });
        else go('map', { advanceFrom: idx });
      };
      if (stop.card) showTicketReveal(stop.card, next); else next();
    }

    function onWin() {
      Sound.play('win');
      if (sideQuest) {
        Store.state.wins[gid] = (Store.state.wins[gid] || 0) + 1; Store.save();
        showCard([h('h2', {}, def.winTitle || 'You won.'), def.winLine ? h('p', { class: 'quip' }, def.winLine) : null,
          h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: play }, 'Play again'), h('button', { class: 'btn secondary', type: 'button', onclick: close }, 'Done'))]);
        return;
      }
      Store.state.wins[gid] = (Store.state.wins[gid] || 0) + 1;
      const first = finishFirstTime(false);
      Store.save();
      if (first) {
        showCard([
          h('div', { class: 'eyebrow' }, 'Stop complete'),
          h('h2', {}, 'You won.'),
          h('p', { class: 'quip' }, stop.winLine || ''),
          stop.card && C.cards[stop.card] ? h('p', { class: 'intro' }, 'A new date goes into the pool.') : null,
          h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: afterComplete }, stop.card ? 'Add it to the pool' : 'Continue')),
        ]);
      } else {
        showCard([
          h('h2', {}, 'Still got it.'),
          h('p', { class: 'quip' }, stop ? stop.winLine : ''),
          h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: play }, 'Play again'), h('button', { class: 'btn secondary', type: 'button', onclick: close }, 'Done')),
        ]);
      }
    }

    function onLose() {
      Sound.play('lose');
      if (sideQuest) {
        showCard([h('h2', {}, 'Not this time.'), h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: play }, 'Try again'), h('button', { class: 'btn secondary', type: 'button', onclick: close }, 'Done'))]);
        return;
      }
      Store.state.attempts[gid] = lossesFor(gid) + 1;
      Store.save();
      const n = lossesFor(gid);
      const lines = (stop && stop.loseLines) || ['Run it back.'];
      const justEased = n === C.difficulty.easeAfter;
      const canCarry = stop && !opts.replay && !Store.state.done[stop.id] && n >= C.difficulty.skipAfter;
      showCard([
        h('div', { class: 'tries' }, n === 1 ? '1 try so far' : n + ' tries so far'),
        h('h2', {}, 'Not this time.'),
        h('p', { class: 'quip' }, lines[(n - 1) % lines.length]),
        justEased && stop && stop.easeLine ? h('p', { class: 'ease-note' }, stop.easeLine) : null,
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn', type: 'button', onclick: play }, 'Try again'),
          canCarry ? h('button', { class: 'btn secondary', type: 'button', onclick: carry }, 'Let Micah carry you') : null),
        h('button', { class: 'link-btn', type: 'button', onclick: close }, 'Back to the map'),
      ]);
    }

    function carry() {
      Sound.play('coin');
      finishFirstTime(true);
      showCard([
        h('div', { class: 'eyebrow' }, 'Stop complete'),
        h('h2', {}, 'Carried.'),
        h('p', { class: 'quip' }, 'I carried you through this one, same as the walk from guest parking to your door. You carried me at Bold Rock, so we are even.'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: afterComplete }, stop.card ? 'Add it to the pool' : 'Continue')),
      ]);
    }

    function onError() {
      const canCarry = stop && !opts.replay && !Store.state.done[stop.id];
      showCard([
        h('h2', {}, 'Flat tire'),
        h('p', { class: 'intro' }, 'This game hit a snag. Try it again, or skip it and keep the date.'),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn', type: 'button', onclick: play }, 'Try again'),
          canCarry ? h('button', { class: 'btn secondary', type: 'button', onclick: carry }, 'Skip ahead') : null),
        h('button', { class: 'link-btn', type: 'button', onclick: close }, 'Back to the map'),
      ]);
    }

    if (SCQ.currentGame) SCQ.currentGame.close();
    SCQ.currentGame = { close, play };
    if (opts.autoplay) play(); else intro();
    return SCQ.currentGame;
  }
  SCQ.openGame = openGame;

  /* ------------------------------------------------------------------ reveal overlays */
  function showTicketReveal(cardId, onDone) {
    Sound.play('coin');
    const card = C.cards[cardId];
    if (!card) { if (onDone) onDone(); return; }
    let ov = null;
    let after = onDone;
    const done = () => { if (ov) ov.close(); };
    const inPool = Object.keys(Store.state.tickets).filter((id) => C.cards[id]).length;
    const total = Object.keys(C.cards).length;
    ov = overlay([
      h('div', { class: 'eyebrow center' }, 'Added to the date pool'),
      h('h2', {}, inPool + ' of ' + total),
      ticketEl(cardId, { big: true }),
      h('p', { class: 'center', style: { color: 'var(--ink-soft)', fontSize: '.9rem' } },
        inPool >= total ? 'The pool is full. One roll decides the date.' : 'At the end of the road you roll once, and that is the date.'),
      h('div', { class: 'btn-row', style: { justifyContent: 'center' } },
        h('button', { class: 'btn', type: 'button', onclick: done }, 'Continue'),
        h('button', { class: 'btn secondary', type: 'button', onclick: () => { after = () => go('deck'); done(); } }, 'See the pool')),
    ], { onClose: () => { if (after) { const f = after; after = null; f(); } } });
  }
  function showAfterPage(stop, onDone) {
    Sound.play('good');
    let ov = null;
    ov = overlay([
      h('div', { class: 'date-page', style: { border: '0', background: 'transparent' } },
        h('div', { class: 'eyebrow' }, 'Meanwhile, in Seaford'),
        h('div', { class: 'big' }, stop.afterPage.title),
        h('div', { class: 'hand' }, stop.afterPage.text)),
      h('button', { class: 'btn', type: 'button', onclick: () => ov.close() }, 'Keep driving'),
    ], { onClose: onDone });
  }
  SCQ.showTicketReveal = showTicketReveal;

  function findEgg(id) {
    const egg = (C.easterEggs || []).find((x) => x.id === id);
    if (!egg) return;
    Sound.unlock();
    Sound.play(egg.sound || 'coin');
    const st = Store.state;
    st.eggs = st.eggs || {};
    const first = !st.eggs[id];
    if (first) { st.eggs[id] = new Date().toISOString(); Store.save(); }
    const found = Object.keys(st.eggs).filter((k) => C.easterEggs.some((x) => x.id === k)).length;
    toast(egg.text, { title: first ? 'Easter egg ' + found + ' of ' + C.easterEggs.length + ': ' + egg.title : egg.title, ms: 5200 });
  }
  SCQ.findEgg = findEgg;

  /* ------------------------------------------------------------------ exports for other modules */
  Object.assign(SCQ, {
    C, h, $, icon, iconEl, shieldG, shieldSVG, postmarkSVG, fmtDate, toast, overlay, confirmInline, photoEl, ticketEl,
    Store, Sync, Sound, stops, stopById, stopIndex, firstOpenIndex, isUnlocked, carIndex, milesTo, totalMiles, odometerMiles,
    doneCount, keyStops, cardSource, sideQuestUnlocked, worksTonight, completeStop, redeemedAt, isWatched, startStopGame, Router,
    defaultState, updateChrome, reducedMotion, sleep, pick, shuffle,
  });
  SCQ.test = { resolve: null, state: () => Store.state, go, openGame };

  /* ------------------------------------------------------------------ debug routes (for testing; never saved) */
  function fillDone(n, carriedIdx) {
    const st = Store.state;
    const base = Date.now() - n * 86400000;
    stops.slice(0, n).forEach((s, i) => {
      st.done[s.id] = { at: new Date(base + i * 86400000).toISOString(), carried: i === carriedIdx };
      if (s.card) st.tickets[s.card] = st.done[s.id].at;
      st.storySeen[s.id] = true;
    });
    st.started = true;
  }
  function debugRoute(tok) {
    Store.state = defaultState();
    Store.state.sound = false;
    Sound.enabled = false;
    Store.unlockAll = false;
    Store.forceEase = false;
    const rest = tok.slice(4);
    const after = (prefix) => rest.slice(prefix.length);
    if (rest === 'title') return go('title');
    if (rest === 'title-started') { fillDone(6); return go('title'); }
    if (rest === 'map') return go('map');
    if (rest === 'map-mid') { fillDone(8, 4); return go('map'); }
    if (rest === 'map-done') { fillDone(stops.length, 4); return go('map'); }
    if (rest === 'advance') { fillDone(4); return go('map', { advanceFrom: 3 }); }
    if (rest.startsWith('stopdone-')) { const i = stopIndex(after('stopdone-')); fillDone(i + 1); return go('stop', { id: after('stopdone-') }); }
    if (rest.startsWith('stop-')) { Store.unlockAll = true; return go('stop', { id: after('stop-') }); }
    if (rest.startsWith('intro-')) { go('map'); return openGame(after('intro-'), { stop: stops.find((s) => s.game === after('intro-')) }); }
    if (rest.startsWith('play-')) { go('map'); return openGame(after('play-'), { stop: stops.find((s) => s.game === after('play-')), autoplay: true, sideQuest: !stops.some((s) => s.game === after('play-')) }); }
    if (rest.startsWith('eased-')) { Store.forceEase = true; go('map'); return openGame(after('eased-'), { stop: stops.find((s) => s.game === after('eased-')), autoplay: true }); }
    if (rest.startsWith('ticket-')) { fillDone(3); go('map'); return showTicketReveal(after('ticket-'), () => {}); }
    if (rest === 'july') { fillDone(4); go('map'); return showAfterPage(stopById('seaford'), () => {}); }
    if (rest === 'deck') { fillDone(stops.length); return go('deck'); }
    if (rest === 'deck-rolled') { fillDone(stops.length); const ids = Object.keys(C.cards); Store.state.roll = { cardId: ids[3 % ids.length], at: new Date().toISOString() }; return go('deck'); }
    if (rest === 'roll') { fillDone(stops.length); return go('deck', { roll: true }); }
    if (rest === 'deck-mid') { fillDone(8); return go('deck'); }
    if (rest === 'deck-empty') return go('deck');
    if (rest === 'glovebox') { fillDone(9); return go('glovebox'); }
    if (rest === 'glovebox-done') { fillDone(stops.length); (C.easterEggs || []).slice(0, 3).forEach((x) => { Store.state.eggs[x.id] = new Date().toISOString(); }); return go('glovebox'); }
    if (['shelf', 'portrait', 'quotes', 'stamps', 'micah', 'collage'].includes(rest)) { fillDone(stops.length, 4); return go(rest); }
    if (rest === 'polaroid') { fillDone(stops.length); go('glovebox'); return openGame('polaroid', { sideQuest: true, autoplay: true }); }
    if (rest === 'letter') { fillDone(stops.length); return go('letter', { fromFinale: true }); }
    go('title');
  }

  /* ------------------------------------------------------------------ boot */
  function start(hotData) {
    const tok = (location.hash || '').replace(/^#/, '');
    Store.debug = tok === 'debug' || tok.startsWith('dbg-');
    Store.sandbox = Store.debug;
    if (Store.sandbox) Store.state = defaultState(); else Store.load();
    Sound.enabled = Store.state.sound !== false;
    buildShell();
    ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, () => Sound.unlock(), { passive: true, capture: true }));
    if (!Store.sandbox) Sync.init();
    Sync.on(() => { if (Router.name && SCQ.screens[Router.name] && SCQ.screens[Router.name].live) SCQ.screens[Router.name].live(); });

    if (tok.startsWith('dbg-')) return debugRoute(tok);
    if (tok === 'debug') {
      Store.unlockAll = true;
      Store.state.started = true;
      toast('Test drive: everything is unlocked and nothing is saved.', { title: 'Debug mode', ms: 4500 });
      return go('map');
    }
    if (tok === 'micah') return go('micah');
    if (hotData && hotData.route && SCQ.screens[hotData.route] && hotData.route !== 'stop') return go(hotData.route);
    if (['map', 'deck', 'glovebox'].includes(tok)) return go(tok);
    go('title');
  }
  window.addEventListener('hashchange', () => {
    const tok = (location.hash || '').replace(/^#/, '');
    if (tok.startsWith('dbg-')) {
      if (SCQ.currentGame) SCQ.currentGame.close();
      document.querySelectorAll('.game-screen, .overlay').forEach((el) => el.remove());
      document.body.classList.remove('in-game');
      Store.debug = true; Store.sandbox = true;
      debugRoute(tok);
    }
  });
  SCQ.boot = function () {
    const hot = window.claude && window.claude.hot;
    try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ route: Router.name })); } catch (e) { /* optional */ }
    if (hot && typeof hot.ready === 'function') hot.ready(start);
    else start((hot && hot.data) || {});
  };
})();

</script>
<script>/* map.js */
/* Stella's Cozy Quest - the road map: one long vertical trip strip. */
(function () {
  'use strict';
  const SCQ = window.SCQ;
  const { C, h, icon, shieldG, postmarkSVG, toast, Store, Sound, stops } = SCQ;

  const W = 400, TOP = 190, SP = 200, BOTTOM = 210;
  const xAt = (i) => Math.round(200 + 92 * Math.sin(i * 1.15 + 0.35));
  const yAt = (i) => TOP + i * SP;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const seg = (i) => {
    const x0 = xAt(i - 1), y0 = yAt(i - 1), x1 = xAt(i), y1 = yAt(i), d = SP * 0.5;
    return `M${x0} ${y0} C${x0} ${y0 + d} ${x1} ${y1 - d} ${x1} ${y1}`;
  };
  function textWidth(str, size, k = 0.6) { return String(str).length * size * k; }

  /* deterministic little scatter for decorations */
  function rng(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

  function decor(stop, i, side) {
    const x = xAt(i), y = yAt(i);
    const r = rng(i + 7);
    const dir = side; // +1 = right of the pin, -1 = left
    const out = [];
    const ax = x + dir * 58; // anchor for decorations
    switch (stop.terrain) {
      case 'ocean': {
        const edge = dir > 0 ? W : 0;
        const inner = dir > 0 ? Math.max(x + 70, 310) : Math.min(x - 70, 90);
        out.push(`<path d="M${edge} ${y - 120} L${inner} ${y - 120} C${inner - dir * 22} ${y - 60} ${inner + dir * 18} ${y - 20} ${inner - dir * 10} ${y + 30} S${inner + dir * 16} ${y + 100} ${inner} ${y + 130} L${edge} ${y + 130}Z" style="fill:var(--water)" opacity=".55"/>`);
        for (let k = 0; k < 5; k++) {
          const wx = inner + dir * (22 + r() * 40), wy = y - 90 + k * 46;
          out.push(`<path d="M${wx - 12} ${wy} q6 -5 12 0 t12 0" fill="none" style="stroke:var(--shield)" stroke-width="1.6" opacity=".6"/>`);
        }
        out.push(`<text x="${edge - dir * 10}" y="${y - 64}" text-anchor="${dir > 0 ? 'end' : 'start'}" style="font:italic 400 12px ${SCQ.util.FONTS.story};fill:var(--shield);letter-spacing:1px" opacity=".85">Atlantic</text>`);
        break;
      }
      case 'river': {
        const y0 = y + 46;
        out.push(`<path d="M0 ${y0 + 24} C80 ${y0 - 10} 150 ${y0 + 40} 230 ${y0 + 6} S350 ${y0 - 20} 400 ${y0 + 10}" fill="none" style="stroke:var(--water)" stroke-width="16" stroke-linecap="round" opacity=".6"/>`);
        out.push(`<text x="${Math.max(50, Math.min(W - 50, ax + dir * 30))}" y="${y0 - 8}" text-anchor="middle" style="font:italic 400 11px ${SCQ.util.FONTS.story};fill:var(--shield)" opacity=".85">${stop.id === 'yorktown' ? 'York River' : 'Rappahannock'}</text>`);
        break;
      }
      case 'marsh': {
        for (let k = 0; k < 9; k++) {
          const tx = ax + dir * (r() * 70) - 10, ty = y - 50 + r() * 100;
          out.push(`<path d="M${tx} ${ty} l-4 -9 M${tx} ${ty} l0 -11 M${tx} ${ty} l4 -9" style="stroke:var(--park)" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>`);
        }
        out.push(`<ellipse cx="${ax + dir * 40}" cy="${y + 40}" rx="40" ry="12" style="fill:var(--water)" opacity=".45"/>`);
        break;
      }
      case 'city': {
        const bx = ax + (dir > 0 ? 0 : -70), by = y - 46;
        for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) {
          if (r() < 0.25) continue;
          out.push(`<rect x="${bx + col * 18}" y="${by + row * 18}" width="14" height="14" style="fill:var(--ink)" opacity="${0.12 + r() * 0.14}"/>`);
        }
        break;
      }
      case 'mountains': {
        for (let k = 0; k < 5; k++) {
          const mx = ax + dir * (k * 22) - 20, my = y + 30 - (k % 2) * 16, s = 24 + r() * 16;
          out.push(`<path d="M${mx - s} ${my} L${mx} ${my - s * 1.15} L${mx + s} ${my}Z" style="fill:var(--park)" opacity="${0.35 + r() * 0.3}"/>`);
          out.push(`<path d="M${mx - s * 0.25} ${my - s * 0.86} L${mx} ${my - s * 1.15} L${mx + s * 0.25} ${my - s * 0.86}" fill="none" style="stroke:var(--card)" stroke-width="2"/>`);
        }
        out.push(`<text class="halo" x="${Math.max(56, Math.min(W - 56, ax + dir * 40))}" y="${y + 26}" text-anchor="middle" style="font:800 9px ${SCQ.util.FONTS.sign};fill:var(--park);letter-spacing:3px">BLUE RIDGE</text>`);
        break;
      }
      case 'hills': {
        for (let k = 0; k < 3; k++) {
          const hx = ax + dir * k * 34 - 16, hy = y + 34;
          out.push(`<path d="M${hx - 36} ${hy} Q${hx} ${hy - 40} ${hx + 36} ${hy}Z" style="fill:var(--park)" opacity="${0.3 + k * 0.12}"/>`);
        }
        break;
      }
      case 'orchard': {
        for (let row = 0; row < 3; row++) for (let col = 0; col < 4; col++) {
          const tx = ax + dir * col * 20 - 8 + (row % 2) * 8, ty = y - 26 + row * 22;
          out.push(`<circle cx="${tx}" cy="${ty}" r="7" style="fill:var(--park)" opacity=".7"/><circle cx="${tx + 2}" cy="${ty - 1}" r="1.8" style="fill:var(--route)"/>`);
        }
        break;
      }
      case 'town': {
        for (let k = 0; k < 4; k++) {
          const hx = ax + dir * k * 22 - 10, hy = y + 18 + (k % 2) * 12;
          out.push(`<path d="M${hx - 8} ${hy} V${hy - 10} L${hx} ${hy - 17} L${hx + 8} ${hy - 10} V${hy}Z" style="fill:var(--card);stroke:var(--ink)" stroke-width="1.4" opacity=".85"/>`);
        }
        break;
      }
      case 'house': {
        out.push(`<g transform="translate(${ax - 14} ${y - 18}) scale(1.3)" style="color:var(--ink-soft)">${icon('house').replace('<svg', '<svg width="24" height="24"')}</g>`);
        break;
      }
      case 'night': {
        out.push(`<circle cx="${ax + dir * 30}" cy="${y - 44}" r="13" style="fill:var(--gold)" opacity=".85"/><circle cx="${ax + dir * 30 + 6}" cy="${y - 48}" r="11" style="fill:var(--paper)"/>`);
        for (let k = 0; k < 9; k++) {
          const sx = ax + dir * (r() * 90) - 20, sy = y - 70 + r() * 120;
          out.push(`<path d="M${sx} ${sy - 4} L${sx} ${sy + 4} M${sx - 4} ${sy} L${sx + 4} ${sy}" style="stroke:var(--gold)" stroke-width="1.4" opacity=".8"/>`);
        }
        break;
      }
    }
    return out.join('');
  }

  function stopLabel(stop, i, side, state) {
    const x = xAt(i), y = yAt(i);
    const anchor = side < 0 ? 'end' : 'start';
    const tx = x + side * 34;
    const avail = side < 0 ? tx - 10 : W - tx - 10;
    let size = 15;
    while (size > 10 && textWidth(stop.place.toUpperCase(), size, 0.64) > avail) size -= 0.5;
    const ink = state === 'locked' ? 'var(--ink-soft)' : 'var(--ink)';
    const tag = state === 'current' ? `<text x="${tx}" y="${y - 26}" text-anchor="${anchor}" style="font:900 9.5px ${SCQ.util.FONTS.sign};fill:var(--route);letter-spacing:2.5px">NEXT STOP</text>` : '';
    return `${tag}<text class="halo" x="${tx}" y="${y - 6}" text-anchor="${anchor}" style="font:900 ${size}px ${SCQ.util.FONTS.sign};fill:${ink};letter-spacing:.5px">${esc(stop.place.toUpperCase())}</text>` +
      `<text class="halo" x="${tx}" y="${y + 10}" text-anchor="${anchor}" style="font:700 10.5px ${SCQ.util.FONTS.sign};fill:var(--ink-soft);letter-spacing:.6px">${esc(stop.town.toUpperCase())}</text>` +
      `<text class="halo" x="${tx}" y="${y + 30}" text-anchor="${anchor}" style="font:600 17px ${SCQ.util.FONTS.hand};fill:${state === 'locked' ? 'var(--ink-soft)' : 'var(--shield)'}">${esc(stop.chapter)}</text>`;
  }

  function roadLabel(stop, i) {
    if (!stop.road) return '';
    const xm = (xAt(i - 1) + xAt(i)) / 2, ym = (yAt(i - 1) + yAt(i)) / 2;
    const side = xm > 200 ? -1 : 1;
    const shields = stop.road.shields || [];
    const bx = xm + side * 24;
    const anchor = side < 0 ? 'end' : 'start';
    const miles = stop.road.miles < 1 ? '0.1 MI' : '≈ ' + stop.road.miles + ' MI';
    let out = '';
    let cx = side < 0 ? bx - shields.length * 26 : bx;
    shields.forEach(([t, n], k) => { out += `<g transform="translate(${cx + k * 26} ${ym - 30}) scale(.8)">${shieldG(t, n)}</g>`; });
    const milesX = shields.length ? (side < 0 ? cx - 6 : cx + shields.length * 26 + 4) : bx;
    out += `<text class="halo" x="${milesX}" y="${ym - 13}" text-anchor="${anchor}" style="font:900 10px ${SCQ.util.FONTS.sign};fill:var(--route);letter-spacing:1px">${miles}</text>`;
    const avail = side < 0 ? bx - 6 : W - bx - 6;
    let size = 10.5;
    while (size > 8 && textWidth(stop.road.name, size, 0.55) > avail) size -= 0.5;
    out += `<text class="halo" x="${bx}" y="${ym + 4}" text-anchor="${anchor}" style="font:700 ${size}px ${SCQ.util.FONTS.sign};fill:var(--ink-soft)">${esc(stop.road.name)}</text>`;
    return out;
  }

  function carMarkup() {
    return `<g class="car-body" transform="translate(-23 -14)">
      <path d="M0 18 L4 9 Q6 5 11 5 H26 Q31 5 34 9 L40 13 Q46 14 46 18 V22 H0Z" style="fill:var(--route);stroke:var(--ink)" stroke-width="2"/>
      <path d="M10 8 H24 L28 13 H7Z" style="fill:var(--card);stroke:var(--ink)" stroke-width="1.5"/>
      <circle cx="10" cy="22" r="5" style="fill:var(--ink)"/><circle cx="36" cy="22" r="5" style="fill:var(--ink)"/>
      <circle cx="10" cy="22" r="2" style="fill:var(--card)"/><circle cx="36" cy="22" r="2" style="fill:var(--card)"/>
    </g>`;
  }

  function buildSVG(state) {
    const n = stops.length;
    const H = TOP + (n - 1) * SP + BOTTOM;
    const open = SCQ.firstOpenIndex();
    const car = SCQ.carIndex();
    const F = SCQ.util.FONTS;
    const parts = [];
    parts.push(`<svg class="strip" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" role="group" aria-label="Road map with ${n} stops">`);
    parts.push('<defs><linearGradient id="developing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e1cc"/><stop offset="1" stop-color="#9d917a"/></linearGradient></defs>');
    // folds
    parts.push(`<g style="stroke:var(--ink)" opacity=".07" stroke-width="2"><line x1="133" y1="0" x2="133" y2="${H}"/><line x1="267" y1="0" x2="267" y2="${H}"/>${Array.from({ length: Math.floor(H / 420) }, (_, k) => `<line x1="0" y1="${(k + 1) * 420}" x2="${W}" y2="${(k + 1) * 420}"/>`).join('')}</g>`);
    // header cartouche
    parts.push(`<g>
      <rect x="16" y="16" width="246" height="112" style="fill:var(--card);stroke:var(--ink)" stroke-width="2.5"/>
      <rect x="22" y="22" width="234" height="100" fill="none" style="stroke:var(--ink)" stroke-width="1"/>
      <text x="139" y="50" text-anchor="middle" style="font:900 19px ${F.sign};fill:var(--ink);letter-spacing:2px">OFFICIAL ROAD MAP</text>
      <text x="139" y="76" text-anchor="middle" style="font:400 22px ${F.mark};fill:var(--route)">Stella &amp; Micah</text>
      <line x1="44" y1="92" x2="234" y2="92" style="stroke:var(--ink)" stroke-width="1"/>
      <text x="139" y="110" text-anchor="middle" style="font:700 9.5px ${F.sign};fill:var(--ink-soft);letter-spacing:1.5px">EST. JULY 11 ∙ NOT TO SCALE</text>
    </g>`);
    // compass
    parts.push(`<g transform="translate(330 72)">
      <circle r="38" fill="none" style="stroke:var(--ink)" stroke-width="1.5"/><circle r="31" fill="none" style="stroke:var(--ink)" stroke-width=".8" stroke-dasharray="2 3"/>
      <path d="M0 -34 L7 0 L0 34 L-7 0Z" style="fill:var(--ink)"/><path d="M0 -34 L7 0 L-7 0Z" style="fill:var(--route)"/>
      <path d="M-34 0 L0 -6 L34 0 L0 6Z" style="fill:var(--ink)" opacity=".55"/>
      <text y="-42" text-anchor="middle" style="font:900 11px ${F.sign};fill:var(--ink)">N</text>
    </g>`);
    // decorations (behind everything)
    stops.forEach((s, i) => {
      const side = xAt(i) > 200 ? -1 : 1; // label side
      parts.push(decor(s, i, -side));
      if (s.stateLine) {
        const ly = yAt(i) - 52;
        parts.push(`<line x1="0" y1="${ly}" x2="${W}" y2="${ly}" style="stroke:var(--ink)" stroke-width="2" stroke-dasharray="10 4 2 4" opacity=".55"/>
          <text x="12" y="${ly - 7}" style="font:900 10px ${F.sign};fill:var(--ink-soft);letter-spacing:3px">${s.stateLine === 'NC' ? 'VIRGINIA' : 'NORTH CAROLINA'}</text>
          <text x="12" y="${ly + 16}" style="font:900 10px ${F.sign};fill:var(--ink-soft);letter-spacing:3px">${s.stateLine === 'NC' ? 'NORTH CAROLINA' : 'VIRGINIA'}</text>`);
      }
    });
    // route: driven segments solid, the rest dotted
    for (let i = 1; i < n; i++) {
      const d = seg(i);
      const driven = i <= car && (i < open || open >= n || i <= open);
      if (i <= car) {
        parts.push(`<path d="${d}" fill="none" style="stroke:var(--ink)" stroke-width="10" stroke-linecap="round"/>`);
        parts.push(`<path d="${d}" fill="none" style="stroke:var(--route)" stroke-width="5.5" stroke-linecap="round"/>`);
      } else {
        parts.push(`<path d="${d}" fill="none" style="stroke:var(--ink-soft)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 9"/>`);
      }
      void driven;
      parts.push(`<path id="seg-${i}" d="${d}" fill="none" stroke="none"/>`);
    }
    // road labels
    stops.forEach((s, i) => { if (i > 0) parts.push(roadLabel(s, i)); });
    // start + end signs
    parts.push(`<g transform="translate(${xAt(0)} ${yAt(0) - 52})"><rect x="-30" y="-12" width="60" height="18" rx="2" fill="#1f6b45"/><text y="1.5" text-anchor="middle" style="font:900 10px ${F.sign};fill:#fbf4e2;letter-spacing:2px">START</text></g>`);
    const ly = yAt(n - 1);
    parts.push(`<g transform="translate(200 ${ly + 120})">
      <rect x="-150" y="-26" width="300" height="52" rx="4" fill="#1f6b45" stroke="#fbf4e2" stroke-width="3"/>
      <text y="-3" text-anchor="middle" style="font:900 14px ${F.sign};fill:#fbf4e2;letter-spacing:2px">END OF ROUTE</text>
      <text y="15" text-anchor="middle" style="font:700 11px ${F.sign};fill:#fbf4e2;letter-spacing:2px">TO BE CONTINUED</text>
    </g>`);
    // photos taped beside the road, clear of the route and the road sign
    const files = window.SCQ_PHOTOS || {};
    (C.mapPhotos || []).forEach((p, k) => {
      const i = stops.findIndex((s) => s.id === p.after) + 1;
      if (i < 1 || i >= stops.length || !files[p.slot]) return;
      const x0 = xAt(i - 1), x1 = xAt(i), ym = (yAt(i - 1) + yAt(i)) / 2 - (stops[i].stateLine ? 20 : 0);
      const labelSide = (x0 + x1) / 2 > 200 ? -1 : 1;
      const cx = Math.max(46, Math.min(W - 46, labelSide < 0 ? Math.max(x0, x1) + 54 : Math.min(x0, x1) - 54));
      const developed = true;
      const rot = k % 2 ? 6 : -6;
      const img = developed
        ? `<rect x="-28" y="-33" width="56" height="56" fill="#1c1c1e"/><image href="photos/${esc(files[p.slot])}" xlink:href="photos/${esc(files[p.slot])}" x="-28" y="-33" width="56" height="56" preserveAspectRatio="${p.fit === 'contain' ? 'xMidYMid meet' : 'xMidYMid slice'}"/>`
        : `<rect x="-28" y="-33" width="56" height="56" fill="#cbbf9f"/><rect x="-28" y="-33" width="56" height="56" fill="url(#developing)"/>`;
      parts.push(`<g class="map-photo${developed ? '' : ' undeveloped'}" data-photo="${k}" role="button" tabindex="0" aria-label="${developed ? 'Photo: ' + esc(p.caption) : 'A photo that has not developed yet'}" transform="translate(${Math.round(cx)} ${Math.round(ym)}) rotate(${rot})">
        <rect x="-30" y="-35" width="64" height="74" fill="rgba(0,0,0,.18)"/>
        <rect x="-32" y="-37" width="64" height="74" fill="#fdfbf5" stroke="rgba(42,34,28,.3)" stroke-width=".8"/>
        ${img}
        <rect x="-13" y="-42" width="26" height="9" fill="rgba(214,196,150,.8)" transform="rotate(-5)"/>
      </g>`);
    });

    // easter eggs (see content.easterEggs)
    const eggOn = (id) => (C.easterEggs || []).some((x) => x.id === id && x.where !== 'game');
    const at = (id) => { const i = stops.findIndex((s) => s.id === id); return i < 0 ? null : { i, x: xAt(i), y: yAt(i), side: xAt(i) > 200 ? -1 : 1 }; };
    const egg = (id, x, y, rot, body, label) => {
      if (!eggOn(id)) return;
      parts.push(`<g class="egg" data-egg="${id}" transform="translate(${Math.round(x)} ${Math.round(y)}) rotate(${rot})" role="button" tabindex="0" aria-label="${label}"><g class="egg-body">${body}</g><circle r="22" fill="transparent"/></g>`);
    };
    const tag = at('taphouse');
    if (tag) egg('bryce', tag.x - tag.side * 64, tag.y + 44, -9,
      `<rect x="-24" y="-15" width="48" height="30" rx="3" fill="#fbf4e2" stroke="#2a221c" stroke-width="1.2"/>
       <rect x="-24" y="-15" width="48" height="10" rx="3" fill="#b3362b"/>
       <text y="-7.5" text-anchor="middle" fill="#fbf4e2" style="font:900 6px ${F.sign};letter-spacing:.8px">HELLO</text>
       <text y="9" text-anchor="middle" fill="#22477e" style="font:600 12px ${F.hand}">Bryce</text>`, 'A name tag');
    if (stops.length > 2) {
      const xm = (xAt(1) + xAt(2)) / 2, ym = (yAt(1) + yAt(2)) / 2;
      const labelSide = xm > 200 ? -1 : 1;
      egg('woo', xm - labelSide * 46, ym + 6, 0,
        `<line x1="0" y1="-2" x2="0" y2="22" stroke="#2a221c" stroke-width="2"/>
         <rect x="-30" y="-14" width="60" height="13" rx="2" fill="#1f6b45" stroke="#fbf4e2" stroke-width="1"/>
         <text y="-4.5" text-anchor="middle" fill="#fbf4e2" style="font:900 7.5px ${F.sign};letter-spacing:.6px">WOOOOOO ST</text>`, 'A street sign');
    }
    const sea = at('seaford');
    if (sea) egg('cushion', sea.x - sea.side * 30, sea.y + 52, -18,
      `<ellipse rx="14" ry="10" style="fill:color-mix(in srgb, var(--route) 45%, var(--card));stroke:var(--ink)" stroke-width="1.4"/>
       <path d="M10 6 l8 6 l-2 3 l-8 -5z" style="fill:color-mix(in srgb, var(--route) 45%, var(--card));stroke:var(--ink)" stroke-width="1.2"/>`, 'A suspicious cushion');
    const shen = at('shenandoah');
    if (shen) egg('ankle', shen.x + shen.side * 52, shen.y + 62, 0,
      `<ellipse rx="20" ry="6" style="fill:var(--water)" opacity=".7"/>
       <path d="M-8 0 q0 -9 8 -9 q4 -7 9 -2 q2 3 -2 5 l6 1 q-1 6 -9 6 h-6 q-6 0 -6 -1z" fill="#e8b93a" stroke="#2a221c" stroke-width="1"/>
       <circle cx="4" cy="-8" r="1" fill="#2a221c"/>`, 'A rubber duck');
    const cm = at('carters');
    if (cm) egg('eden', cm.x - cm.side * 104, cm.y + 24, 0,
      `<circle r="7.5" fill="#d9a32a" stroke="#2a221c" stroke-width="1"/>
       <path d="M0 -7 q1 -5 4 -6" fill="none" stroke="#2a221c" stroke-width="1.2"/>
       <path d="M2 -9 q5 -3 7 1 q-4 2 -7 -1z" fill="#56763a"/>`, 'An unusual apple');
    const jo = at('joes-inn');
    if (jo) egg('lift', jo.x - jo.side * 92, jo.y - 40, -12,
      `<path d="M-14 0 a14 14 0 0 0 28 0z" fill="#3f7a3a" stroke="#2a221c" stroke-width="1.1"/>
       <path d="M-11 0 a11 11 0 0 0 22 0z" fill="#e05a5a"/>
       <circle cx="-5" cy="4" r="1" fill="#2a221c"/><circle cx="0" cy="6" r="1" fill="#2a221c"/><circle cx="5" cy="4" r="1" fill="#2a221c"/>`, 'A watermelon');
    const jul = at('july-11');
    if (jul) egg('flowers', jul.x - jul.side * 46, jul.y + 40, 8,
      `<path d="M0 14 L-6 -2 M0 14 L0 -4 M0 14 L6 -2" stroke="#56763a" stroke-width="1.6" fill="none"/>
       <circle cx="-6" cy="-5" r="4" fill="#e05a7a"/><circle cx="0" cy="-8" r="4" fill="#f0c040"/><circle cx="6" cy="-5" r="4" fill="#e05a7a"/>
       <path d="M-6 8 L6 8 L3 15 L-3 15z" fill="#fbf4e2" stroke="#2a221c" stroke-width="1"/>`, 'A bouquet');
    const poq = at('poquoson');
    if (poq) egg('massage', poq.x - poq.side * 98, poq.y - 30, 0,
      `<path d="M-9 -12 q0 -4 4 -4 h10 q4 0 4 4 v14 h-18z" fill="#2a221c"/>
       <path d="M-12 2 h24 v6 h-24z" fill="#2a221c"/><path d="M-12 8 l-4 6 M12 8 l4 6" stroke="#2a221c" stroke-width="2"/>
       <path d="M-5 -10 v8 M0 -10 v8 M5 -10 v8" stroke="#c98f22" stroke-width="1.2"/>`, 'A massage chair');
    egg('monkey', 368, 42, 12,
      `<path d="M-4 6 q-8 6 -14 2" fill="none" stroke="#7a4a2a" stroke-width="2.5" stroke-linecap="round"/>
       <circle cx="-9" cy="-2" r="4" fill="#7a4a2a"/><circle cx="9" cy="-2" r="4" fill="#7a4a2a"/>
       <circle r="8.5" fill="#7a4a2a"/><ellipse cy="2" rx="6" ry="5" fill="#e3b98f"/>
       <circle cx="-2.5" cy="-1" r="1.1" fill="#2a221c"/><circle cx="2.5" cy="-1" r="1.1" fill="#2a221c"/>
       <path d="M-2 3.5 q2 1.5 4 0" fill="none" stroke="#2a221c" stroke-width=".9"/>`, 'Something on the compass');
    // stops
    stops.forEach((s, i) => {
      const x = xAt(i), y = yAt(i);
      const done = state.done[s.id];
      const unlocked = SCQ.isUnlocked(i);
      const current = i === open && !done;
      const st = done ? 'done' : current ? 'current' : unlocked ? 'open' : 'locked';
      const key = s.kind === 'key';
      const r = key ? 22 : 16;
      const side = x > 200 ? -1 : 1;
      const label = `${s.place}, ${s.town}. ${done ? 'Completed.' : current ? 'Next stop.' : unlocked ? 'Open.' : 'Locked.'}`;
      parts.push(`<g class="stop ${st}" data-stop="${esc(s.id)}" data-i="${i}" role="button" tabindex="0" aria-label="${esc(label)}">`);
      parts.push(`<rect x="${x - r - 6}" y="${y - r - 6}" width="${(r + 6) * 2}" height="${(r + 6) * 2}" fill="transparent"/>`);
      if (current) parts.push(`<circle class="pulse" cx="${x}" cy="${y}" r="${r}" fill="none" style="stroke:var(--route)" stroke-width="3"/>`);
      const fill = st === 'locked' ? 'var(--paper-2)' : st === 'done' ? (done.carried ? 'var(--shield)' : 'var(--route)') : 'var(--card)';
      parts.push(`<circle class="pin-ring" cx="${x}" cy="${y}" r="${r}" style="fill:${fill};stroke:var(--ink)" stroke-width="${key ? 3 : 2.2}"/>`);
      const iconColor = st === 'locked' ? 'var(--ink-soft)' : st === 'done' ? 'var(--card)' : key ? 'var(--route)' : 'var(--shield)';
      const sz = key ? 28 : 20;
      parts.push(`<g transform="translate(${x - sz / 2} ${y - sz / 2})" style="color:${iconColor}" opacity="${st === 'locked' ? 0.6 : 1}">${icon(s.icon).replace('<svg', `<svg width="${sz}" height="${sz}"`)}</g>`);
      if (done) {
        // small postmark tucked on the open side of the pin
        const px = side < 0 ? x + r - 4 : x - r - 58;
        parts.push(`<g transform="translate(${px} ${y - r - 30}) rotate(${side < 0 ? 10 : -10} 31 21) scale(.38)" style="color:${done.carried ? 'var(--shield)' : 'var(--route)'}" opacity=".85">${postmarkSVG(s.town.split(',')[0], done.at, done.carried).replace('<svg', '<svg width="162" height="112"')}</g>`);
      }
      if (st === 'locked') {
        parts.push(`<g transform="translate(${x + r - 9} ${y + r - 13})"><circle cx="7" cy="7" r="9" style="fill:var(--ink)"/><g transform="translate(1 1) scale(.5)" style="color:var(--paper)">${icon('lock').replace('<svg', '<svg width="24" height="24"')}</g></g>`);
      }
      parts.push(stopLabel(s, i, side, st));
      parts.push('</g>');
    });
    // car
    parts.push(`<g class="car" id="map-car" data-egg="singing" role="button" tabindex="0" aria-label="The car radio" transform="translate(${xAt(car)} ${yAt(car) - 40})">${carMarkup()}</g>`);
    parts.push('</svg>');
    return parts.join('');
  }

  function render(root, params) {
    const st = Store.state;
    const n = stops.length;
    const open = SCQ.firstOpenIndex();
    const allDone = open >= n;
    const next = allDone ? null : stops[open];
    const wrap = h('div', { class: 'strip-wrap' });
    wrap.innerHTML = buildSVG(st);
    const svg = wrap.querySelector('svg');

    const head = h('div', { class: 'map-head' },
      h('div', {},
        h('div', { class: 'eyebrow' }, allDone ? 'Trip complete' : 'Next stop'),
        h('h1', { class: 'sign' }, allDone ? 'All ' + n + ' stops' : next.place)),
      h('div', { class: 'meta' }, `${SCQ.doneCount()} of ${n} stops ∙ ${Math.round(SCQ.odometerMiles())} of ${Math.round(SCQ.totalMiles())} mi`));
    const cta = allDone
      ? h('div', { class: 'btn-row', style: { marginBottom: '16px' } },
        h('button', { class: 'btn', type: 'button', onclick: () => SCQ.go('letter') }, 'Read the letter'),
        h('button', { class: 'btn secondary', type: 'button', onclick: () => SCQ.go('deck') }, 'The date pool'))
      : h('div', { class: 'btn-row', style: { marginBottom: '16px' } },
        h('button', { class: 'btn', type: 'button', onclick: () => SCQ.go('stop', { id: next.id }) }, 'Continue to ' + next.place),
        h('button', { class: 'link-btn', type: 'button', onclick: () => scrollToStop(open, true) }, 'Show on map'));
    root.append(head, cta, wrap,
      h('div', { class: 'legend', 'aria-hidden': 'true' },
        h('span', {}, h('i', { style: { background: 'var(--card)', width: '16px', height: '16px' } }), 'Stop with a game'),
        h('span', {}, h('i', {}), 'Postcard stop'),
        h('span', {}, h('i', { style: { background: 'var(--route)', borderRadius: '2px', height: '6px', width: '18px' } }), 'Driven'),
        h('span', {}, h('i', { style: { border: '0', borderTop: '3px dotted var(--ink-soft)', borderRadius: '0', height: '0', width: '18px' } }), 'Still ahead')));

    function openStop(id, i) {
      if (!SCQ.isUnlocked(i)) {
        Sound.play('bad');
        toast(`${stops[SCQ.firstOpenIndex()].place} comes first.`);
        return;
      }
      Sound.play('tap');
      SCQ.go('stop', { id });
    }
    svg.addEventListener('click', (e) => {
      const ph = e.target.closest('[data-photo]');
      if (ph) return openPhoto(ph);
      const egg = e.target.closest('[data-egg]');
      if (egg) return findEgg(egg);
      const g = e.target.closest('[data-stop]');
      if (g) openStop(g.getAttribute('data-stop'), +g.getAttribute('data-i'));
    });
    svg.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const ph = e.target.closest('[data-photo]');
      if (ph) { e.preventDefault(); return openPhoto(ph); }
      const egg = e.target.closest('[data-egg]');
      if (egg) { e.preventDefault(); return findEgg(egg); }
      const g = e.target.closest('[data-stop]');
      if (g) { e.preventDefault(); openStop(g.getAttribute('data-stop'), +g.getAttribute('data-i')); }
    });

    function openPhoto(el) {
      const p = (C.mapPhotos || [])[+el.getAttribute('data-photo')];
      if (!p) return;
      if (el.classList.contains('undeveloped')) { Sound.play('tick'); toast('Still developing. Keep driving.'); return; }
      Sound.play('tap');
      let ov = null;
      const img = SCQ.photoEl(p.slot, p.caption, 'camera', { tape: false, fit: p.fit, eager: true });
      img.classList.add('album-big');
      ov = SCQ.overlay([img, h('button', { class: 'btn secondary', type: 'button', onclick: () => ov.close() }, 'Close')]);
    }

    function findEgg(el) {
      const body = el.querySelector('.egg-body') || el.querySelector('.car-body');
      if (body) { body.classList.remove('squish'); void body.getBBox(); body.classList.add('squish'); }
      SCQ.findEgg(el.getAttribute('data-egg'));
    }

    function scrollToStop(i, smooth) {
      const rect = svg.getBoundingClientRect();
      const k = rect.width / W;
      const y = window.scrollY + rect.top + yAt(i) * k - window.innerHeight * 0.45;
      window.scrollTo({ top: Math.max(0, y), behavior: smooth && !SCQ.reducedMotion() ? 'smooth' : 'auto' });
    }

    if (!st.welcomed && C.welcome && !/^#dbg-/.test(location.hash)) {
      const W0 = C.welcome;
      let ov = null;
      ov = SCQ.overlay([
        h('div', { class: 'eyebrow center' }, 'A note in the glovebox'),
        h('h2', {}, W0.title),
        h('div', { class: 'stack', style: { gap: '10px' } }, W0.lines.map((l) => h('p', { class: 'story', style: { fontSize: '1rem' } }, l))),
        h('button', { class: 'btn', type: 'button', onclick: () => ov.close() }, W0.button),
      ], { onClose: () => { st.welcomed = true; Store.save(); } });
    }

    const adv = params && typeof params.advanceFrom === 'number' ? params.advanceFrom : null;
    requestAnimationFrame(() => {
      if (adv != null && adv + 1 < n) animateCar(adv, adv + 1);
      else scrollToStop(SCQ.carIndex(), false);
    });

    function animateCar(from, to) {
      const car = svg.querySelector('#map-car');
      const path = svg.querySelector('#seg-' + to);
      if (!car || !path) return;
      scrollToStop(from, false);
      const len = path.getTotalLength();
      const dur = SCQ.reducedMotion() ? 1 : 1900;
      const t0 = performance.now();
      Sound.play('horn');
      setTimeout(() => scrollToStop(to, true), 150);
      const step = (t) => {
        const p = Math.min(1, (t - t0) / dur);
        const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const pt = path.getPointAtLength(len * e);
        const pt2 = path.getPointAtLength(Math.min(len, len * e + 1));
        const flip = pt2.x < pt.x - 0.01 ? -1 : 1;
        car.setAttribute('transform', `translate(${pt.x} ${pt.y - 26}) scale(${flip} 1)`);
        if (p < 1 && car.isConnected) requestAnimationFrame(step);
        else if (car.isConnected) car.setAttribute('transform', `translate(${xAt(to)} ${yAt(to) - 40})`);
      };
      car.setAttribute('transform', `translate(${xAt(from)} ${yAt(from) - 40})`);
      requestAnimationFrame(step);
    }
  }

  SCQ.screens.map = render;
  SCQ.map = { xAt, yAt, W, TOP, SP };
})();

</script>
<script>/* deck.js */
/* Stella's Cozy Quest - the date pool and its one roll, glovebox, movie shelf, letter, Micah's desk. */
(function () {
  'use strict';
  const SCQ = window.SCQ;
  const { C, h, icon, iconEl, toast, overlay, confirmInline, ticketEl, postmarkSVG, fmtDate, Store, Sync, Sound, stops } = SCQ;

  function rerender(name) {
    return () => {
      if (SCQ.Router.name !== name) return;
      const root = document.getElementById('screen');
      const y = window.scrollY;
      root.replaceChildren();
      SCQ.screens[name](root, Object.assign({}, SCQ.Router.params || {}, { roll: false }));
      window.scrollTo(0, y);
    };
  }
  function syncNote() {
    const ok = Sync.status === 'synced';
    const text = Sync.status === 'synced' ? 'Shared with Micah'
      : Sync.status === 'connecting' ? 'Connecting...'
        : 'Saved on this device';
    return h('span', { class: 'sync-note' + (ok ? ' ok' : '') }, h('i'), text);
  }

  /* ------------------------------------------------------------------ the pool and the roll */
  const allDates = () => Object.keys(C.cards);
  const inPool = () => allDates().filter((id) => Store.state.tickets[id] || Store.unlockAll);
  const tripDone = () => Store.unlockAll || SCQ.firstOpenIndex() >= stops.length;
  function sharedRoll() {
    const r = Sync.data.roll.get('result');
    return r && r.cardId && C.cards[r.cardId] ? r : null;
  }
  function currentRoll() {
    const local = Store.state.roll && C.cards[Store.state.roll.cardId] ? Store.state.roll : null;
    return local || sharedRoll();
  }

  function openDate(id) {
    let ov = null;
    ov = overlay([ticketEl(id, { big: true }), h('button', { class: 'btn secondary', type: 'button', onclick: () => ov.close() }, 'Close')]);
  }

  function rollForDate(again) {
    const done = currentRoll();
    if (done && again !== true) { showRolled(done.cardId); return; }
    if (!tripDone()) { toast('The roll unlocks at the end of the road.'); return; }
    const all = inPool();
    if (!all.length) return;
    // only dates that work tonight go into the roll
    const tonight = all.filter((id) => SCQ.worksTonight(C.cards[id]));
    const pool = tonight.length ? tonight : all;
    Sound.unlock();
    // decide and save first, so closing early can't buy a second roll
    const final = SCQ.pick(pool);
    const at = new Date().toISOString();
    Store.state.roll = { cardId: final, at };
    Store.save();
    const synced = Sync.canWrite();
    if (synced) Sync.set('roll/result', { cardId: final, title: C.cards[final].title, at, by: Sync.uid || null });

    const stage = h('div', { class: 'shuffle-stage' });
    const note = h('p', { class: 'center', style: { color: 'var(--ink-soft)', fontSize: '.95rem' } });
    const actions = h('div', { class: 'btn-row', style: { justifyContent: 'center' } });
    const title = h('h2', {}, 'Rolling...');
    const eyebrow = h('div', { class: 'eyebrow center' }, 'One roll');
    const ov = overlay([eyebrow, title, stage, note, actions], { onClose: () => rerender('deck')() });
    const steps = SCQ.reducedMotion() ? 1 : 22;
    let last = null;
    (async () => {
      for (let i = 0; i < steps; i++) {
        if (!ov.isConnected) return;
        let id = i === steps - 1 ? final : SCQ.pick(pool);
        if (pool.length > 1 && id === last && i !== steps - 1) id = pool[(pool.indexOf(id) + 1) % pool.length];
        last = id;
        const t = ticketEl(id, { big: i === steps - 1 });
        t.classList.add(i === steps - 1 ? 'landed' : 'flip');
        stage.replaceChildren(t);
        Sound.play('tick');
        await SCQ.sleep(40 + i * i * 0.95);
      }
      if (!ov.isConnected) return;
      Sound.play('win');
      eyebrow.textContent = 'This is the date';
      title.textContent = 'Our date';
      note.textContent = 'Grab your shoes. We are going now.';
      actions.replaceChildren(
        h('button', { class: 'btn', type: 'button', onclick: () => ov.close() }, 'Done'),
        h('button', { class: 'btn secondary', type: 'button', onclick: () => { ov.close(); setTimeout(() => rollForDate(true), 60); } }, 'Spin again'));
      actions.querySelector('button').focus();
    })();
  }
  function showRolled(id) {
    let ov = null;
    ov = overlay([
      h('div', { class: 'eyebrow center' }, 'Already rolled'),
      h('h2', {}, 'Our date'),
      ticketEl(id, { big: true }),
      h('div', { class: 'btn-row', style: { justifyContent: 'center' } },
        h('button', { class: 'btn', type: 'button', onclick: () => ov.close() }, 'Close'),
        h('button', { class: 'btn secondary', type: 'button', onclick: () => { ov.close(); setTimeout(() => rollForDate(true), 60); } }, 'Spin again')),
    ]);
  }

  /* ------------------------------------------------------------------ date pool screen */
  SCQ.screens.deck = function (root, params) {
    const st = Store.state;
    let changed = false;
    Object.keys(st.tickets).forEach((id) => { if (!st.ticketsSeen[id]) { st.ticketsSeen[id] = true; changed = true; } });
    if (changed) Store.save();

    const pool = inPool();
    const sealed = allDates().filter((id) => !pool.includes(id));
    const rolled = currentRoll();
    const ready = tripDone();

    root.append(h('header', { class: 'deck-head' },
      h('div', { class: 'eyebrow' }, 'My pick, your roll'),
      h('h1', { class: 'sign' }, 'The Date Pool'),
      h('p', { class: 'story', style: { fontSize: '1rem' } }, C.pool.intro),
      syncNote()));

    if (rolled) {
      root.append(
        h('div', { class: 'section-title' }, h('h2', {}, 'Our date'), h('span', {}, 'Rolled ' + fmtDate(rolled.at, true))),
        ticketEl(rolled.cardId, { big: true }),
        h('div', { class: 'btn-row', style: { marginTop: '14px' } }, h('button', { class: 'btn secondary', type: 'button', onclick: () => rollForDate(true) }, h('span', { html: icon('shuffle') }), 'Spin again')));
    } else {
      root.append(h('div', { class: 'roll-panel' },
        h('div', { class: 'roll-count' }, h('b', {}, pool.length), ' of ', allDates().length, ' dates in the pool'),
        h('button', { class: 'btn', type: 'button', onclick: rollForDate, disabled: !ready || !pool.length }, h('span', { html: icon('shuffle') }), 'Roll for our date'),
        h('p', { class: 'roll-note' }, ready ? 'One roll, from the ' + pool.filter((id) => SCQ.worksTonight(C.cards[id])).length + ' dates that work tonight. Whatever comes up, we go do it.' : 'The roll unlocks at the end of the road.')));
    }

    const others = rolled ? pool.filter((id) => id !== rolled.cardId) : pool;
    if (others.length) {
      root.append(h('div', { class: 'section-title' }, h('h2', {}, rolled ? 'Also in the pool' : 'In the pool'), h('span', {}, others.length)),
        h('div', { class: 'ticket-grid' }, others.map((id) => ticketEl(id, { onClick: () => openDate(id) }))));
    }
    if (sealed.length) {
      root.append(h('div', { class: 'section-title' }, h('h2', {}, 'Still sealed'), h('span', {}, sealed.length)),
        h('div', { class: 'ticket-grid' }, sealed.map((id) => ticketEl(id, { locked: true }))));
    }
    if (params && params.roll && !rolled && ready) setTimeout(rollForDate, 350);
  };
  SCQ.screens.deck.live = rerender('deck');
  SCQ.rollForDate = rollForDate;

  /* ------------------------------------------------------------------ glovebox */
  SCQ.screens.glovebox = function (root) {
    const st = Store.state;
    const item = (ic, title, blurb, onClick, locked, lockText) => {
      const el = h('button', { class: 'glove-item' + (locked ? ' locked' : ''), type: 'button', 'aria-disabled': locked ? 'true' : null },
        h('span', { html: icon(locked ? 'lock' : ic) }), h('b', {}, title), h('small', {}, locked ? lockText : blurb));
      el.addEventListener('click', () => {
        if (locked) { Sound.play('bad'); toast(lockText); return; }
