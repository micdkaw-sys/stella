      });
      return el;
    };
    const sq = C.sideQuests;
    const lockMsg = (key) => 'Opens after ' + SCQ.stopById(sq[key].unlockAfter).place + '.';
    const lettered = !!st.done[stops[stops.length - 1].id] || Store.unlockAll;
    const grid = h('div', { class: 'glove-grid' },
      item('film', sq.shelf.title, sq.shelf.blurb, () => SCQ.go('shelf'), !SCQ.sideQuestUnlocked('shelf'), lockMsg('shelf')),
      item('pencil', sq.portrait.title, sq.portrait.blurb, () => SCQ.go('portrait'), !SCQ.sideQuestUnlocked('portrait'), lockMsg('portrait')),
      item('camera', sq.polaroid.title, sq.polaroid.blurb, () => SCQ.openGame('polaroid', { sideQuest: true }), !SCQ.sideQuestUnlocked('polaroid'), lockMsg('polaroid')),
      item('camera', 'Photo Collage', 'Every photo from the trip in one place.', () => SCQ.go('collage'), false),
      item('jar', 'The Quote Jar', 'Things that were actually said.', () => SCQ.go('quotes'), false),
      item('stamp', 'Postmarks', SCQ.doneCount() + ' of ' + stops.length + ' collected.', () => SCQ.go('stamps'), false),
      item('letter', 'The Letter', 'For the end of the road.', () => SCQ.go('letter'), !lettered, 'Sealed until the last stop.'));

    const eggs = C.easterEggs || [];
    const found = eggs.filter((x) => st.eggs && st.eggs[x.id]);
    const eggList = h('div', { class: 'egg-list' }, eggs.map((x) => {
      const got = st.eggs && st.eggs[x.id];
      return h('div', { class: 'egg-row' + (got ? ' got' : '') },
        h('span', { class: 'egg-mark', html: icon(got ? 'check' : 'star') }),
        h('div', {}, h('b', {}, got ? x.title : 'Not found yet'), h('small', {}, got ? x.text : x.hint)));
    }));

    const soundRow = h('div', { class: 'settings-row' },
      h('div', {}, h('b', {}, 'Sound'), h('small', {}, 'Clicks, horns, and the occasional stamp.')),
      (() => { const b = h('button', { class: 'btn small secondary', type: 'button' }, Sound.enabled ? 'On' : 'Off'); b.addEventListener('click', () => { Sound.enabled = !Sound.enabled; st.sound = Sound.enabled; Store.save(); b.textContent = Sound.enabled ? 'On' : 'Off'; document.querySelectorAll('[data-sound-btn]').forEach((x) => x._paint && x._paint()); if (Sound.enabled) { Sound.unlock(); Sound.play('good'); } }); return b; })());
    const resetBtn = h('button', { class: 'btn small secondary', type: 'button' }, 'Start over');
    resetBtn.addEventListener('click', () => confirmInline(resetBtn, 'Erase this trip?', () => {
      Store.reset(); toast('Fresh map. A rolled date stays rolled.'); SCQ.go('title');
    }, 'Erase'));
    const resetRow = h('div', { class: 'settings-row' }, h('div', {}, h('b', {}, 'Start the trip over'), h('small', {}, 'Clears your progress on this device.')), resetBtn);

    root.append(
      h('header', { class: 'deck-head' }, h('div', { class: 'eyebrow' }, 'Extras'), h('h1', { class: 'sign' }, 'Glovebox')),
      grid,
      h('div', { class: 'section-title' }, h('h2', {}, 'Easter eggs'), h('span', {}, found.length + ' of ' + eggs.length + ' found')),
      eggList,
      h('div', { class: 'section-title' }, h('h2', {}, 'Settings')),
      soundRow, resetRow);
  };

  /* ------------------------------------------------------------------ movie shelf */
  const TAPE_COLORS = ['var(--route)', 'var(--shield)', 'var(--park)', 'var(--gold)'];
  SCQ.screens.shelf = function (root) {
    if (!SCQ.sideQuestUnlocked('shelf')) return SCQ.go('glovebox');
    const movies = C.movies;
    const toWatch = movies.filter((m) => !SCQ.isWatched(m));
    const watched = movies.filter((m) => SCQ.isWatched(m));
    function tape(m, i) {
      const w = SCQ.isWatched(m);
      const b = h('button', { class: 'vhs' + (w ? ' watched' : ''), type: 'button', style: { '--tape-c': TAPE_COLORS[i % TAPE_COLORS.length] }, 'aria-label': m.title + (w ? ', watched. Tap to move back.' : ', tap to mark watched.') },
        h('span', { class: 'band' }),
        h('span', { class: 'label' }, m.title, m.kind === 'yt' ? h('small', {}, 'YouTube') : null),
        h('span', { class: 'mark' }, w ? 'Seen' : ''));
      b.addEventListener('click', () => toggle(m));
      return b;
    }
    async function toggle(m) {
      const now = !SCQ.isWatched(m);
      Store.state.watched[m.id] = now;
      Store.save();
      Sound.play(now ? 'good' : 'tap');
      rerender('shelf')();
      toast(now ? 'Moved to Watched.' : 'Back on the to-watch shelf.', { action: 'Undo', onAction: () => { Store.state.watched[m.id] = !now; Store.save(); Sync.set('watched/' + m.id, { watched: !now, at: new Date().toISOString() }); rerender('shelf')(); } });
      await Sync.set('watched/' + m.id, { watched: now, at: new Date().toISOString() });
    }
    function spin() {
      if (!toWatch.length) { toast('Everything on the list is watched. Time to add more.'); return; }
      Sound.unlock();
      const label = h('div', { class: 'vhs', style: { '--tape-c': 'var(--route)', minHeight: '64px', cursor: 'default' } }, h('span', { class: 'band' }), h('span', { class: 'label', style: { fontSize: '1.5rem' } }, '...'), h('span', { class: 'mark' }, ''));
      const actions = h('div', { class: 'btn-row', style: { justifyContent: 'center' } });
      const ov = overlay([h('div', { class: 'eyebrow center' }, "Tonight's feature"), h('h2', {}, 'Rewinding...'), label, actions]);
      const pickM = SCQ.pick(toWatch);
      const steps = SCQ.reducedMotion() ? 1 : 14;
      (async () => {
        for (let i = 0; i < steps; i++) {
          if (!ov.isConnected) return;
          const m = i === steps - 1 ? pickM : SCQ.pick(toWatch);
          label.querySelector('.label').textContent = m.title;
          Sound.play('tick');
          await SCQ.sleep(50 + i * i * 2);
        }
        if (!ov.isConnected) return;
        Sound.play('coin');
        ov.querySelector('h2').textContent = 'Now playing';
        actions.replaceChildren(
          h('button', { class: 'btn', type: 'button', onclick: () => ov.close() }, 'Popcorn time'),
          h('button', { class: 'btn secondary', type: 'button', onclick: () => { ov.close(); setTimeout(spin, 30); } }, 'Spin again'));
        actions.querySelector('button').focus();
      })();

    root.append(
      h('button', { class: 'link-btn', type: 'button', onclick: () => SCQ.go('glovebox') }, '← Glovebox'),
      h('header', { class: 'deck-head' }, h('div', { class: 'eyebrow' }, 'Side quest'), h('h1', { class: 'sign' }, 'Movie Night Shelf'),
        h('div', { class: 'btn-row' }, h('button', { class: 'btn blue', type: 'button', onclick: spin, disabled: !toWatch.length }, h('span', { html: icon('shuffle') }), "Pick tonight's movie"), syncNote())),
      h('div', { class: 'section-title' }, h('h2', {}, 'Still to watch'), h('span', {}, toWatch.length)),
      h('div', { class: 'shelf' }, h('div', { class: 'shelf-row' }, toWatch.length ? toWatch.map(tape) : h('p', { class: 'hand' }, 'All caught up.'))),
      h('div', { class: 'section-title' }, h('h2', {}, 'Watched'), h('span', {}, watched.length)),
      h('div', { class: 'shelf' }, h('div', { class: 'shelf-row' }, watched.map(tape))),
      h('p', { class: 'eyebrow', style: { marginTop: '12px' } }, 'Tap a tape to move it between shelves.'));
  };
  SCQ.screens.shelf.live = rerender('shelf');

  /* ------------------------------------------------------------------ photo collage: every photo, nothing locked */
  function collagePhotos() {
    const files = window.SCQ_PHOTOS || {};
    const seen = new Set();
    const out = [];
    const add = (slot, caption, fit) => { if (!slot || seen.has(slot) || !files[slot]) return; seen.add(slot); out.push({ slot, caption, fit }); };
    stops.forEach((s) => s.photo && add(s.photo.slot, s.photo.caption, s.photo.fit));
    (C.mapPhotos || []).forEach((p) => add(p.slot, p.caption, p.fit));
    add('micah-portrait', 'My portrait of you. Sorry.');
    Object.keys(files).forEach((slot) => add(slot, ''));
    return out;
  }
  SCQ.screens.collage = function (root) {
    const list = collagePhotos();
    function show(p) {
      let ov = null;
      const img = SCQ.photoEl(p.slot, p.caption, 'camera', { tape: false, fit: p.fit, eager: true });
      img.classList.add('album-big');
      ov = overlay([img, h('button', { class: 'btn secondary', type: 'button', onclick: () => ov.close() }, 'Close')]);
    }
    root.append(
      h('button', { class: 'link-btn', type: 'button', onclick: () => SCQ.go('glovebox') }, '\u2190 Glovebox'),
      h('header', { class: 'deck-head' }, h('div', { class: 'eyebrow' }, list.length + ' photos'), h('h1', { class: 'sign' }, 'Photo Collage')),
      h('div', { class: 'collage' }, list.map((p, i) => {
        const el = SCQ.photoEl(p.slot, p.caption, 'camera', { tape: i % 3 === 0, fit: p.fit, tilt: i % 2 ? 'r' : 'l', eager: i < 6 });
        el.classList.add('collage-item');
        el.style.setProperty('--rot', ((i * 37) % 9 - 4) + 'deg');
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.addEventListener('click', () => show(p));
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') show(p); });
        return el;
      })));
  };

  /* ------------------------------------------------------------------ quotes + postmarks */
  SCQ.screens.quotes = function (root) {
    root.append(
      h('button', { class: 'link-btn', type: 'button', onclick: () => SCQ.go('glovebox') }, '← Glovebox'),
      h('header', { class: 'deck-head' }, h('div', { class: 'eyebrow' }, 'On the record'), h('h1', { class: 'sign' }, 'The Quote Jar')),
      h('div', { class: 'stack' }, C.quotes.map((q, i) => h('div', { class: 'quote-ticket', style: { transform: `rotate(${i % 2 ? -1.2 : 1.4}deg)`, maxWidth: 'none' } },
        h('div', { class: 'hand' }, '“' + q.text + '”'), h('div', { class: 'by' }, q.by)))));
  };
  SCQ.screens.stamps = function (root) {
    const st = Store.state;
    root.append(
      h('button', { class: 'link-btn', type: 'button', onclick: () => SCQ.go('glovebox') }, '← Glovebox'),
      h('header', { class: 'deck-head' }, h('div', { class: 'eyebrow' }, SCQ.doneCount() + ' of ' + stops.length + ' collected'), h('h1', { class: 'sign' }, 'Postmarks')),
      h('div', { class: 'stamp-book' }, stops.map((s) => {
        const d = st.done[s.id];
        if (!d) return h('div', { class: 'slot' }, s.place);
        return h('div', { class: 'slot got' + (d.carried ? ' carried' : ''), html: postmarkSVG(s.town.split(',')[0], d.at, d.carried).replace('viewBox="0 0 162 112"', 'viewBox="6 6 100 100"'), title: s.place });
      })));
  };

  /* ------------------------------------------------------------------ letter */
  SCQ.screens.letter = function (root, params) {
    const st = Store.state;
    const last = stops[stops.length - 1];
    if (!st.done[last.id] && !Store.unlockAll) return SCQ.go('glovebox');
    if (!st.letterSeen && !Store.sandbox) { st.letterSeen = true; Store.save(); }
    const L = C.letter;
    if (params && params.fromFinale) Sound.play('win');
    const rolled = currentRoll();
    root.append(
      params && params.fromFinale
        ? h('header', { class: 'deck-head', style: { textAlign: 'center', alignItems: 'center' } },
          h('div', { class: 'eyebrow' }, 'Trip complete ∙ ' + Math.round(SCQ.totalMiles()) + ' miles'),
          h('h1', { class: 'sign', style: { color: 'var(--route)' } }, 'End of the route'))
        : h('button', { class: 'link-btn', type: 'button', onclick: () => SCQ.go('glovebox') }, '← Glovebox'),
      h('div', { class: 'envelope-wrap' },
        h('article', { class: 'letter' },
          h('p', {}, L.greeting),
          L.body.map((p) => h('p', {}, p)),
          h('p', {}, L.signoff, h('br'), h('span', { class: 'sig' }, L.signature)))),
      h('div', { class: 'btn-row', style: { justifyContent: 'center' } },
        h('button', { class: 'btn', type: 'button', onclick: () => SCQ.go('deck', { roll: !rolled }) }, rolled ? 'See our date' : 'Roll for our date'),
        h('button', { class: 'btn secondary', type: 'button', onclick: () => SCQ.go('map') }, 'Back to the map')));
  };

  /* ------------------------------------------------------------------ Micah's desk (#micah) */
  SCQ.screens.micah = function (root) {
    const rows = (items, empty) => items.length ? h('div', { class: 'desk-list' }, items) : h('p', { class: 'empty' }, empty);
    const rolled = currentRoll();
    const portraits = [];
    Sync.data.portraits.forEach((v, id) => { if (v && typeof v.image === 'string' && v.image.startsWith('data:image/')) portraits.push({ id, image: v.image, at: v.at }); });
    const journeys = [];
    Sync.data.journey.forEach((v, id) => journeys.push({ id, ...v }));

    const resetRoll = h('button', { class: 'btn small secondary', type: 'button' }, 'Undo the roll');
    resetRoll.addEventListener('click', () => confirmInline(resetRoll, 'Let her roll again?', async () => {
      Store.state.roll = null; Store.save();
      if (Sync.canWrite()) await Sync.remove('roll/result');
      toast('The roll is open again.');
      rerender('micah')();
    }, 'Undo'));
    const resetBtn = h('button', { class: 'btn small secondary', type: 'button' }, 'Reset this device');
    resetBtn.addEventListener('click', () => confirmInline(resetBtn, 'Erase the trip on this device?', () => { Store.reset(); toast('This device starts fresh.'); rerender('micah')(); }, 'Erase'));

    root.append(
      h('header', { class: 'deck-head' }, h('div', { class: 'eyebrow' }, 'For Micah'), h('h1', { class: 'sign' }, "Postmaster's Desk"), syncNote(),
        h('p', { style: { fontSize: '.9rem', color: 'var(--ink-soft)' } }, 'Her roll, her portrait of you, and her progress show up here once they sync. Add #debug to the end of the link for a test drive that saves nothing.')),
      h('div', { class: 'section-title' }, h('h2', {}, 'The roll'), h('span', {}, rolled ? 'Rolled ' + fmtDate(rolled.at, true) : 'Not yet')),
      rolled ? ticketEl(rolled.cardId, { big: true, micah: true }) : h('p', { class: 'empty' }, 'She has not rolled yet. The roll opens once she finishes the last stop.'),
      h('div', { class: 'section-title' }, h('h2', {}, 'Her portrait of you')),
      portraits.length ? h('div', { class: 'portrait-grid' }, portraits.map((p) => h('figure', { class: 'paper-frame', style: { margin: 0 } }, h('img', { src: p.image, alt: 'Portrait of Micah', style: { width: '100%', display: 'block' } }), h('figcaption', { class: 'eyebrow', style: { marginTop: '6px' } }, p.at ? 'Drawn ' + fmtDate(p.at, true) : '')))) : h('p', { class: 'empty' }, 'No portrait yet.'),
      h('div', { class: 'section-title' }, h('h2', {}, 'Trip progress'), h('span', {}, journeys.length)),
      rows(journeys.map((j) => h('div', { class: 'row' }, h('span', {}, (j.id === Sync.uid ? 'You' : 'Stella (or another viewer)') + ': ' + j.done + ' of ' + j.total + ' stops' + (j.carried ? ', ' + j.carried + ' carried' : '')), h('span', {}, j.updated ? fmtDate(j.updated) : ''))), 'No progress synced yet.'),
      h('div', { class: 'section-title' }, h('h2', {}, 'Tools')),
      h('div', { class: 'btn-row' }, rolled ? resetRoll : null, resetBtn));
  };
  SCQ.screens.micah.live = rerender('micah');
})();

<script>/* games/apples.js */
/* Stella's Cozy Quest - Apple Catch: Carter's Mountain, Charlottesville, at golden hour.
   Catch apples, golden apples and hearts in a wicker basket before the sun goes down. Bees sting. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ---------------------------------------------------------------- color helpers */
  function rgb(c) {
    if (Array.isArray(c)) return c;
    const s = String(c || '').trim();
    let m = /^#([0-9a-f]{3,8})$/i.exec(s);
    if (m) {
      let hx = m[1];
      if (hx.length < 6) hx = hx.split('').map((ch) => ch + ch).join('');
      return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
    }
    m = /rgba?\(([^)]+)\)/i.exec(s);
    if (m) { const p = m[1].split(/[\s,/]+/).filter(Boolean).map(parseFloat); return [p[0] || 0, p[1] || 0, p[2] || 0]; }
    return [128, 128, 128];
  }
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return [0, 1, 2].map((i) => Math.round(A[i] + (B[i] - A[i]) * t)); };
  const col = (c, a) => { const [r, g, b] = rgb(c); return a == null || a >= 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${Math.max(0, a).toFixed(3)})`; };

  /* the evening's colors at golden hour (day) and at dusk, printed from the theme inks */
  function sceneColors(P) {
    const D = rgb(P.dark ? P.paper : P.ink);   // darkest ink in this theme
    const L = rgb(P.dark ? P.ink : P.card);    // lightest paper in this theme
    const gold = rgb(P.gold), route = rgb(P.route), shield = rgb(P.shield), park = rgb(P.park);
    const tame = (c) => (P.dark ? mix(c, P.paper, 0.14) : c);
    const day = {
      skyTop: tame(mix(gold, L, 0.48)), skyMid: tame(mix(mix(gold, route, 0.3), L, 0.24)), skyHor: tame(mix(gold, L, 0.74)),
      sun: mix(gold, L, 0.35),
    };
    const dusk = {
      skyTop: tame(mix(shield, [12, 16, 34], 0.55)), skyMid: tame(mix(route, shield, 0.6)), skyHor: tame(mix(route, gold, 0.4)),
      sun: mix(route, gold, 0.45),
    };
    day.far = mix(shield, day.skyHor, 0.62); dusk.far = mix(shield, dusk.skyMid, 0.4);
    day.mid = mix(shield, day.skyHor, 0.42); dusk.mid = mix(shield, D, 0.3);
    day.near = mix(mix(shield, park, 0.4), day.skyHor, 0.22); dusk.near = mix(shield, D, 0.55);
    day.valley = mix(park, gold, 0.32); dusk.valley = mix(park, D, 0.62);
    day.town = mix(day.valley, D, 0.4); dusk.town = mix(D, shield, 0.22);
    day.grassTop = mix(park, gold, 0.4); dusk.grassTop = mix(park, D, 0.5);
    day.grassBot = mix(park, D, 0.1); dusk.grassBot = mix(park, D, 0.66);
    day.stripe = mix(day.grassTop, L, 0.18); dusk.stripe = mix(dusk.grassTop, D, 0.15);
    day.canopy = mix(park, D, 0.16); dusk.canopy = mix(park, D, 0.62);
    day.canopyHi = mix(park, gold, 0.42); dusk.canopyHi = mix(park, D, 0.46);
    day.bark = mix(D, gold, 0.3); dusk.bark = mix(D, shield, 0.14);
    day.leaf = mix(park, D, 0.08); dusk.leaf = mix(park, D, 0.56);
    day.leafHi = mix(park, gold, 0.42); dusk.leafHi = mix(park, D, 0.4);
    day.fruit = route; dusk.fruit = mix(route, D, 0.42);
    day.sign = mix(gold, L, 0.55); dusk.sign = mix(gold, D, 0.42);
    day.signInk = D; dusk.signInk = mix(D, L, 0.1);
    return { D, L, gold, route, shield, park, day, dusk, lamp: mix(gold, L, 0.45) };
  }

  /* ---------------------------------------------------------------- shapes */
  function applePath(g, r) {
    g.beginPath();
    g.moveTo(0, -r * 0.6);
    g.bezierCurveTo(r * 0.5, -r * 1.05, r * 1.14, -r * 0.55, r * 0.98, r * 0.14);
    g.bezierCurveTo(r * 0.88, r * 0.8, r * 0.42, r * 1.02, 0, r * 0.86);
    g.bezierCurveTo(-r * 0.42, r * 1.02, -r * 0.88, r * 0.8, -r * 0.98, r * 0.14);
    g.bezierCurveTo(-r * 1.14, -r * 0.55, -r * 0.5, -r * 1.05, 0, -r * 0.6);
    g.closePath();
  }
  function heartPath(g, r) {
    g.beginPath();
    g.moveTo(0, r * 0.95);
    g.bezierCurveTo(-r * 1.3, r * 0.05, -r * 0.95, -r * 1.0, 0, -r * 0.38);
    g.bezierCurveTo(r * 0.95, -r * 1.0, r * 1.3, r * 0.05, 0, r * 0.95);
    g.closePath();
  }
  function sparkle(g, x, y, s, rot) {
    g.save(); g.translate(x, y); g.rotate(rot);
    g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2, rr = i % 2 ? s * 0.28 : s;
      g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill(); g.restore();
  }

  SCQ.registerGame('apples', {
    title: 'Apple Catch',
    howTo: [
      'Drag anywhere to slide the basket. Arrow keys work too.',
      'Apples +1, golden apples +3, hearts +2.',
      'Fill the basket before sundown. Three bee stings and you are out.',
    ],
    defaults: {
      seconds: 45,        // length of the evening
      goal: 30,           // points needed before sundown
      lives: 3,           // bee stings you can take
      spawnStart: 1.35,   // seconds between drops at the start...
      spawnEnd: 0.75,     // ...and just before sundown
      fallStart: 0.36,    // fall speed in stage heights per second at the start...
      fallEnd: 0.66,      // ...and at the end

    async start(stage, ctx) {

      function makeLayer(y0, y1, paint) {

      function ridge(x, base, amp, f, seed, color) {

      function paintLand(x, c) {

      function tree(x, cx, by, s, c, R) {

      /* ---------------------------------------------------------- items */
      function spawn(p) {

        // so every evening offers about the same number of points

        let kind;

      /* ---------------------------------------------------------- update */
      const keys = new Set();

          } else if (it.state === 'away') {
            it.x += it.vx * dt; it.y += it.vy * dt; it.t += dt;
            if (it.trail.length) it.trail.shift();
            if (it.x < -40 || it.x > W + 40 || it.y < -40) it.state = 'gone';
          }
        }
        st.items = st.items.filter((i) => i.state !== 'gone');
        st.invuln = Math.max(0, st.invuln - dt);
        effects(dt);

        const left = Math.max(0, Math.ceil(P.seconds - st.t));
        if (left !== st.lastSec) { st.lastSec = left; hud.set('time', String(left)); if (left <= 5 && left > 0) sound.play('tick'); }

        if (st.score >= P.goal) end('win', 'Full basket!');
        else if (st.lives <= 0) end('lose', 'Stung!');
        else if (st.t >= P.seconds) end('lose', 'Sundown');
      }
      function effects(dt) {
        st.clock += dt;
        st.wob = Math.max(0, st.wob - dt * 2.6);
        st.flash = Math.max(0, st.flash - dt / 0.38);
        st.shake = Math.max(0, st.shake - dt / 0.35);
        st.floaters.forEach((f) => { f.life -= dt; f.y -= 46 * dt; });
        st.floaters = st.floaters.filter((f) => f.life > 0);
        st.sparks.forEach((s) => { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.rot += dt * 5; });
        st.sparks = st.sparks.filter((s) => s.life > 0);
      }
      function end(result, text) {
        if (st.ended) return;
        st.ended = result;
        st.endText = text;
        if (result === 'lose' && text === 'Sundown') st.t = P.seconds;
        util.banner(stage, text, 1100);
        if (result === 'win') { for (let i = 0; i < 3; i++) burst(st.bx + rand(-20, 20), G.rimY - 6, 'heart'); }
      }

      /* ---------------------------------------------------------- draw */
      function drawSky(e) {
        const top = mix(K.day.skyTop, K.dusk.skyTop, e), mid = mix(K.day.skyMid, K.dusk.skyMid, e), hor = mix(K.day.skyHor, K.dusk.skyHor, Math.min(1, e * 1.1));
        const sky = g.createLinearGradient(0, 0, 0, G.horizon);
        sky.addColorStop(0, col(top)); sky.addColorStop(0.58, col(mid)); sky.addColorStop(1, col(hor));
        g.fillStyle = sky; g.fillRect(0, 0, W, G.horizon + 4);
        // stars come out as the sun goes down
        const sa = clamp((e - 0.5) / 0.4, 0, 1);
        if (sa > 0) {
          g.fillStyle = col(K.L);
          stars.forEach((s) => {
            const a = sa * s.on * (0.65 + 0.35 * Math.sin(st.clock * 2 + s.ph));
            g.globalAlpha = a; g.fillRect(s.x, s.y, s.s, s.s);
          });
          g.globalAlpha = 1;
        }
        // retro striped sun sinking behind the Blue Ridge
        const sr = Math.min(W * 0.1, H * 0.06);
        const sx = W * 0.7, sy = lerp(H * 0.33, G.horizon - H * 0.03, Math.pow(e, 1.15));
        const glow = g.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 4.2);
        glow.addColorStop(0, col(mix(K.day.sun, K.dusk.sun, e), 0.45 - e * 0.2)); glow.addColorStop(1, col(K.day.sun, 0));
        g.fillStyle = glow; g.fillRect(sx - sr * 4.2, sy - sr * 4.2, sr * 8.4, sr * 8.4);
        g.fillStyle = col(mix(K.day.sun, K.dusk.sun, e));
        g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
        g.fillStyle = sky;
        for (let i = 0; i < 4; i++) {
          const by = sy + sr * (0.15 + i * 0.22), bh = 1.2 + i * 1.3;
          g.fillRect(sx - sr - 2, by, sr * 2 + 4, bh);
        }
        // long thin evening clouds, lit gold and then pink as the light goes
        const cc = mix(mix(K.L, K.gold, 0.25), mix(K.route, K.shield, 0.35), e);
        clouds.forEach((c, i) => {
          const span = W + c.w * 2;
          const cx = ((c.x + st.clock * c.v) % span + span) % span - c.w;
          g.fillStyle = col(cc, 0.42 + (i % 2) * 0.14);
          g.beginPath(); g.ellipse(cx + c.w / 2, c.y, c.w / 2, c.h, 0, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.ellipse(cx + c.w * 0.62, c.y - c.h * 0.9, c.w * 0.26, c.h * 0.9, 0, 0, Math.PI * 2); g.fill();
        });
      }
      function drawTownLights(e) {
        g.fillStyle = col(K.lamp);
        town.lights.forEach((l) => {
          const a = clamp((e - l.on) * 4, 0, 1);
          if (a <= 0) return;
          const tw = 0.75 + 0.25 * Math.sin(st.clock * 3 + l.ph);
          g.globalAlpha = a * 0.25 * tw;
          g.beginPath(); g.arc(l.x, l.y, l.s * 2.6, 0, Math.PI * 2); g.fill();
          g.globalAlpha = a * tw;
          g.fillRect(l.x - l.s / 2, l.y - l.s / 2, l.s, l.s);
        });
        g.globalAlpha = 1;
      }
      function drawApple(it, a) {
        const r = it.r;
        g.save(); g.globalAlpha = a; g.translate(it.x, it.y); g.rotate(it.rot);
        applePath(g, r);
        g.fillStyle = col(it.kind === 'gold' ? K.gold : K.route); g.fill();
        g.lineWidth = 1.6; g.strokeStyle = col(K.D, 0.8); g.stroke();
        g.fillStyle = col(K.L, 0.55);
        g.beginPath(); g.ellipse(-r * 0.4, -r * 0.18, r * 0.17, r * 0.3, -0.4, 0, Math.PI * 2); g.fill();
        g.strokeStyle = col(K.D); g.lineWidth = 2; g.lineCap = 'round';
        g.beginPath(); g.moveTo(0, -r * 0.55); g.quadraticCurveTo(r * 0.02, -r * 0.9, r * 0.16, -r * 1.08); g.stroke();
        g.fillStyle = col(K.park);
        g.beginPath(); g.ellipse(r * 0.36, -r * 0.9, r * 0.33, r * 0.14, -0.55, 0, Math.PI * 2); g.fill();
        g.restore();
        if (it.kind === 'gold') {
          g.fillStyle = col(K.L, a);
          sparkle(g, it.x + r * 0.75, it.y - r * 0.7, r * (0.38 + 0.12 * Math.sin(it.t * 9)), it.t * 2);
          sparkle(g, it.x - r * 0.9, it.y + r * 0.35, r * 0.22, -it.t * 3);
        }
      }
      function drawHeart(it, a) {
        const r = it.r * (1 + 0.07 * Math.sin(it.t * 8));
        g.save(); g.globalAlpha = a; g.translate(it.x, it.y); g.rotate(it.rot * 0.4);
        heartPath(g, r * 1.12);
        g.fillStyle = col(K.L); g.fill();
        heartPath(g, r * 0.92);
        g.fillStyle = col(mix(K.route, K.L, 0.28)); g.fill();
        heartPath(g, r * 1.12);
        g.lineWidth = 1.4; g.strokeStyle = col(K.D, 0.7); g.stroke();
        g.fillStyle = col(K.L, 0.6);
        g.beginPath(); g.ellipse(-r * 0.38, -r * 0.3, r * 0.14, r * 0.22, -0.6, 0, Math.PI * 2); g.fill();
        g.restore();
      }
      function drawBee(it) {
        const r = it.r * 0.95;
        if (it.trail.length > 1) {
          g.fillStyle = col(K.D, 0.4);
          it.trail.forEach((p, i) => { if (i % 2) return; g.beginPath(); g.arc(p[0], p[1], 1.3, 0, Math.PI * 2); g.fill(); });
        }
        g.save(); g.translate(it.x, it.y); g.scale(it.dir || 1, 1);
        const flap = 0.45 + 0.55 * Math.abs(Math.sin(it.t * 38));
        g.fillStyle = col(K.L, 0.8); g.strokeStyle = col(K.D, 0.55); g.lineWidth = 1;
        [[-0.25, 0.42], [0.12, 0.36]].forEach(([wx, ws]) => {
          g.beginPath(); g.ellipse(wx * r, -r * 0.62, r * ws, r * 0.62 * flap, -0.3, 0, Math.PI * 2); g.fill(); g.stroke();
        });
        g.beginPath(); g.ellipse(0, 0, r * 0.9, r * 0.62, 0, 0, Math.PI * 2);
        g.fillStyle = col(mix(K.gold, [242, 196, 48], 0.35)); g.fill();
        g.save(); g.clip();
        g.fillStyle = col(K.D);
        g.fillRect(-r * 0.42, -r, r * 0.22, r * 2); g.fillRect(r * 0.02, -r, r * 0.22, r * 2);
        g.restore();
        g.lineWidth = 1.5; g.strokeStyle = col(K.D); g.stroke();
        g.fillStyle = col(K.D);
        g.beginPath(); g.arc(r * 0.78, -r * 0.05, r * 0.36, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.moveTo(-r * 0.86, -r * 0.12); g.lineTo(-r * 1.28, 0); g.lineTo(-r * 0.86, r * 0.12); g.fill();
        g.fillStyle = col(K.L);
        g.beginPath(); g.arc(r * 0.88, -r * 0.14, r * 0.1, 0, Math.PI * 2); g.fill();
        g.strokeStyle = col(K.D); g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(r * 0.9, -r * 0.35); g.quadraticCurveTo(r * 1.1, -r * 0.75, r * 1.25, -r * 0.7); g.stroke();
        g.restore();
      }
      function drawBasket() {
        const bw = G.bw, bh = G.bh;
        const sh = st.shake > 0 ? Math.sin(st.clock * 70) * 7 * st.shake : 0;
        const rot = Math.sin(st.clock * 24) * 0.075 * st.wob;
        const sq = 1 + 0.07 * st.wob * Math.sin(st.clock * 24 + 1.2);
        const wick = mix(K.gold, K.D, 0.32), dark = mix(K.gold, K.D, 0.62), lite = mix(K.gold, K.L, 0.3);
        // shadow on the grass
        g.fillStyle = col(K.D, 0.22);
        g.beginPath(); g.ellipse(st.bx, G.groundY + 2, bw * 0.5, bh * 0.12, 0, 0, Math.PI * 2); g.fill();
        g.save();
        g.translate(st.bx + sh, G.groundY);
        g.rotate(rot); g.scale(1 / sq, sq);
        if (st.invuln > 0 && Math.floor(st.invuln * 12) % 2 === 0) g.globalAlpha = 0.55;
        // handle
        g.lineCap = 'round';
        g.strokeStyle = col(dark); g.lineWidth = Math.max(4, bw * 0.07);
        g.beginPath(); g.moveTo(-bw * 0.4, -bh); g.bezierCurveTo(-bw * 0.42, -bh * 2.05, bw * 0.42, -bh * 2.05, bw * 0.4, -bh); g.stroke();
        g.strokeStyle = col(lite, 0.8); g.lineWidth = 1.4; g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(-bw * 0.4, -bh); g.bezierCurveTo(-bw * 0.42, -bh * 2.05, bw * 0.42, -bh * 2.05, bw * 0.4, -bh); g.stroke();
        g.setLineDash([]);
        // inside of the basket
        g.fillStyle = col(mix(dark, K.D, 0.4));
        g.beginPath(); g.ellipse(0, -bh, bw * 0.5, bh * 0.17, 0, 0, Math.PI * 2); g.fill();
        // the day's haul peeking over the rim
        const pile = Math.min(9, Math.ceil(st.score / 3));
        const spots = [[0, -0.02], [-0.26, 0.02], [0.26, 0.02], [-0.13, -0.16], [0.14, -0.15], [0.36, -0.07], [-0.36, -0.08], [0, -0.3], [-0.22, -0.3]];
        for (let i = 0; i < pile; i++) {
          const [px, py] = spots[i];
          g.save(); g.translate(px * bw, -bh + py * bh * 1.6); g.rotate(px);
          applePath(g, G.r * 0.78); g.fillStyle = col(i === 4 ? K.gold : K.route); g.fill();
          g.lineWidth = 1.2; g.strokeStyle = col(K.D, 0.7); g.stroke();
          g.restore();
        }
        // gingham cloth tucked over one side
        g.save();
        g.beginPath(); g.moveTo(-bw * 0.5, -bh); g.lineTo(-bw * 0.08, -bh); g.lineTo(-bw * 0.36, -bh * 0.35); g.closePath();
        g.fillStyle = col(K.L); g.fill(); g.clip();
        g.fillStyle = col(K.route, 0.75);
        const ck = Math.max(3, bw * 0.06);
        for (let yy = -bh; yy < 0; yy += ck * 2) g.fillRect(-bw * 0.5, yy, bw, ck);
        g.fillStyle = col(K.route, 0.45);
        for (let xx = -bw * 0.5; xx < 0; xx += ck * 2) g.fillRect(xx, -bh, ck, bh);
        g.restore();
        // woven body
        const body = () => {
          g.beginPath();
          g.moveTo(-bw * 0.5, -bh); g.lineTo(bw * 0.5, -bh);
          g.lineTo(bw * 0.4, -bh * 0.08); g.quadraticCurveTo(bw * 0.38, 0, bw * 0.3, 0);
          g.lineTo(-bw * 0.3, 0); g.quadraticCurveTo(-bw * 0.38, 0, -bw * 0.4, -bh * 0.08);
          g.closePath();
        };
        body();
        g.fillStyle = col(wick); g.fill();
        g.save(); g.clip();
        const rows = 4, rh = bh / rows;
        g.strokeStyle = col(dark); g.lineWidth = 1.3;
        for (let i = 1; i < rows; i++) { g.beginPath(); g.moveTo(-bw * 0.5, -bh + i * rh); g.lineTo(bw * 0.5, -bh + i * rh); g.stroke(); }
        g.fillStyle = col(lite, 0.55);
        const cw = bw / 9;
        for (let i = 0; i < rows; i++) {
          for (let k = -5; k <= 5; k++) {
            const cx = k * cw + (i % 2 ? cw / 2 : 0);
            g.beginPath(); g.ellipse(cx, -bh + i * rh + rh / 2, cw * 0.32, rh * 0.28, 0, 0, Math.PI * 2); g.fill();
          }
        }
        g.restore();
        body();
        g.lineWidth = 1.8; g.strokeStyle = col(K.D, 0.85); g.stroke();
        // braided rim
        const rimH = Math.max(5, bh * 0.2);
        g.fillStyle = col(dark);
        g.beginPath(); g.roundRect ? g.roundRect(-bw * 0.53, -bh - rimH * 0.55, bw * 1.06, rimH, rimH / 2) : g.rect(-bw * 0.53, -bh - rimH * 0.55, bw * 1.06, rimH); g.fill();
        g.strokeStyle = col(lite, 0.75); g.lineWidth = 1.2;
        for (let xx = -bw * 0.5; xx < bw * 0.5; xx += rimH * 0.8) {
          g.beginPath(); g.moveTo(xx, -bh - rimH * 0.45); g.lineTo(xx + rimH * 0.5, -bh + rimH * 0.35); g.stroke();
        }
        g.restore();
      }
      function drawFx() {
        st.sparks.forEach((s) => {
          const a = clamp(s.life / 0.5, 0, 1);
          if (s.kind === 'heart') {
            g.save(); g.globalAlpha = a; g.translate(s.x, s.y); g.rotate(s.rot * 0.2);
            heartPath(g, 4.5); g.fillStyle = col(mix(K.route, K.L, 0.28)); g.fill(); g.restore();
          } else {
            g.fillStyle = col(s.kind === 'gold' ? K.gold : K.L, a);
            sparkle(g, s.x, s.y, 4, s.rot);
          }
        });
        g.textAlign = 'center'; g.textBaseline = 'middle';
        st.floaters.forEach((f) => {
          const a = clamp(f.life / 0.5, 0, 1);
          const big = f.kind === 'gold' || f.kind === 'sting';
          g.font = util.font('mark', big ? 28 : 23);
          g.lineJoin = 'round';
          g.lineWidth = 5; g.strokeStyle = col(f.kind === 'sting' ? K.L : K.D, a * 0.9);
          g.strokeText(f.text, f.x, f.y);
          g.fillStyle = col(f.kind === 'gold' ? K.gold : f.kind === 'sting' ? K.route : f.kind === 'heart' ? mix(K.route, K.L, 0.3) : K.L, a);
          g.fillText(f.text, f.x, f.y);
        });
        if (st.flash > 0) {
          g.fillStyle = col(K.route, (rm ? 0.12 : 0.34) * st.flash);
          g.fillRect(0, 0, W, H);
        }
      }
      function draw() {
        const e = clamp(st.t / P.seconds, 0, 1);
        const ee = e * e * (3 - 2 * e) * 0.85 + e * 0.15;
        drawSky(ee);
        blit(layers.land[0], 1); blit(layers.land[1], ee);
        drawTownLights(ee);
        blit(layers.orch[0], 1); blit(layers.orch[1], ee);
        // evening hush over the orchard
        blit(layers.br[0], 1); blit(layers.br[1], ee);
        st.items.forEach((it) => { if (it.state === 'land') { if (it.kind === 'heart') drawHeart(it, clamp(it.life / 0.4, 0, 1)); else drawApple(it, clamp(it.life / 0.4, 0, 1)); } });
        drawBasket();
        st.items.forEach((it) => {
          if (it.state === 'fall' || it.state === 'away') {
            if (it.kind === 'bee') drawBee(it);
            else if (it.kind === 'heart') drawHeart(it, 1);
            else drawApple(it, 1);
          }
        });
        drawFx();
      }

      /* ---------------------------------------------------------- input */
      let pressed = false;
      function aim(e) { const pt = cv.toLocal(e); const half = G.bw / 2; st.tx = clamp(pt.x, half, W - half); }
      stage.addEventListener('pointerdown', (e) => { const sp = cv.toLocal(e); if (sp.x > W * 0.04 && sp.x < W * 0.33 && sp.y > H * 0.76 && sp.y < H * 0.83 && SCQ.findEgg) SCQ.findEgg('eden'); pressed = true; aim(e); try { stage.setPointerCapture(e.pointerId); } catch (err) { /* fine */ } }, { signal });
      stage.addEventListener('pointermove', (e) => { if (pressed || e.pointerType === 'mouse') aim(e); }, { signal });
      const release = () => { pressed = false; };
      stage.addEventListener('pointerup', release, { signal });
      stage.addEventListener('pointercancel', release, { signal });
      const keyDir = (k) => (k === 'ArrowLeft' || k === 'a' || k === 'A' ? 'L' : k === 'ArrowRight' || k === 'd' || k === 'D' ? 'R' : null);
      window.addEventListener('keydown', (e) => { const d = keyDir(e.key); if (d) { keys.add(d); e.preventDefault(); } }, { signal });
      window.addEventListener('keyup', (e) => { const d = keyDir(e.key); if (d) keys.delete(d); }, { signal });
      window.addEventListener('blur', () => keys.clear(), { signal });

      /* ---------------------------------------------------------- run */
      layout();
      st.bx = st.tx = W / 2;
      cv.onResize = () => {
        const kx = cv.w / W, ky = cv.h / H;

        st.bx *= kx; st.tx *= kx;

      const hud = util.hud(stage, [
        { key: 'score', label: 'Apples', value: '0/' + P.goal },
        { key: 'time', label: 'Sundown', value: String(P.seconds) },
        { key: 'lives', label: 'Lives', value: String(P.lives) },
      ]);

        SCQ.test.apples = {
          params: P,
          state: () => ({
            w: W, h: H, t: st.t, score: st.score, offered: st.offered, goal: P.goal, lives: st.lives, ended: st.ended,
            basket: { x: st.bx, w: G.bw, rimY: G.rimY }, r: G.r,
            items: st.items.filter((i) => i.state === 'fall').map((i) => ({ id: i.id, kind: i.kind, x: i.x, y: i.y, vy: i.vy })),
            rect: (() => { const b = cv.canvas.getBoundingClientRect(); return { left: b.left, top: b.top, width: b.width, height: b.height }; })(),
          }),
        };
      }
      draw();
      await util.countdown(stage, signal);

      return new Promise((resolve) => {
        util.loop((dt) => {
          if (!st.ended) update(dt);
          else { st.endT += dt; effects(dt); }
          draw();
          if (st.ended && st.endT >= 1.2) { resolve(st.ended); return false; }

        }, signal);
      });
    },
  });
})();

<script>/* games/bowling.js */
/* Bowling - Joe's Inn, Richmond (then the lanes). Three frames to beat Micah's first-date score by a mile. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ---------- color helpers ---------- */
  function rgbOf(c) {
    const s = String(c || '').trim();
    let m = /^#([0-9a-f]{3})$/i.exec(s);
    if (m) return m[1].split('').map((x) => parseInt(x + x, 16));
    m = /^#([0-9a-f]{6})/i.exec(s);
    if (m) return [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16));
    m = /rgba?\(([^)]+)\)/i.exec(s);
    if (m) return m[1].split(',').slice(0, 3).map((v) => parseFloat(v));
    return [128, 128, 128];
  }
  const mix = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const alpha = (c, a) => 'rgba(' + rgbOf(c).join(',') + ',' + a + ')';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const tri = (p) => 1 - 4 * Math.abs((((p + 0.25) % 1) + 1) % 1 - 0.5); // triangle wave in [-1, 1]

  /* ---------- lane physics (lane units: half lane width = 1; z = distance past the foul line) ---------- */
  const ZP = 18;              // head pin
  const ZE = ZP + 2.2;        // end of the pin deck (the pit)
  const RB = 0.205, RP = 0.115, GUT = 1.0, WALL = 1.32;
  const PINS = [[0, 0], [-0.289, 0.5], [0.289, 0.5], [-0.578, 1], [0, 1], [0.578, 1], [-0.867, 1.5], [-0.289, 1.5], [0.289, 1.5], [0.867, 1.5]];
  const AIM_RANGE = 0.95;

  function makeRoll(standing, aim, power, K, rnd) {
    const p = clamp(power, 0, 1);
    return {
      t: 0, aim, power: p, K, rnd, done: false, quiet: 0, gutter: false, firstHit: false, clink: 0,
      hook: K.hook * (1.5 - 0.9 * p) * (1 - K.hookVar + rnd() * 2 * K.hookVar),

          }
          if (phase === 'sweep') {
            sweep += dt / 0.8;
            for (const p of R.pins) if (p.present && !p.up) p.fade = Math.max(0, 1 - sweep * 2.2);
            if (sweep > 0.55) camTarget = 0;
            if (sweep >= 1) { sweep = -1; startNextRoll(); }
          }
          if (phase === 'aim' || phase === 'power') camTarget = 0;
          camZ += (camTarget - camZ) * Math.min(1, dt * (phase === 'roll' ? 6 : 3));
          message = phase === 'aim' ? 'TAP TO SET YOUR AIM' : phase === 'power' ? 'TAP TO SET YOUR POWER' : '';
        }

        /* ---------- drawing ---------- */
        function drawPin(p) {
          const [sx, sy, s] = proj(p.x, p.z);
          const u = L.hw * s;
          g.save();
          g.globalAlpha = p.fade;
          g.translate(sx, sy);
          // contact shadow
          g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(0, 0, 0.11 * u, 0.035 * u, 0, 0, 6.29); g.fill();
          const ease = p.fall < 1 ? 1 - Math.pow(1 - p.fall, 2) : 1;
          let rot = 0, sy2 = 1;
          if (!p.up) { rot = ease * (Math.PI / 2) * (p.fx >= 0 ? 1 : -1) * Math.min(1, Math.abs(p.fx) * 1.6 + 0.25); sy2 = 1 - 0.55 * ease * Math.abs(p.fz); }
          else if (p.wob > 0) rot = Math.sin(p.wob * 25) * 0.18 * p.wob;
          g.rotate(rot); g.scale(u, u * sy2);
          g.beginPath();
          g.moveTo(-0.045, 0);
          g.quadraticCurveTo(-0.13, -0.12, -0.115, -0.27);
          g.quadraticCurveTo(-0.1, -0.42, -0.04, -0.5);
          g.quadraticCurveTo(-0.028, -0.56, -0.058, -0.62);
          g.quadraticCurveTo(-0.065, -0.72, 0, -0.72);
          g.quadraticCurveTo(0.065, -0.72, 0.058, -0.62);
          g.quadraticCurveTo(0.028, -0.56, 0.04, -0.5);
          g.quadraticCurveTo(0.1, -0.42, 0.115, -0.27);
          g.quadraticCurveTo(0.13, -0.12, 0.045, 0);
          g.closePath();
          const gr = g.createLinearGradient(-0.12, 0, 0.12, 0);
          gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.55, C.pin); gr.addColorStop(1, C.pinShade);
          g.fillStyle = gr; g.fill();
          g.save(); g.clip();
          g.fillStyle = C.stripe; g.fillRect(-0.2, -0.505, 0.4, 0.022); g.fillRect(-0.2, -0.47, 0.4, 0.022);
          g.restore();
          g.lineWidth = Math.max(0.006, 1.2 / u); g.strokeStyle = C.pinOut; g.stroke();
          g.restore();
        }
        function drawBall(bx, bz, roll, inGutter, holes) {
          if (bz - camZ < -D * 0.45) return;
          const [sx, sy, s] = proj(bx, bz);
          const r = RB * L.hw * s;
          const cy = sy - r + (inGutter ? r * 0.45 : 0);
          g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(sx, sy, r * 0.9, r * 0.28, 0, 0, 6.29); g.fill();
          g.save();
          g.beginPath(); g.arc(sx, cy, r, 0, 6.29);
          const gr = g.createRadialGradient(sx - r * 0.35, cy - r * 0.4, r * 0.1, sx, cy, r);
          gr.addColorStop(0, mix(C.ball, '#ffffff', 0.45)); gr.addColorStop(0.6, C.ball); gr.addColorStop(1, mix(C.ball, '#000', 0.4));
          g.fillStyle = gr; g.fill();
          g.clip();
          // marbled swirl that turns as the ball rolls
          g.strokeStyle = alpha(mix(C.ball, '#ffffff', 0.6), 0.55); g.lineWidth = r * 0.12;
          for (let k = 0; k < 3; k++) {
            const a = roll * 2.4 + k * 2.1;
            g.beginPath(); g.ellipse(sx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.5, r * 0.75, r * 0.3, a * 0.5, 0, 3.5); g.stroke();
          }
          if (holes) {
            g.fillStyle = '#14121a';
            [[-0.22, -0.35], [0.12, -0.42], [-0.04, -0.05]].forEach(([hx, hy], i) => { g.beginPath(); g.ellipse(sx + hx * r, cy + hy * r, r * (i === 2 ? 0.13 : 0.1), r * (i === 2 ? 0.11 : 0.085), 0, 0, 6.29); g.fill(); });
          }
          g.restore();
          g.strokeStyle = '#14121a'; g.lineWidth = 1.5; g.beginPath(); g.arc(sx, cy, r, 0, 6.29); g.stroke();
        }
        function drawLane() {
          const zN = Math.max(-6, zAtBottom());
          // back wall + masking units
          g.fillStyle = C.wall; g.fillRect(0, 0, W, H);
          const zm = ZE + 0.7;
          g.fillStyle = '#100e14';
          wallQuad(-6, 6, zm, -0.2, 0.95); g.fill();
          g.fillStyle = C.mask; wallQuad(-6, 6, zm, 0.95, 2.35); g.fill();
          g.strokeStyle = '#0d0b10'; g.lineWidth = 2; g.stroke();
          // neighbouring panels' seams and stars
          for (let k = -2; k <= 2; k++) {
            const x0 = k * 3.1 - 1.55;
            const a = proj(x0, zm, 0.95), b = proj(x0, zm, 2.35);
            g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 2; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
            starburst(k * 3.1, zm, k === 0);
          }
          // neighbour lanes, capping, gutters
          g.fillStyle = C.neighbor; quad(-6, -1.56, zN, ZE); g.fill(); quad(1.56, 6, zN, ZE); g.fill();
          g.fillStyle = C.cap; quad(-1.56, -1.24, zN, ZE, 0.05); g.fill(); quad(1.24, 1.56, zN, ZE, 0.05); g.fill();
          g.strokeStyle = alpha(C.ink, 0.35); g.lineWidth = 1; quad(-1.56, -1.24, zN, ZE, 0.05); g.stroke(); quad(1.24, 1.56, zN, ZE, 0.05); g.stroke();
          g.fillStyle = C.gutter; quad(-1.24, -1, zN, ZE); g.fill(); quad(1, 1.24, zN, ZE); g.fill();
          g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
          [[-1.12], [1.12]].forEach(([x]) => { const a = proj(x, zN), b = proj(x, ZE); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); });
          // approach + lane
          g.fillStyle = C.approach; quad(-1, 1, zN, 0); g.fill();
          g.fillStyle = C.wood; quad(-1, 1, 0, ZE); g.fill();
          g.fillStyle = C.woodB; quad(-1, 1, ZP - 0.7, ZE); g.fill();
          // boards
          for (let k = -19; k <= 19; k++) {
            const x = k / 19.5;
            const a = proj(x, Math.max(zN, -6)), b = proj(x, ZE);
            g.strokeStyle = k % 5 === 0 ? alpha(C.ink, dark ? 0.28 : 0.16) : C.board; g.lineWidth = k % 5 === 0 ? 1.1 : 0.6;
            g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
          }
          // lane sheen
          const top = proj(0, ZE)[1], bot = proj(0, Math.max(zN, 0))[1];
          if (bot > top) {
            const sh = g.createLinearGradient(0, top, 0, bot);
            sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.6, dark ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.18)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = sh; quad(-1, 1, Math.max(zN, 0), ZE); g.fill();
          }
          // foul line
          g.fillStyle = dark ? '#0d0b10' : '#2a221c'; quad(-1.24, 1.24, -0.06, 0.06); g.fill();
          // arrows and dots
          g.fillStyle = dark ? 'rgba(10,8,14,.7)' : 'rgba(42,34,28,.6)';
          [-0.77, -0.51, -0.26, 0, 0.26, 0.51, 0.77].forEach((x) => {
            const z0 = 5.2 - Math.abs(x) * 1.2;
            const a = proj(x - 0.05, z0), b = proj(x + 0.05, z0), c = proj(x, z0 + 0.9);
            g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.closePath(); g.fill();
          });
          [-0.87, -0.62, -0.36, -0.1, 0.1, 0.36, 0.62, 0.87].forEach((x) => {
            const [px, py, s] = proj(x, 2.2);
            g.beginPath(); g.ellipse(px, py, 0.025 * L.hw * s, 0.009 * L.hw * s, 0, 0, 6.29); g.fill();
          });
          // pin spots
          g.fillStyle = alpha(C.ink, 0.25);
          PINS.forEach(([x, dz]) => { const [px, py, s] = proj(x, ZP + dz); g.beginPath(); g.ellipse(px, py, 0.04 * L.hw * s, 0.014 * L.hw * s, 0, 0, 6.29); g.fill(); });
        }
        function starburst(x, z, main) {
          const [cx, cy, s] = proj(x, z, 1.65);
          const r = 0.5 * L.hw * s;
          g.save(); g.translate(cx, cy);
          g.strokeStyle = C.gold; g.lineWidth = Math.max(1, 0.03 * L.hw * s);
          for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + 0.2; g.beginPath(); g.moveTo(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42); g.lineTo(Math.cos(a) * r * (i % 2 ? 0.75 : 1.05), Math.sin(a) * r * (i % 2 ? 0.75 : 1.05)); g.stroke(); }
          g.fillStyle = main ? '#fbf4e2' : alpha('#fbf4e2', 0.4); g.beginPath(); g.arc(0, 0, r * 0.4, 0, 6.29); g.fill();
          g.fillStyle = main ? C.route : alpha(C.route, 0.5);
          g.font = util.font('sign', Math.max(8, r * 0.48), 900); g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(main ? '11' : (x < 0 ? '10' : '12'), 0, r * 0.04);
          g.restore();
          if (main) {
            g.strokeStyle = C.route; g.lineWidth = Math.max(2, 0.06 * L.hw * s);
            const a = proj(-1.4, z, 1.08), b = proj(1.4, z, 1.08);
            g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
          }
        }
        function drawSweepBar() {
          if (sweep < 0) return;
          const drop = Math.min(1, sweep * 3);
          const zb = ZP - 0.75 + Math.max(0, sweep - 0.25) * 3.2;
          const hgt = 1.2 - drop * 0.95;
          g.fillStyle = mix(C.mask, '#000', 0.25);
          wallQuad(-1.3, 1.3, Math.min(zb, ZE), hgt, hgt + 0.16); g.fill();
          g.strokeStyle = '#0d0b10'; g.lineWidth = 1.5; g.stroke();
        }
        function drawAimGuide() {
          if (phase !== 'aim' && phase !== 'power') return;
          const x = phase === 'aim' ? aim : lockedAim;
          g.save();
          g.strokeStyle = alpha(C.route, phase === 'aim' ? 0.7 : 0.9); g.lineWidth = 2.5; g.setLineDash([6, 7]);
          g.lineDashOffset = -T * 30;
          const a = proj(x, 0.3), b = proj(x, ZP - 0.4);
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
          g.restore();
          // marker chevron on the approach
          const [px, py] = proj(x, -0.35);
          g.fillStyle = C.route; g.strokeStyle = C.ink; g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(px, py + 8 * U); g.lineTo(px - 12 * U, py + 20 * U); g.lineTo(px + 12 * U, py + 20 * U); g.closePath(); g.fill(); g.stroke();
        }
        function drawMeter() {
          const x0 = W * 0.16, x1 = W * 0.84, y = L.meterY, hh = 18 * U;
          const active = phase === 'power';
          g.save();
          g.globalAlpha = active || phase === 'aim' ? 1 : 0.55;
          g.fillStyle = C.card; g.strokeStyle = C.ink; g.lineWidth = 2;
          g.beginPath(); g.rect(x0, y, x1 - x0, hh); g.fill();
          const v = phase === 'power' ? power : phase === 'aim' ? 0 : lockedPower;
          const gr = g.createLinearGradient(x0, 0, x1, 0);
          gr.addColorStop(0, C.park); gr.addColorStop(0.55, C.gold); gr.addColorStop(1, C.route);
          g.fillStyle = gr; g.fillRect(x0, y, (x1 - x0) * v, hh);
          g.strokeRect(x0, y, x1 - x0, hh);
          g.strokeStyle = alpha(C.ink, 0.5); g.lineWidth = 1;
          [0.25, 0.5, 0.75].forEach((f) => { g.beginPath(); g.moveTo(x0 + (x1 - x0) * f, y + hh * 0.55); g.lineTo(x0 + (x1 - x0) * f, y + hh); g.stroke(); });
          g.fillStyle = C.ink; g.font = util.font('sign', 11 * U, 900); g.textAlign = 'right'; g.textBaseline = 'middle';
          g.fillText('PWR', x0 - 6 * U, y + hh / 2);
          g.textAlign = 'left'; g.fillText('MAX', x1 + 6 * U, y + hh / 2);
          if (message) {
            g.textAlign = 'center'; g.textBaseline = 'alphabetic';
            g.font = util.font('sign', 14 * U, 900);
            const pulse = RM ? 1 : 0.75 + 0.25 * Math.sin(T * 6);
            g.fillStyle = alpha(C.ink, pulse);
            g.fillText(message, W / 2, y - 12 * U);
          }
          g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = C.inkSoft; g.font = util.font('sign', 11 * U, 800);
          g.fillText('FRAME ' + Math.min(frame + 1, frames) + ' OF ' + frames + '  ·  BALL ' + (roll + 1), W / 2, y + hh + 16 * U);
          g.restore();
        }
        function draw() {
          g.clearRect(0, 0, W, H);
          drawLane();
          drawAimGuide();
          // depth-sorted pins and ball
          const items = [];
          for (const p of R.pins) if (p.present && !p.gone && p.fade > 0.01) items.push({ z: p.z, p });
          const showBall = phase === 'aim' || phase === 'power';
          if (showBall) items.push({ z: ballShow.z, ball: { x: ballShow.x, z: ballShow.z, roll: 0, gutter: false, holes: true } });
          else if (!R.ball.gone) items.push({ z: R.ball.z, ball: { x: R.ball.x, z: R.ball.z, roll: R.ball.roll, gutter: R.ball.gutter, holes: false } });
          items.sort((a, b) => b.z - a.z);
          for (const it of items) {
            if (it.p) drawPin(it.p);
            else drawBall(it.ball.x, it.ball.z, it.ball.roll, it.ball.gutter, it.ball.holes);
          }
          drawSweepBar();
          drawMeter();
        }

        // first roll: show the full rack
        R = makeRoll(standing, 0, 0.5, K, rnd); R.done = true; R.ball.gone = true;
        util.loop((dt) => { if (settled) return false; frames0++; update(dt); draw(); return true; }, signal);
        draw();
      });
    },
  });
})();

<script>/* games/bull.js */
/* Ride the Bull - PBR, Virginia Beach. Stay on the mechanical bull for 8 seconds. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ---------- color helpers ---------- */
  function rgbOf(c) {
    const s = String(c || '').trim();
    let m = /^#([0-9a-f]{3})$/i.exec(s);
    if (m) return m[1].split('').map((x) => parseInt(x + x, 16));
    m = /^#([0-9a-f]{6})/i.exec(s);
    if (m) return [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16));
    m = /rgba?\(([^)]+)\)/i.exec(s);
    if (m) return m[1].split(',').slice(0, 3).map((v) => parseFloat(v));
    return [128, 128, 128];
  }
  const mix = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const alpha = (c, a) => 'rgba(' + rgbOf(c).join(',') + ',' + a + ')';

  /* ---------- ride physics: pure, shared by the live game and the debug simulator ---------- */
  function newRide(rnd) {
    return { t: 0, bal: 0, vel: 0, spinDir: rnd() < 0.5 ? -1 : 1, spinT: 1.3, buckT: 0.75, buckDir: rnd() < 0.5 ? -1 : 1, windup: false, ev: 0 };
  }
  // input: -1 = lean left, 0 = none, 1 = lean right. S.ev collects events (1 buck, 2 wind-up, 4 turn).
  function stepRide(S, K, input, dt, rnd) {
    S.t += dt;
    const p = Math.min(1, S.t / K.seconds);
    const power = 1 + K.ramp * p;
    S.spinT -= dt;
    if (S.spinT <= 0) { S.spinDir = -S.spinDir; S.spinT = K.spinEvery * (0.7 + rnd() * 0.6) * (1 - 0.35 * p); S.ev |= 4; }
    S.buckT -= dt;
    if (!S.windup && S.buckT <= K.windup) { S.windup = true; S.buckDir = rnd() < 0.6 ? -S.buckDir : S.buckDir; S.ev |= 2; }
    if (S.buckT <= 0) {
      S.vel += S.buckDir * K.buckForce * power * (0.8 + rnd() * 0.4);
      S.buckT = Math.max(K.windup + 0.12, K.buckEvery * (1 - K.quicken * p) * (0.85 + rnd() * 0.3));
      S.windup = false;
      S.ev |= 1;
    }
    const a = K.instab * S.bal + K.spinForce * S.spinDir * power + input * K.push;
    S.vel = (S.vel + a * dt) * Math.exp(-K.damping * dt);
    S.bal += S.vel * dt;
  }
  // Debug-only: a delayed, noisy "human" controller rides many times; returns the win rate.
  function simulate(K, bot, runs) {
    const B = Object.assign({ delay: 0.25, lead: 0.3, dead: 0.12, every: 0.1, noise: 0.06, tap: true }, bot || {});
    const dt = 1 / 120;
    let wins = 0, total = 0;
    for (let r = 0; r < (runs || 200); r++) {
      const S = newRide(Math.random);
      const hist = [];
      let input = 0, next = 0, alive = true;
      const lag = Math.max(0, Math.round(B.delay / dt));
      while (S.t < K.seconds) {
        hist.push(S.bal, S.vel);
        if (S.t >= next) {
          next = S.t + B.every;
          const i = Math.max(0, hist.length / 2 - 1 - lag) * 2;
          const est = hist[i] + B.lead * hist[i + 1] + (Math.random() * 2 - 1) * B.noise;
          const want = est > B.dead ? -1 : est < -B.dead ? 1 : 0;
          if (B.tap && want !== 0 && want !== input) S.vel += want * K.tapKick;
          input = want;
        }
        S.ev = 0;
        stepRide(S, K, input, dt, Math.random);
        if (Math.abs(S.bal) >= 1) { alive = false; break; }
      }
      if (alive) wins++;
      total += Math.min(S.t, K.seconds);
    }
    return { winRate: wins / (runs || 200), avgTime: total / (runs || 200) };
  }

  const BASE = {
    seconds: 8, record: 2.4, buckForce: 0.9, buckEvery: 0.95, quicken: 0.4, ramp: 0.8, windup: 0.24,
    spinForce: 0.55, spinEvery: 1.7, instab: 1.4, push: 4.2, tapKick: 0.3, damping: 1.8, safeZone: 0.4,
  };

  SCQ.registerGame('bull', {
    title: 'Ride the Bull',
    howTo: [
      'Tap or hold the left or right side of the screen to lean that way.',
      'Lean against the bucks and keep the needle in the green.',
      'Hang on for 8 seconds. Micah lasted 2.4.',
    ],
    defaults: {
      seconds: 8,          // ride length to win
      record: 2.4,         // Micah's time, for the "New record!" banner
      buckForce: 0.9,      // kick each buck gives the balance (balance units / s)
      buckEvery: 0.95,     // seconds between bucks at the start
      quicken: 0.4,        // bucks come this much faster by the end (0.4 = 40% quicker)
      ramp: 0.8,           // bucks and spin get this much stronger by the end
      windup: 0.24,        // seconds of warning (the bull dips) before each buck
      spinForce: 0.55,     // steady push while the bull spins one way
      spinEvery: 1.7,      // average seconds between spin direction changes
      instab: 1.4,         // how fast a lean grows on its own (tipping)
      push: 4.2,           // strength of holding a side
      tapKick: 0.3,        // instant nudge on each new tap
      damping: 1.8,        // how quickly motion settles
      safeZone: 0.4,       // half-width of the green zone on the meter (visual)
      eased: { buckForce: 0.7, buckEvery: 1.15, ramp: 0.5, instab: 1.0, spinForce: 0.4, push: 4.6, damping: 2.0, safeZone: 0.5 },
    },

    start(stage, ctx) {
      const util = ctx.util, sound = ctx.sound, signal = ctx.signal;
      const K = Object.assign({}, BASE, ctx.params || {});
      const P = ctx.palette || {};
      const dark = !!P.dark;
      const RM = !!ctx.reducedMotion;
      const rnd = Math.random;

      return new Promise((resolve, reject) => {
        const cv = util.makeCanvas(stage, { signal });
        const g = cv.g;
        const hud = util.hud(stage, [
          { key: 'time', label: 'Your time', value: '0.0s' },
          { key: 'goal', label: 'Goal', value: K.seconds.toFixed(1) + 's' },
          { key: 'rec', label: "Micah's best", value: K.record.toFixed(1) + 's' },
        ]);
        const recItem = hud.el.children[2];

        /* ---------- colors ---------- */
        const C = {
          ink: P.ink || '#2a221c', inkSoft: P.inkSoft || '#5e5042', card: P.card || '#fbf4e2',
          paper: P.paper || '#f0e4c8', paper2: P.paper2 || '#e3d2ad',
          route: dark ? mix(P.route, P.paper, 0.12) : P.route, shield: dark ? mix(P.shield, P.paper, 0.25) : P.shield,
          park: P.park || '#56763a', gold: P.gold || '#c98f22',
        };
        C.wall = mix(P.paper2, '#8b5a2b', dark ? 0.32 : 0.4);
        C.wall2 = mix(C.wall, '#000', 0.08);
        C.wood = mix(C.wall, '#3b2412', dark ? 0.35 : 0.3);
        C.floor = mix(P.gold, P.paper, dark ? 0.64 : 0.42);
        C.line = dark ? 'rgba(0,0,0,.35)' : 'rgba(42,34,28,.28)';
        C.bull = dark ? '#7a4a2a' : '#8a512b';
        C.bullDark = dark ? '#4e2e1a' : '#5e341b';
        C.bullLight = dark ? '#a7744c' : '#b8814f';
        C.horn = '#f2e5c2';
        C.out = '#2a1a10';
        C.sil = C.ink;
        C.metal = dark ? '#5a5866' : '#4a4540';

        /* ---------- layout + cached background layers ---------- */
        let W = 0, H = 0, U = 1;
        const L = {};
        let back = null, front = null;
        function layer() {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(W * cv.dpr)); c.height = Math.max(1, Math.round(H * cv.dpr));
          const x = c.getContext('2d'); x.setTransform(cv.dpr, 0, 0, cv.dpr, 0, 0);
          return { c, x };
        }
        function layout() {
          W = cv.w; H = cv.h;
          U = Math.max(0.7, Math.min(W / 390, H / 740, 1.35));
          L.cx = W / 2;
          L.lightsY = 58;
          L.signW = Math.min(W - 48 * U, 300 * U); L.signH = 70 * U;
          L.signY = L.lightsY + 40 * U + L.signH / 2;
          L.floorY = Math.max(L.signY + L.signH / 2 + 70 * U, H * 0.45);
          L.bs = U * 1.18;
          L.ringRx = Math.min(W * 0.47, 250 * U); L.ringRy = L.ringRx * 0.28;
          L.ringT = 24 * U;
          L.ringCy = Math.max(L.floorY + L.ringRy + 30 * U, H * 0.665);
          L.gr = Math.min(80 * U, W * 0.21);
          L.gy = H - 26 * U;
          L.bullY = L.ringCy - 78 * L.bs;
          L.padW = Math.max(60, L.cx - L.gr - 28 * U - 12 * U);
          L.padH = 50 * U;

        }
        function buildLayers() {
          const B = layer(), x = B.x;
          const rs = util.seeded(7);
          // wall planks
          x.fillStyle = C.wall; x.fillRect(0, 0, W, L.floorY);
          const pw = 30 * U;
          for (let i = 0, px = -rs() * pw; px < W; i++, px += pw) {
            if (i % 2) { x.fillStyle = C.wall2; x.fillRect(px, 0, pw, L.floorY); }
            x.strokeStyle = C.line; x.lineWidth = 1.2; x.beginPath(); x.moveTo(px, 0); x.lineTo(px, L.floorY); x.stroke();
            // wood grain: a few long faint streaks and the odd dark knot
            x.strokeStyle = dark ? 'rgba(0,0,0,.18)' : 'rgba(90,55,25,.13)'; x.lineWidth = 1;
            for (let k = 0; k < 2; k++) { const gx = px + pw * (0.25 + rs() * 0.5), gy = rs() * L.floorY; x.beginPath(); x.moveTo(gx, gy); x.quadraticCurveTo(gx + (rs() - 0.5) * 6 * U, gy + 40 * U, gx, gy + 90 * U); x.stroke(); }
            if (rs() < 0.3) { x.fillStyle = dark ? 'rgba(0,0,0,.28)' : 'rgba(90,55,25,.3)'; x.beginPath(); x.ellipse(px + pw * (0.3 + rs() * 0.4), rs() * L.floorY, 2.2 * U, 3.6 * U, 0, 0, 6.29); x.fill(); }

          const wy = L.floorY - 60 * U, wr = 34 * U, wx = Math.max(40 * U, L.cx - L.ringRx * 0.82);

          x.lineWidth = 3 * U;
          for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.beginPath(); x.moveTo(wx, wy); x.lineTo(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr); x.stroke(); }
          x.fillStyle = C.wood; x.beginPath(); x.arc(wx, wy, 6 * U, 0, 6.29); x.fill();
          const hx = Math.min(W - 40 * U, L.cx + L.ringRx * 0.8);
          [[hx - 22 * U, L.floorY - 102 * U, C.route], [hx + 16 * U, L.floorY - 82 * U, C.shield]].forEach(([px, py, col]) => {
            x.fillStyle = C.wood; x.beginPath(); x.arc(px, py - 6 * U, 2.5 * U, 0, 6.29); x.fill();
            hatShape(x, px, py, 1.3 * U, col);
          });
          // fence rail at the bottom of the wall
          const fy = L.floorY - 38 * U;
          x.fillStyle = C.wood;
          for (let px = 14 * U; px < W; px += 64 * U) x.fillRect(px, fy - 6 * U, 8 * U, 44 * U);
          x.fillRect(0, fy, W, 9 * U); x.fillRect(0, fy + 18 * U, W, 9 * U);
          x.strokeStyle = C.line; x.lineWidth = 1; x.strokeRect(-1, fy, W + 2, 9 * U); x.strokeRect(-1, fy + 18 * U, W + 2, 9 * U);

          x.fillStyle = C.floor; x.fillRect(0, L.floorY, W, H - L.floorY);
          x.fillStyle = mix(C.floor, '#000', 0.12); x.fillRect(0, L.floorY, W, 3 * U);
          const n = Math.round(W * (H - L.floorY) / 90);
          for (let i = 0; i < n; i++) {
            x.fillStyle = rs() < 0.5 ? alpha(mix(C.floor, '#5a3a1a', 0.5), 0.5) : alpha(mix(C.floor, '#fff3cf', 0.5), 0.6);
            const sx = rs() * W, sy = L.floorY + rs() * (H - L.floorY);
            x.fillRect(sx, sy, (1 + rs() * 2.5) * U, (0.8 + rs()) * U);
          }
          // the mat inside the ring
          x.fillStyle = alpha(mix(C.floor, '#5a3a1a', 0.35), 0.45);
          x.beginPath(); x.ellipse(L.cx, L.ringCy, L.ringRx * 0.9, L.ringRy * 0.9, 0, 0, 6.29); x.fill();
          ring(x, true);
          back = B.c;
          const F = layer(); ring(F.x, false);
          // hay bales between the ring and the controls, when there is room
          const by = L.ringCy + L.ringRy + 18 * U, bh = 30 * U, bw = 70 * U;
          if (by + bh < L.gy - L.gr - 16 * U) {
            [[10 * U, 0], [W - 10 * U - bw, 1]].forEach(([bx, i]) => {
              const x = F.x;
              x.fillStyle = mix(C.gold, '#f3dc8a', dark ? 0.1 : 0.35); x.strokeStyle = C.out; x.lineWidth = 1.6;
              rr(x, bx, by + i * 6 * U, bw, bh, 5 * U); x.fill(); x.stroke();
              x.strokeStyle = alpha('#6b4a12', 0.5); x.lineWidth = 1;
              for (let k = 0; k < 9; k++) { const yy = by + i * 6 * U + 5 * U + rs() * (bh - 10 * U); x.beginPath(); x.moveTo(bx + 4 * U + rs() * 10 * U, yy); x.lineTo(bx + bw - 4 * U - rs() * 10 * U, yy + (rs() - 0.5) * 3 * U); x.stroke(); }
              x.strokeStyle = C.route; x.lineWidth = 2.2 * U;

            });

        }
        function ring(x, isBack) {

        cv.onResize = () => layout();
        layout();

        /* ---------- game state ---------- */
        const S = newRide(rnd);
        let phase = 'ready', T = 0, recordShown = false, settled = false;
        let facing = S.spinDir >= 0 ? 1 : -1, turnK = 1, turnFrom = facing;
        let kick = 0, kickV = 0, dip = 0, shake = 0, armT = 0;
        const flash = [0, 0];
        let rider = null; // thrown rider
        let hat = null;
        const confetti = [];

        /* ---------- input ---------- */
        const holds = new Map();
        let keyL = false, keyR = false, presses = 0, frames = 0;
        function inputDir() {
          let l = keyL, r = keyR;
          holds.forEach((s) => { if (s < 0) l = true; else r = true; });
          return (r ? 1 : 0) - (l ? 1 : 0);
        }
        function press(side) {
          presses++;
          flash[side < 0 ? 0 : 1] = 1;
          if (phase === 'ride') { S.vel += side * K.tapKick; sound.play('tap'); }
        }
        stage.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const r = stage.getBoundingClientRect();
          const side = e.clientX - r.left < r.width / 2 ? -1 : 1;
          holds.set(e.pointerId, side);
          press(side);
        }, { signal });
        const release = (e) => { holds.delete(e.pointerId); };
        window.addEventListener('pointerup', release, { signal });
        window.addEventListener('pointercancel', release, { signal });
        window.addEventListener('blur', () => { holds.clear(); keyL = keyR = false; }, { signal });
        window.addEventListener('keydown', (e) => {
          const k = e.key;
          const left = k === 'ArrowLeft' || k === 'a' || k === 'A';
          const right = k === 'ArrowRight' || k === 'd' || k === 'D';
          if (!left && !right) return;
          e.preventDefault();
          if (left) { if (!keyL && !e.repeat) press(-1); keyL = true; }
          if (right) { if (!keyR && !e.repeat) press(1); keyR = true; }
        }, { signal });
        window.addEventListener('keyup', (e) => {
          const k = e.key;
          if (k === 'ArrowLeft' || k === 'a' || k === 'A') keyL = false;
          if (k === 'ArrowRight' || k === 'd' || k === 'D') keyR = false;
        }, { signal });

        if (ctx.debug) {
          SCQ.test.bull = {
            state: () => ({ phase, t: S.t, bal: S.bal, vel: S.vel, input: inputDir(), holds: holds.size, presses, frames }),
            sim: (bot, runs, over) => simulate(Object.assign({}, K, over || {}), bot, runs),
            params: K,
          };
        }

        /* ---------- outcomes ---------- */
        function finish(result, ms) {
          util.wait(ms, signal).then(() => { settled = true; resolve(result); }).catch(() => {});
        }
        function throwRider() {
          phase = 'thrown';
          const side = S.bal > 0 ? 1 : -1;
          const pose = riderWorld();
          rider = { x: pose.x, y: pose.y, a: pose.a, vx: side * (150 + rnd() * 60) * U, vy: -250 * U, va: side * 7, face: facing, landed: false };
          hat = { x: pose.hx, y: pose.hy, a: pose.a, vx: side * 90 * U - 40 * U * side, vy: -330 * U, va: -side * 9, landed: false };
          sound.play('whoosh');
          shake = RM ? 0 : 1;
          finish('lose', 1500);
        }
        function winRide() {
          phase = 'won';
          sound.play('good');
          util.banner(stage, 'Yeehaw!', 1300);
          const cols = [C.route, C.shield, C.gold, C.park];
          for (let i = 0; i < (RM ? 0 : 70); i++) {
            confetti.push({ x: L.cx + (rnd() - 0.5) * 60 * U, y: L.bullY - 120 * U, vx: (rnd() - 0.5) * 420 * U, vy: (-200 - rnd() * 320) * U, a: rnd() * 6, va: (rnd() - 0.5) * 14, c: cols[i % 4], s: (4 + rnd() * 4) * U });
          }
          finish('win', 1500);
        }

        /* ---------- per-frame update ---------- */
        function update(dt) {
          T += dt;

            S.ev = 0;
            const inp = inputDir();
            const n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;
            for (let i = 0; i < n; i++) { stepRide(S, K, inp, h, rnd); if (Math.abs(S.bal) >= 1) break; }
            if (S.ev & 2) { dip = 1; sound.tone(220, 0.12, { type: 'square', vol: 0.04, slide: 330 }); }
            if (S.ev & 1) { kickV += S.buckDir * 9; dip = 0; shake = RM ? 0 : 0.5; sound.play('thud'); }
            if (S.ev & 4) { turnFrom = facing; facing = -facing; turnK = 0; sound.tone(140, 0.25, { type: 'sawtooth', vol: 0.03, slide: 90 }); }
            hud.set('time', Math.min(S.t, K.seconds).toFixed(1) + 's');
            if (!recordShown && S.t >= K.record) {

              util.banner(stage, 'New record!', 1300);
              sound.play('coin');

            }
            if (Math.abs(S.bal) >= 1) { S.bal = Math.sign(S.bal); throwRider(); }
            else if (S.t >= K.seconds) { hud.set('time', K.seconds.toFixed(1) + 's'); winRide(); }
          } else if (phase === 'won') {
            S.bal *= Math.exp(-3 * dt); S.vel = 0;
          }

          kickV += (-kick * 70 - kickV * 9) * dt;
          kick += kickV * dt;
          dip = Math.max(0, dip - dt * 3);
          shake = Math.max(0, shake - dt * 2.5);
          turnK = Math.min(1, turnK + dt / 0.35);
          flash[0] = Math.max(0, flash[0] - dt * 4); flash[1] = Math.max(0, flash[1] - dt * 4);
          armT += dt * (phase === 'ride' ? 6 + Math.abs(S.vel) * 6 : 2);
                    if (rider && !rider.landed) {
            rider.vy += 900 * U * dt; rider.x += rider.vx * dt; rider.y += rider.vy * dt; rider.a += rider.va * dt;
            const fy = L.ringCy + L.ringRy * 0.45;

        }

        /* ---------- drawing ---------- */
        function bullPose() {
          const tScale = turnK < 1 ? Math.cos(Math.PI * turnK) * -turnFrom : facing;
          const sx = turnK < 1 ? (Math.abs(tScale) < 0.12 ? 0.12 * Math.sign(tScale || facing) : tScale) : facing;
          const pre = dip * -S.buckDir * 0.1;
          const rot = (phase === 'thrown' ? 0.12 * Math.sign(S.bal) : 0.14 * S.bal) + kick * 0.03 + pre;
          const bob = -Math.abs(kick) * 1.6 * U + Math.sin(T * 9) * (phase === 'ride' ? 1.5 : 0.4) * U;

        }
        function leanAngle() { return phase === 'won' ? S.bal * 0.5 : S.bal * 0.85 + S.vel * 0.06; }
        function riderWorld() {
          const b = bullPose();
          const s = L.bs, sx = b.sx;
          const lx = 0, ly = -36; // hips in bull space
          const c = Math.cos(b.rot), sn = Math.sin(b.rot);
          const px = lx * sx * s, py = ly * s;

          return { x, y, a, hx, hy };
        }

        function drawLights() {
          const y0 = L.lightsY;
          const strands = [[0, W, 24 * U, 0], [-20, W + 20, 34 * U, 1]];
          strands.forEach(([x0, x1, sag, o]) => {
            g.strokeStyle = dark ? 'rgba(239,227,200,.5)' : 'rgba(42,34,28,.55)';
            g.lineWidth = 1.4;
            g.beginPath();
            for (let i = 0; i <= 30; i++) { const t = i / 30; const x = x0 + (x1 - x0) * t; const y = y0 + o * 6 * U + Math.sin(Math.PI * t) * sag; i ? g.lineTo(x, y) : g.moveTo(x, y); }

            const cols = ['#ffd36b', '#ff7a5c', '#8fc3ff', '#b9e48a'];
            const nb = Math.round((x1 - x0) / (30 * U));

              const t = (i + o * 0.5) / nb;
              const x = x0 + (x1 - x0) * t, y = y0 + o * 6 * U + Math.sin(Math.PI * t) * sag;
              const tw = RM ? 1 : 0.75 + 0.25 * Math.sin(T * 3 + i * 1.7 + o);

              gl.addColorStop(0, alpha(col, (dark ? 0.55 : 0.35) * tw)); gl.addColorStop(1, alpha(col, 0));

              g.fillStyle = col; g.beginPath(); g.ellipse(x, y + 5 * U, 3.2 * U, 4.6 * U, 0, 0, 6.29); g.fill();
              g.fillStyle = C.metal; g.fillRect(x - 2 * U, y - 1 * U, 4 * U, 3 * U);
            }
          });
        }
        let flick = 0;
        function drawSign() {
          const w = L.signW, hh = L.signH, x = L.cx - w / 2, y = L.signY - hh / 2;
          // chains
          g.strokeStyle = dark ? 'rgba(239,227,200,.45)' : 'rgba(42,34,28,.5)'; g.lineWidth = 1.5; g.setLineDash([3, 2]);
          g.beginPath(); g.moveTo(x + 24 * U, 0); g.lineTo(x + 24 * U, y); g.moveTo(x + w - 24 * U, 0); g.lineTo(x + w - 24 * U, y); g.stroke();

          g.strokeStyle = dark ? '#000' : C.out; g.lineWidth = 2.5; g.stroke();
          g.fillStyle = '#3a3542';
          [[x + 8 * U, y + 8 * U], [x + w - 8 * U, y + 8 * U], [x + 8 * U, y + hh - 8 * U], [x + w - 8 * U, y + hh - 8 * U]].forEach(([a, b]) => { g.beginPath(); g.arc(a, b, 2.2 * U, 0, 6.29); g.fill(); });

          let fs = 30 * U;
          g.font = util.font('sign', fs, 900);
          g.textAlign = 'left';
          const label1 = 'BULL', label2 = 'RIDING';
          const gap = 12 * U;
          const w1 = g.measureText(label1).width, w2 = g.measureText(label2).width;
          const avail = w - 70 * U;
          if (w1 + w2 + gap > avail) { fs *= avail / (w1 + w2 + gap); g.font = util.font('sign', fs, 900); }

          const tx = L.cx - (m1 + m2 + gap) / 2, ty = L.signY + fs * 0.36;

        function neonText(t, x, y, col, on) {
          g.save();
          g.lineJoin = 'round';

          g.strokeStyle = on ? col : '#5a2a28'; g.lineWidth = 2.6 * U;

        function neonHorseshoe(x, y, col) {

        function drawBase() {

          g.lineJoin = 'round'; g.lineCap = 'round';

          g.fillStyle = C.bullDark; g.beginPath(); g.ellipse(-96, 30 + tw, 4, 7, 0.2, 0, 6.29); g.fill();
          g.strokeStyle = C.out; g.lineWidth = 2.4;

        }

        function draw() {
          g.save();
          g.clearRect(0, 0, W, H);

          g.restore();

        util.loop((dt) => { if (settled) return false; frames++; update(dt); draw(); return true; }, signal);
        draw();

        util.countdown(stage, signal).then(() => {
          if (signal.aborted) return;
          phase = 'ride';
          sound.play('horn');
        }).catch((err) => reject(err));
      });
    },
  });
})();
