<script>/* games/drive.js */
/* Stella's Cozy Quest - minigame "Night Drive" (I-64 at midnight, Richmond to Charlottesville).
   Three-lane top-down interstate: dodge deer, potholes, cones and slow trucks; grab Cokes and medicine. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ------------------------------------------------------------------ simulation (pure; tests drive it in Node)
     Units: x in lanes (0 = left lane, 2 = right lane), y in screen heights (0 = top of the road, 1 = bottom). */
  const CAR_Y = 0.8, CAR_LEN = 0.1, CAR_W = 0.5, SPAWN_Y = -0.15, HIT_K = 0.84;
  const KINDS = {
    pothole: { len: 0.045, w: 0.5 },
    cones: { len: 0.1, w: 0.5 },
    truck: { len: 0.25, w: 0.68 },
    deer: { len: 0.05, w: 0.62 },
    coke: { len: 0.035, w: 0.36, value: 1 },
    meds: { len: 0.04, w: 0.36, value: 2 },
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function newState(P) {
    return {
      t: 0, p: 0, speed: P.speedStart, dist: 0, nextSpawn: 0.3, lastGap: 1, prevFree: [0, 1, 2],
      truckLane: -1, truckUntil: 0, lives: P.lives, score: 0, cokes: 0, meds: 0, hits: 0, invuln: 0,
      lane: 1, carX: 1, objs: [], over: false, won: false, events: [], id: 0,
    };
  }
  function addObj(s, kind, lane, y, extra) {
    const k = KINDS[kind];
    s.objs.push(Object.assign({ id: ++s.id, kind, lane, x: lane, y, len: k.len, w: k.w, value: k.value || 0 }, extra || {}));
  }
  function spawnRow(s, P, rnd) {
    const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
    const p = s.p;
    const gap = lerp(P.gapStart, P.gapEnd, p);
    const truckLane = s.truckLane >= 0 && s.t < s.truckUntil ? s.truckLane : -1;
    const avail = [0, 1, 2].filter((l) => l !== truckLane);
    const maxShift = s.lastGap >= P.twoLaneTime ? 2 : 1;
    const reach = (free) => free.filter((f) => s.prevFree.some((q) => Math.abs(q - f) <= maxShift));
    const hazardKind = (lane, allowDeer) => {
      if (allowDeer && (lane === 0 || lane === 2) && rnd() < P.deerChance) return 'deer';
      return rnd() < 0.62 ? 'pothole' : 'cones';
    };
    const place = (lanes, y, allowDeer) => {
      let deer = false;
      lanes.forEach((l) => {
        const kind = hazardKind(l, allowDeer && !deer);
        if (kind === 'deer') {
          deer = true;
          addObj(s, 'deer', l, y, { x: l === 0 ? -0.95 : 2.95, side: l === 0 ? -1 : 1, state: 'wait' });
        } else addObj(s, kind, l, y);
      });
    };
    let free, rowGap = gap;
    if (truckLane < 0 && p > 0.1 && p < 0.86 && rnd() < P.truckChance) {
      // a slow truck in an outer lane; its lane stays closed until it is passed
      const lane = pick([0, 2]);
      addObj(s, 'truck', lane, SPAWN_Y - 0.1);
      s.truckLane = lane;
      s.truckUntil = s.t + (CAR_Y + CAR_LEN / 2 + KINDS.truck.len + 0.25 - SPAWN_Y) / (s.speed * P.truckRel);
      free = [0, 1, 2].filter((l) => l !== lane);
    } else if (truckLane < 0 && p > P.zigFrom && rnd() < P.zigChance && reach([0, 2]).length) {
      // two quick rows that need a double lane change
      const f1 = pick(reach([0, 2])), f2 = 2 - f1;
      place([0, 1, 2].filter((l) => l !== f1), SPAWN_Y, false);
      place([0, 1, 2].filter((l) => l !== f2), SPAWN_Y - P.zigGap * s.speed, false);
      if (rnd() < 0.6) addObj(s, rnd() < 0.7 ? 'coke' : 'meds', f1, SPAWN_Y);
      s.prevFree = [f2];
      s.lastGap = gap;
      s.nextSpawn += (P.zigGap + gap) * s.speed;
      return;
    } else if (rnd() < lerp(P.doubleStart, P.doubleEnd, p) && reach(avail).length) {
      const f = pick(reach(avail));
      place(avail.filter((l) => l !== f), SPAWN_Y, true);
      free = [f];
    } else {
      const options = avail.filter((b) => reach(avail.filter((l) => l !== b)).length);
      const b = options.length ? pick(options) : avail[0];
      place([b], SPAWN_Y, true);
      free = avail.filter((l) => l !== b);
    }
    if (rnd() < P.snackChance && free.length) {
      const lane = pick(free);
      // most snacks sit on the safe line; some float between rows to tempt a lane change
      const between = rnd() < 0.35;
      addObj(s, rnd() < 0.7 ? 'coke' : 'meds', between ? pick(avail) : lane, between ? SPAWN_Y - gap * s.speed * 0.5 : SPAWN_Y);
    }
    s.prevFree = free;
    s.lastGap = rowGap;
    s.nextSpawn += rowGap * s.speed;
  }
  // Advance the world by dt seconds. opts.noSpawn is used by planners that look ahead.
  function step(s, P, rnd, dt, opts) {
    if (s.over) return s;
    s.t += dt;
    s.p = clamp(s.t / P.seconds, 0, 1);
    s.speed = lerp(P.speedStart, P.speedEnd, s.p);
    s.carX += (s.lane - s.carX) * (1 - Math.exp(-P.laneRate * dt));
    s.invuln = Math.max(0, s.invuln - dt);
    const dy = s.speed * dt;
    s.dist += dy;
    for (const o of s.objs) {
      o.y += o.kind === 'truck' ? dy * P.truckRel : dy;
      if (o.kind === 'deer') {
        if (o.state === 'wait' && (CAR_Y - o.y) / s.speed <= P.deerLead) o.state = 'walk';
        if (o.state === 'walk') {
          o.x += -o.side * P.deerWalk * dt;
          if ((o.side < 0 && o.x >= o.lane) || (o.side > 0 && o.x <= o.lane)) { o.x = o.lane; o.state = 'stand'; }
        }
      }
    }
    if (!(opts && opts.noSpawn) && s.t < P.seconds - P.clearTail) while (s.dist >= s.nextSpawn) spawnRow(s, P, rnd);
    // collisions
    for (const o of s.objs) {
      if (o.done) continue;
      if (Math.abs(o.y - CAR_Y) >= ((o.len + CAR_LEN) / 2) * HIT_K) continue;
      if (Math.abs(o.x - s.carX) >= ((o.w + CAR_W) / 2) * HIT_K) continue;
      if (o.value) {
        o.done = true; s.score += o.value;
        if (o.kind === 'coke') s.cokes++; else s.meds++;
        s.events.push({ type: 'snack', o });
      } else if (s.invuln <= 0) {
        o.done = true; s.lives--; s.hits++; s.invuln = P.invuln;
        s.events.push({ type: 'hit', o });
        if (s.lives <= 0) { s.over = true; s.won = false; s.events.push({ type: 'crash' }); return s; }
      }
    }
    s.objs = s.objs.filter((o) => o.y - o.len / 2 < 1.15 && !(o.done && o.value));
    if (s.t >= P.seconds) { s.over = true; s.won = true; s.events.push({ type: 'arrive' }); }
    return s;
  }
  function move(s, dir) { if (!s.over) s.lane = clamp(s.lane + dir, 0, 2); }
  const sim = { newState, step, move, spawnRow, KINDS, CAR_Y, CAR_LEN, CAR_W, SPAWN_Y, HIT_K };

  /* ------------------------------------------------------------------ route facts (I-64 West mile markers count down) */
  const MILE_START = 191, MILES = 71;
  const EXITS = [
    { mile: 178, name: 'Short Pump' },
    { mile: 159, name: 'Gum Spring' },
    { mile: 136, name: 'Zion Crossroads' },
    { mile: 120, name: 'Charlottesville', at: 0.955 },
  ];

  function rgb(c) {
    c = String(c || '').trim();
    if (c[0] === '#') {
      if (c.length === 4) c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
      return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    }
    const m = c.match(/[\d.]+/g);

          g.fillStyle = '#b3362b'; g.fillRect(edge + 17, y + dh / 2 - 3, 2, 6);

        const panMax = () => laneW * 1.3;
        function drawCar() {
          const x = laneX(s.carX) + (ending && ending.carDX ? ending.carDX * laneW : 0), y = CAR_Y * H;
          const w = CAR_W * laneW, h = CAR_LEN * H;
          const blink = s.invuln > 0 && !s.over && Math.floor(s.invuln * 12) % 2 === 0;
          g.save(); g.translate(x, y);
          g.rotate((ending ? ending.rot : 0) + clamp((s.lane - s.carX) * 0.35, -0.3, 0.3));
          // headlight cone
          g.save(); g.globalCompositeOperation = 'lighter';

          /* ---------------------------------------------------------- render */
          const bg = document.createElement('canvas');

          function drawItem(g, it) {

            g.strokeStyle = K.line; g.lineWidth = 1.4;
            g.fillStyle = 'rgba(0,0,0,.16)'; g.beginPath(); g.ellipse(x + w / 2, wd.y, w * 0.6, 4, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = K.woodDk; g.fillRect(x + 4, wd.y - 6, 6, 6); g.fillRect(x + w - 10, wd.y - 6, 6, 6);
            g.fillStyle = K.wood; g.beginPath(); rr(g, x, y + 8, w, hh - 14, 2); g.fill(); g.stroke();
            g.fillStyle = K.woodDk; g.beginPath(); rr(g, x - 4, y, w + 8, 10, 2); g.fill(); g.stroke();
            g.beginPath(); g.moveTo(x + w / 2, y + 12); g.lineTo(x + w / 2, wd.y - 10); g.stroke();
            g.strokeStyle = mix(K.wood, K.line, 0.45); g.lineWidth = 1.1;
            g.beginPath(); rr(g, x + 5, y + 16, w / 2 - 9, hh - 34, 3); g.stroke();
            g.fillStyle = K.glass; g.strokeStyle = K.line; g.beginPath(); ell(g, x + w * 0.75, y + hh * 0.38, w * 0.15, hh * 0.18); g.fill(); g.stroke();
            g.fillStyle = K.brass; [x + w / 2 - 5, x + w / 2 + 5].forEach((kx) => { g.beginPath(); ell(g, kx, y + hh * 0.55, 2.4, 2.4); g.fill(); g.stroke(); });
            g.restore();
          }
          function drawMicah(g, m) {
            const { cx, cy, r, side } = m;
            g.save();
            g.strokeStyle = K.line; g.lineWidth = 1.2;
            // shoulder
            g.fillStyle = cols.blue; g.beginPath(); g.ellipse(cx - side * r * 0.2, cy + r * 1.7, r * 1.1, r * 0.9, 0, Math.PI, 0); g.fill(); g.stroke();
            // head
            g.fillStyle = MICAH_LOOK.skin; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill(); g.stroke();
            g.beginPath(); g.arc(cx - side * r * 0.85, cy + r * 0.1, r * 0.28, 0, Math.PI * 2); g.fill(); g.stroke();
            // hair
            g.fillStyle = MICAH_LOOK.hair;
            g.beginPath(); g.moveTo(cx - r, cy - r * 0.05); g.quadraticCurveTo(cx - r * 1.05, cy - r * 1.15, cx, cy - r * 1.08);
            g.quadraticCurveTo(cx + r * 1.05, cy - r * 1.15, cx + r, cy - r * 0.05); g.quadraticCurveTo(cx + side * r * 0.4, cy - r * 0.6, cx - side * r * 0.2, cy - r * 0.45);
            g.quadraticCurveTo(cx - side * r * 0.6, cy - r * 0.3, cx - r, cy - r * 0.05); g.closePath(); g.fill(); g.stroke();
            // face: glancing out from his hiding spot
            g.fillStyle = K.line;
            [-0.1, 0.38].forEach((dx) => { g.beginPath(); g.arc(cx + side * r * dx + side * r * 0.12, cy + r * 0.12, r * 0.12, 0, Math.PI * 2); g.fill(); });
            g.lineWidth = 1; g.beginPath(); g.arc(cx + side * r * 0.2, cy + r * 0.38, r * 0.25, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
            g.fillStyle = 'rgba(224,98,79,.35)'; g.beginPath(); g.arc(cx + side * r * 0.62, cy + r * 0.35, r * 0.16, 0, Math.PI * 2); g.fill();
            g.restore();
          }
          function drawHand(g, m) {
            const { r, side } = m;
            const hx = m.edge + side * r * 0.15, hy = m.cy + r * 1.35;
            g.save();
            g.fillStyle = MICAH_LOOK.skin; g.strokeStyle = K.line; g.lineWidth = 1;
            g.beginPath(); g.ellipse(hx, hy, r * 0.42, r * 0.55, 0, 0, Math.PI * 2); g.fill(); g.stroke();
            g.strokeStyle = MICAH_LOOK.skinDark; g.beginPath();
            for (let i = -1; i <= 1; i++) { g.moveTo(hx - side * r * 0.4, hy + i * r * 0.22); g.lineTo(hx + side * r * 0.05, hy + i * r * 0.22); }
            g.stroke();
            g.restore();
          }

          /* animation state */
          const circles = [];   // {x, y, rx, ry, t0}
          const floats = [];    // {x, y, text, t0}
          let dim = 0, dimTarget = 0;
          function frame(now) {
            const g = cv.g;
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.clearRect(0, 0, cv.canvas.width, cv.canvas.height);
            g.drawImage(bg, 0, 0);
            g.setTransform(cv.dpr * view.k, 0, 0, cv.dpr * view.k, cv.dpr * view.ox, cv.dpr * view.oy);
            let anim = false;
            circles.forEach((c) => {
              const p = rm ? 1 : Math.min(1, (now - c.t0) / 380);
              if (p < 1) anim = true;
              g.save(); g.strokeStyle = P.route; g.lineWidth = 3.2; g.lineCap = 'round'; g.globalAlpha = 0.92;
              g.beginPath();
              const steps = 40, turns = 1.18 * p;
              for (let i = 0; i <= steps; i++) {
                const a = -2.2 + turns * Math.PI * 2 * (i / steps);
                const wob = 1 + Math.sin(a * 3 + c.seed) * 0.05 + (i / steps) * 0.08;
                const x = c.x + Math.cos(a) * c.rx * wob, y = c.y + Math.sin(a) * c.ry * wob;
                if (i) g.lineTo(x, y); else g.moveTo(x, y);
              }
              g.stroke(); g.restore();
            });
            for (let i = floats.length - 1; i >= 0; i--) {
              const f = floats[i]; const p = (now - f.t0) / 900;
              if (p >= 1) { floats.splice(i, 1); continue; }
              anim = true;
              g.save(); g.globalAlpha = 1 - p; g.fillStyle = P.route; g.font = util.font('sign', 18, 900); g.textAlign = 'center';
              g.strokeStyle = dk ? P.paper : P.card; g.lineWidth = 4; g.strokeText(f.text, f.x, f.y - p * 22); g.fillText(f.text, f.x, f.y - p * 22); g.restore();
            }
            if (dim !== dimTarget) { dim = Math.min(dimTarget, dim + 0.02); anim = true; }
            if (dim > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(8,6,16,${dim})`; g.fillRect(0, 0, cv.canvas.width, cv.canvas.height); }
            return anim;
          }

          /* ---------------------------------------------------------- input */
          function hitAt(px, py) {
            const x = (px - view.ox) / view.k, y = (py - view.oy) / view.k;
            const m = scene.micah.hit;
            let best = null, bd = Infinity;
            const consider = (box, obj, cx, cy) => {
              if (x < box.x || x > box.x + box.w || y < box.y || y > box.y + box.h) return;
              const d = (x - cx) ** 2 + (y - cy) ** 2;
              if (d < bd) { bd = d; best = obj; }
            };
            consider(m, 'micah', m.x + m.w / 2, m.y + m.h / 2);
            scene.items.forEach((it) => consider(it.hit, it, it.cx, it.cy));
            return { best, x, y };
          }
          on(cv.canvas, 'pointerdown', (e) => {
            if (over) return;
            e.preventDefault();
            const p = cv.toLocal(e);
            const { best, x, y } = hitAt(p.x, p.y);
            if (!best) return;
            if (best === 'micah') {
              const t = list.find((q) => q.micah);
              if (!found.has(t.i)) { const mh = scene.micah; markFound(t, mh.cx + mh.side * mh.r * 0.2, mh.cy + mh.r * 0.4, mh.r * 1.9, mh.r * 1.9); }
              return;
            }
            const t = best.target ? list.find((q) => q.item === best) : null;
            if (t) { if (!found.has(t.i)) markFound(t, best.cx, best.cy, Math.max(best.w, 30) / 2 + 7, Math.max(best.h, 26) / 2 + 7); return; }
            wrong(x, y);
          });

          function markFound(t, x, y, rx, ry) {
            found.add(t.i);
            circles.push({ x, y, rx, ry, t0: performance.now(), seed: rnd() * 6 });
            t.li.classList.add('done');
            sound.play('good');
            hud.set('f', found.size + '/' + goal);
            if (found.size >= goal) win();
          }
          function wrong(x, y) {
            left -= penalty;
            sound.play('bad');
            floats.push({ x, y: y - 8, text: penalty ? '-' + penalty + 's' : 'Nope', t0: performance.now() });
            if (!rm) { cv.canvas.classList.remove('is-shake'); void cv.canvas.offsetWidth; cv.canvas.classList.add('is-shake'); }
          }

          /* ---------------------------------------------------------- clock + loop */
          let left = total, shown = -1, settledLater = false;
          util.banner(stage, 'Find them!', 900);
          util.loop((dt, now) => {
            if (!over) {
              left -= dt;
              const s = Math.max(0, Math.ceil(left));
              if (s !== shown) {
                shown = s; hud.set('t', fmt(s));
                if (s <= 10 && s > 0) { sound.play('tick'); hudVal.style.color = 'var(--route)'; }
              }
              if (left <= 0) lose();
            }
            const anim = frame(now);
            if (over && !anim && settledLater) return false;
            return true;
          }, signal);

          function win() {
            over = true;
            sound.play('coin');
            util.banner(stage, 'Found it all!', 1100);
            later(1300, () => { settledLater = true; finish('win'); });
          }
          function lose() {
            over = true;
            hud.set('t', '0:00');
            dimTarget = rm ? 0.55 : 0.62;
            if (rm) dim = dimTarget;
            sound.play('thud');
            sound.tone(196, 0.5, { type: 'sine', vol: 0.08, slide: 98, when: 0.15 });
            tag.classList.add('is-closed');
            later(1500, () => { settledLater = true; finish('lose'); });
          }

          if (ctx.debug) {
            const toClient = (x, y) => {
              const r = cv.canvas.getBoundingClientRect();
              return { x: r.left + (view.ox + x * view.k) * (r.width / cv.w), y: r.top + (view.oy + y * view.k) * (r.height / cv.h) };
            };
            SCQ.test.ispy = {
              seed,
              state: () => ({ left, found: found.size, goal, over, items: scene.items.length, micahMode: scene.micah.mode }),
              targets: () => list.map((t) => {
                if (t.micah) { const m = scene.micah; return Object.assign({ name: 'micah', found: found.has(t.i), hit: [m.hit.w, m.hit.h] }, toClient(m.hit.x + m.hit.w / 2, m.hit.y + m.hit.h / 2)); }
                return Object.assign({ name: (t.color ? t.color + ' ' : '') + t.type, found: found.has(t.i), hit: [t.item.hit.w, t.item.hit.h] }, toClient(t.item.cx, t.item.cy));
              }),
              decoy: () => { const it = scene.items.find((x) => !x.target); return it ? toClient(it.cx, it.cy) : null; },
              overlaps: () => {
                const boxes = scene.items.map((it) => it.hit).concat([scene.micah.hit]);
                let n = 0;
                for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
                  const a = boxes[i], b = boxes[j];
                  if (a.x < b.x + b.w - 0.5 && b.x < a.x + a.w - 0.5 && a.y < b.y + b.h - 0.5 && b.y < a.y + a.h - 0.5) n++;
                }
                return n;
              },
              minHit: () => Math.min(...scene.items.map((it) => Math.min(it.hit.w, it.hit.h)).map((v) => v * view.k)),
              setLeft: (s) => { left = s; },
            };
          }

        }

        function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
        function css() {
          return `
.is-canvas{position:absolute;left:0;top:0}
.is-shake{animation:isShake .3s ease}
@keyframes isShake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.is-tag{position:absolute;left:10px;right:10px;bottom:8px;z-index:2;background:var(--card);border:2px solid var(--ink);border-radius:4px 14px 14px 4px;box-shadow:4px 4px 0 var(--ink);padding:6px 12px 8px 30px;transform:rotate(-.6deg);color:var(--ink);pointer-events:none}
.is-head{display:flex;align-items:center;gap:8px;margin-left:-20px}
.is-hole{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);flex:none}
.is-head b{font:900 .66rem var(--f-sign);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.is-list{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;column-gap:16px;row-gap:0}
.is-list li{font:700 1.14rem/1.18 var(--f-hand);white-space:nowrap;position:relative;padding:1px 0}
.is-list li small{font-size:.85em;font-weight:600;color:var(--ink-soft)}
.is-q{font:900 .74em var(--f-sign);letter-spacing:.04em;border-bottom:3px solid var(--q)}
.is-list li.done{color:var(--ink-soft)}
.is-list li.done::after{content:'';position:absolute;left:-2px;right:8%;top:52%;height:3px;border-radius:2px;background:var(--route);transform:rotate(-1.5deg);transform-origin:left;animation:isStrike .35s ease both}
@keyframes isStrike{from{transform:rotate(-1.5deg) scaleX(0)}to{transform:rotate(-1.5deg) scaleX(1)}}
.is-tag.is-closed{opacity:.75;transition:opacity 1s}
`;
        }
      });
    },
  });
})();

</script>
<script>/* games/jailbreak.js */
/* Stella's Cozy Quest - minigame: Jailbreak Rematch (the Williamsburg western-jail escape room). */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ---------- color helpers (palette values are hex strings from the CSS tokens) */
  function rgbOf(c) {
    c = String(c || '').trim();
    let m = c.match(/^#([0-9a-f]{3})$/i);
    if (m) return m[1].split('').map((x) => parseInt(x + x, 16));
    m = c.match(/^#([0-9a-f]{6})/i);
    if (m) return [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16));
    m = c.match(/rgba?\(([^)]+)\)/i);
    if (m) return m[1].split(/[ ,/]+/).slice(0, 3).map((x) => parseFloat(x) || 0);
    return [128, 128, 128];
  }
  function mix(a, b, t) {
    const x = rgbOf(a), y = rgbOf(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  function colors(P) {
    const dk = !!P.dark;
    const c = {
      ink: P.ink, soft: P.inkSoft, card: P.card, paper: P.paper, route: P.route, shield: P.shield, gold: P.gold, park: P.park, water: P.water,
      line: dk ? '#0b0b11' : P.ink,
      wall: dk ? mix(P.paper, P.gold, 0.27) : mix(P.paper, P.gold, 0.24),
      brick: dk ? mix(P.paper, P.route, 0.42) : mix(mix(P.route, P.gold, 0.25), P.paper, 0.36),
      floor: dk ? mix(P.paper, P.gold, 0.36) : mix(P.gold, P.ink, 0.38),
      beam: dk ? mix(P.paper, P.gold, 0.2) : mix(P.gold, P.ink, 0.6),
      office: dk ? mix(P.paper, P.shield, 0.2) : mix(mix(P.paper2, P.ink, 0.36), P.shield, 0.1),
      officeFloor: dk ? mix(P.paper, P.gold, 0.2) : mix(P.gold, P.ink, 0.6),
      iron: dk ? '#101017' : mix(P.ink, P.shield, 0.18),
      ironHi: dk ? '#5d5a66' : mix(P.ink, P.paper, 0.45),
      sky: dk ? '#0c1530' : mix(P.shield, P.ink, 0.3),
      poster: dk ? mix(P.card, P.gold, 0.1) : mix(P.card, P.gold, 0.16),
      blanket: dk ? mix(P.paper, P.shield, 0.5) : mix(P.shield, P.paper, 0.3),
      mattress: dk ? mix(P.paper, P.ink, 0.3) : P.card,
      hound: dk ? mix(P.paper, P.gold, 0.62) : mix(P.gold, P.paper, 0.38),
      ear: dk ? mix(P.paper, P.gold, 0.34) : mix(P.gold, P.ink, 0.5),
      brass: P.gold,
      glass: dk ? mix(P.paper, P.water, 0.6) : mix(P.water, P.card, 0.45),
      straw: dk ? mix(P.paper, P.gold, 0.55) : mix(P.gold, P.card, 0.25),
      rug: dk ? mix(P.paper, P.route, 0.45) : mix(P.route, P.paper, 0.35),
      dark: dk ? '#030309' : '#16142a',
      shade: dk ? '#020206' : '#0e0d1a',
      darkAlpha: dk ? 0.5 : 0.44,
      dk,
    };
    c.wallDeep = mix(c.wall, c.line, 0.22);
    c.scratch = mix(c.wall, c.line, dk ? 0.7 : 0.62);
    c.mortar = mix(c.wall, c.line, 0.12);
    c.woodDark = mix(c.floor, c.line, 0.35);
    c.wood = dk ? mix(P.paper, P.gold, 0.45) : mix(P.gold, P.ink, 0.28);
    c.floorLine = mix(c.floor, c.line, 0.35);
    return c;
  }

  const CODE_FALLBACK = '0711';

  SCQ.registerGame('jailbreak', {
    title: 'Jailbreak Rematch',
    howTo: [
      'Tap anything in the cell to search it.',
      'To use something you found, tap it in your pockets, then tap where it goes.',
      'The clues add up to the 4-digit padlock code.',
    ],
    defaults: {
      seconds: 120,        // "Sheriff back in 2:00": a first look around the cell takes longer than this
      wrongPenalty: 20,    // seconds lost per wrong code
      warnAt: 30,          // timer turns red, spurs jingle
      glow: false,         // clue hotspots softly glow
      eased: { seconds: 240, wrongPenalty: 10, glow: true },
    },

    start(stage, ctx) {
      const { util, sound, signal } = ctx;
      const params = ctx.params || {};
      const h = util.h;
      const F = util.font;
      const P = ctx.palette;
      const C = colors(P);
      const rm = !!ctx.reducedMotion;
      const jb = (ctx.content && ctx.content.jailbreak) || {};
      const CODE = String(jb.code || CODE_FALLBACK);
      const MONTH = String(jb.hintMonth || 'JULY').toUpperCase();
      const TALLY = Math.max(1, Math.min(30, +jb.tally || 11));
      const U = 'jb' + Math.random().toString(36).slice(2, 8);
      const total = Math.max(20, +params.seconds || 120);
      const penalty = Math.max(0, +params.wrongPenalty || 0);
      const warnAt = +params.warnAt || 30;

      return new Promise((resolve, reject) => {
        let settled = false, over = false;
        const timers = new Set();
        const on = (el, type, fn) => el.addEventListener(type, fn, { signal });
        const later = (ms, fn) => {
          const t = setTimeout(() => { timers.delete(t); if (!signal.aborted) fn(); }, ms);
          timers.add(t);
        };
        function finish(r) {
          if (settled) return;
          root.classList.add('jb-still');
          settled = true;
          resolve(r);
        }

        const st = {
          inv: [], held: null, lit: false, houndAwake: false, matches: false, treat: false,
          bucketTries: 0, seen: {}, left: total, entry: '', checking: false, codesTried: 0,
        };

        /* ---------------------------------------------------------- DOM skeleton */
        const style = h('style', {}, css());
        const sceneBox = h('div', { class: 'jb-scene' });
        const msg = h('div', { class: 'jb-msg', role: 'status', 'aria-live': 'polite' });
        const pockets = h('div', { class: 'jb-pockets' });
        const tray = h('div', { class: 'jb-tray' }, msg, h('div', { class: 'jb-prow' }, h('span', { class: 'jb-plabel' }, 'Pockets'), pockets));
        const root = h('div', { class: 'jb-root' + (rm ? ' jb-rm' : '') }, sceneBox, tray);
        stage.append(style, root);
        signal.addEventListener('abort', () => {
          timers.forEach(clearTimeout); timers.clear();
          root.classList.add('jb-still');
          if (!settled) { settled = true; reject(new DOMException('aborted', 'AbortError')); }
        }, { once: true });
        const hud = util.hud(stage, [{ key: 't', label: 'Sheriff back in', value: fmt(total) }]);
        const hudVal = hud.el.querySelector('b');

        sceneBox.innerHTML = sceneSVG();
        const svg = sceneBox.querySelector('svg');
        const $ = (id) => svg.querySelector('#' + U + '-' + id);

        function fitView() {
          const cw = sceneBox.clientWidth || 360, ch = sceneBox.clientHeight || 600;
          const asp = cw / ch;
          let vw = 360, vh = 600;
          if (asp > 0.6) vw = Math.min(1100, 600 * asp); else vh = Math.min(1000, 360 / asp);
          svg.setAttribute('viewBox', `${(360 - vw) / 2} 0 ${vw} ${vh}`);
        }
        fitView();
        if (window.ResizeObserver) {
          const ro = new ResizeObserver(fitView);
          ro.observe(sceneBox);
          signal.addEventListener('abort', () => ro.disconnect(), { once: true });
        }

        /* ---------------------------------------------------------- hotspots */
        const HOT = [
          { id: 'window', label: 'High window', x: 86, y: 24, w: 84, h: 76 },
          { id: 'poster', label: 'Wanted poster', x: 8, y: 102, w: 100, h: 140 },
          { id: 'tally', label: 'Scratches on the wall', x: 108, y: 102, w: 78, h: 60 },
          { id: 'heart', label: 'Carving on the wall', x: 108, y: 166, w: 78, h: 68 },
          { id: 'brick', label: 'Loose brick', x: 14, y: 256, w: 90, h: 66 },
          { id: 'calendar', label: 'Something on the far wall', x: 214, y: 108, w: 60, h: 88 },
          { id: 'doorway', label: 'Office doorway', x: 278, y: 108, w: 74, h: 196 },
          { id: 'padlock', label: 'Padlock', x: 184, y: 198, w: 64, h: 76 },
          { id: 'hound', label: 'Sleeping hound', x: 214, y: 330, w: 130, h: 66 },
          { id: 'pillow', label: 'Pillow', x: 2, y: 396, w: 60, h: 56 },
          { id: 'cot', label: 'Cot', x: 62, y: 400, w: 84, h: 108 },
          { id: 'lantern', label: 'Lantern', x: 146, y: 352, w: 66, h: 122 },
          { id: 'bucket', label: 'Bucket', x: 234, y: 448, w: 88, h: 100 },
          { id: 'cup', label: 'Tin cup', x: 102, y: 524, w: 66, h: 58 },
        ];
        const CLUE = { cot: 1, lantern: 1, bucket: 1, hound: 1, calendar: 1, tally: 1, padlock: 1 };
        const NS = 'http://www.w3.org/2000/svg';
        const glowG = $('glows'), hotG = $('hots');
        const hotEls = {}, glowEls = {};
        HOT.forEach((hs) => {
          if (params.glow && CLUE[hs.id]) {
            const gr = document.createElementNS(NS, 'rect');
            [['x', hs.x + 3], ['y', hs.y + 3], ['width', hs.w - 6], ['height', hs.h - 6], ['rx', 10], ['class', 'jb-glow']].forEach(([k, v]) => gr.setAttribute(k, v));
            glowG.append(gr);
            glowEls[hs.id] = gr;
          }

  </svg>`;
  const RATIO = 1.22; // card height / width

    title: 'Polaroid Match',
    intro: 'Two prints of every photo, face down on the table. Find all eight pairs.',
    howTo: ['Tap two polaroids to flip them.', 'A match stays face up. Fewer flips is better.'],
    winLine: 'Every memory, matched.',
    defaults: { mismatchMs: 900 },

    start(stage, ctx) {

              h('span', { class: 'pq-face pq-front' }, photo)),
            h('span', { class: 'pq-heart', html: HEART }));

          const options = [[3, 2, 3], [2, 2, 2, 2]].map((rows) => {
            const cols = Math.max.apply(null, rows);
            const gw = Math.min((ww - 16) / (cols * 1.05 + (rows.length === 4 ? 0.2 : 0.05)), wh / ((rows.length - 1) * tall * ROW + tall + 0.3), 190);
            return { rows, gw };
          });
          const pick = options[1].gw > options[0].gw * 1.12 ? options[1] : options[0];
          const { rows, gw } = pick;
          const gh = gw * tall;
          wall.style.setProperty('--pq-gw', gw.toFixed(1) + 'px');
          let k = 0;
          rows.forEach((n, r) => {
            for (let j = 0; j < n; j++) {
              const it = galleryItems[k++];
              if (!it) continue;
              const cx = ww / 2 + (j - (n - 1) / 2) * gw * 1.05 + (rows.length === 4 ? (r % 2 ? 1 : -1) * gw * 0.1 : 0) + it.jx;
              const cy = wh / 2 + gw * 0.06 + (r - (rows.length - 1) / 2) * gh * ROW + it.jy;
              it.el.style.left = (cx - gw / 2).toFixed(1) + 'px';
              it.el.style.top = (cy - gh / 2).toFixed(1) + 'px';
            }
          });
          fitCaps(wall);
        }

        async function finish() {
          done = true;
          const best = Store.state.polaroidBest;
          const isBest = best == null || flips < best;
          if (isBest) { Store.state.polaroidBest = flips; Store.save(); }
          hud.set('best', String(isBest ? flips : best));
          try { await util.wait(1100, signal); } catch (e) { return; }
          wrap.classList.add('pq-out');
          hud.el.style.display = 'none';
          const wall = h('div', { class: 'pq-g-wall' });
          galleryItems = pairs.map((p, i) => {
            const el = SCQ.photoEl(p.slot, p.caption, p.icon, { eager: true });
            el.style.setProperty('--r', ((i % 2 ? 1 : -1) * (2 + Math.random() * 4)).toFixed(1) + 'deg');
            el.style.setProperty('--d', (250 + i * 110) + 'ms');
            el.style.zIndex = String(i + 1);
            wall.append(el);
            return { el, jx: Math.random() * 8 - 4, jy: Math.random() * 6 - 3 };
          });
          gallery = h('div', { class: 'pq-gallery', role: 'status' },
            h('div', { class: 'pq-g-head' },
              h('div', { class: 'eyebrow' }, 'All ' + pairs.length + ' pairs'),
              h('h3', { class: 'pq-g-title' }, 'The Whole Roll'),
              h('div', { class: 'pq-g-score' }, flips + ' flips · ', isBest ? h('b', {}, best == null ? 'first record' : 'new best') : 'best ' + best)),
            wall,
            h('div', { class: 'pq-g-hint' }, 'Tap to keep going'));
          stage.append(gallery);
          placeGallery();
          sound.play('whoosh');
          let settled = false;
          const go = () => { if (settled) return; settled = true; resolve('win'); };
          gallery.addEventListener('click', go, { signal });
          util.wait(4200, signal).then(go).catch(() => {});
        }

        size();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!signal.aborted) fitCaps(gallery || grid); }).catch(() => {});
        if (ctx.debug) {
          SCQ.test.polaroid = {
            layout: deck.map((p) => p.slot),
            cards: () => cards.map((c) => c.el),
            flips: () => flips,
            pairs: () => found,
            locked: () => lock,
          };
        }
      });
    },
  });
})();

<script>/* games/pool.js */
/* 8-Ball - Taphouse, Richmond, where it started. Stella breaks, then plays the bot for the table.
   The table physics, the rules and the bot at the top of this file are pure (no DOM), so Node can
   load the file for tests and win-rate simulations: require('src/games/pool.js') returns that core. */
(function () {
  'use strict';
  const ROOT = typeof window !== 'undefined' ? window : globalThis;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const DEG = Math.PI / 180;

  /* ================================================================ table geometry */
  // Units: the playing surface (cushion nose to cushion nose) is 1 wide and 2 long. y grows toward
  // the player, so the rack sits at the top and the kitchen at the bottom, like the phone game.
  const W = 1, L = 2, R = 0.032;
  const CW = 0.95 * R;           // cushion depth, nose to wood
  const RAILW = 0.056;           // wood rail width (drawing only)
  const CM = 3.35 * R;           // corner mouth: the cushion noses stop this far from the corner
  const SM = 2.35 * R;           // side mouth half-width
  const CJ = 1.28 * CW;          // corner jaw run toward the pocket (142 degree facing)
  const SJ = 0.25 * CW;          // side jaw run (104 degree facing)
  const HEAD_Y = L * 0.75;       // head string: on the break the cue ball goes below it
  const FOOT = { x: W / 2, y: L / 4 };
  const HEAD = { x: W / 2, y: L * 0.78 };

  // Pockets: x, y, r = the hole (a ball whose center gets inside it drops); k1, k2 = the knuckles.
  const POCKETS = [
    { x: -0.4 * R, y: -0.4 * R, r: 2.0 * R, k1: [CM, 0], k2: [0, CM], name: 'top left' },
    { x: W + 0.4 * R, y: -0.4 * R, r: 2.0 * R, k1: [W - CM, 0], k2: [W, CM], name: 'top right' },
    { x: -1.85 * R, y: L / 2, r: 1.6 * R, k1: [0, L / 2 - SM], k2: [0, L / 2 + SM], name: 'left side' },
    { x: W + 1.85 * R, y: L / 2, r: 1.6 * R, k1: [W, L / 2 - SM], k2: [W, L / 2 + SM], name: 'right side' },
    { x: -0.4 * R, y: L + 0.4 * R, r: 2.0 * R, k1: [CM, L], k2: [0, L - CM], name: 'bottom left' },
    { x: W + 0.4 * R, y: L + 0.4 * R, r: 2.0 * R, k1: [W - CM, L], k2: [W, L - CM], name: 'bottom right' },
  ];
  // Cushions: nose a-b, with angled jaw faces a-ja and b-jb running into the pockets.
  const RAILS = [
    { a: [CM, 0], b: [W - CM, 0], ja: [CM - CJ, -CW], jb: [W - CM + CJ, -CW] },
    { a: [CM, L], b: [W - CM, L], ja: [CM - CJ, L + CW], jb: [W - CM + CJ, L + CW] },
    { a: [0, CM], b: [0, L / 2 - SM], ja: [-CW, CM - CJ], jb: [-CW, L / 2 - SM + SJ] },
    { a: [0, L / 2 + SM], b: [0, L - CM], ja: [-CW, L / 2 + SM - SJ], jb: [-CW, L - CM + CJ] },
    { a: [W, CM], b: [W, L / 2 - SM], ja: [W + CW, CM - CJ], jb: [W + CW, L / 2 - SM + SJ] },
    { a: [W, L / 2 + SM], b: [W, L - CM], ja: [W + CW, L / 2 + SM - SJ], jb: [W + CW, L - CM + CJ] },
  ];
  const SEGS = [];
  function addSeg(p, q) {
    const ex = q[0] - p[0], ey = q[1] - p[1], len = Math.hypot(ex, ey);
    let nx = -ey / len, ny = ex / len;
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    if ((W / 2 - mx) * nx + (L / 2 - my) * ny < 0) { nx = -nx; ny = -ny; }
    SEGS.push({ x1: p[0], y1: p[1], ex, ey, len2: len * len, nx, ny });
  }
  RAILS.forEach((r) => { addSeg(r.a, r.b); addSeg(r.a, r.ja); addSeg(r.b, r.jb); });

  /* ================================================================ balls */
  const groupOf = (n) => (n === 0 ? 'cue' : n === 8 ? 'eight' : n < 8 ? 'solids' : 'stripes');
  const otherGroup = (g) => (g === 'solids' ? 'stripes' : 'solids');
  const makeBall = (n, x, y) => ({ n, x, y, vx: 0, vy: 0, on: true, pocket: -1 });
  function shuffleWith(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  // Tight triangle on the foot spot: the 8 in the middle, a solid and a stripe in the back corners.
  function rack(rng) {
    const balls = [];
    for (let n = 0; n < 16; n++) balls.push(makeBall(n, 0, 0));
    balls[0].x = HEAD.x; balls[0].y = HEAD.y;
    const gap = 0.0006, slots = [];
    for (let row = 0; row < 5; row++) {
      for (let k = 0; k <= row; k++) slots.push({ x: FOOT.x + (k - row / 2) * (2 * R + gap), y: FOOT.y - row * Math.sqrt(3) * (R + gap / 2) });
    }
    const solids = shuffleWith([1, 2, 3, 4, 5, 6, 7], rng), stripes = shuffleWith([9, 10, 11, 12, 13, 14, 15], rng);
    const order = new Array(15);
    order[4] = 8;
    const solidLeft = rng() < 0.5;
    order[10] = solidLeft ? solids.pop() : stripes.pop();
    order[14] = solidLeft ? stripes.pop() : solids.pop();
    const rest = shuffleWith(solids.concat(stripes), rng);
    for (let i = 0; i < 15; i++) if (order[i] == null) order[i] = rest.pop();
    order.forEach((n, i) => { balls[n].x = slots[i].x + (rng() - 0.5) * 0.0003; balls[n].y = slots[i].y; });
    return balls;
  }

  /* ================================================================ physics */
  const PH = {
    tick: 1 / 240,    // fixed physics tick (s); each tick splits into substeps so no ball moves more than 0.2 R
    vmax: 8,          // cue speed at full power (table widths per second)
    decel: 0.9,       // rolling resistance (widths / s^2)
    drag: 0.5,        // speed-proportional drag (1 / s), so hard shots settle quickly
    eBall: 0.93,      // ball-ball restitution
    eRail: 0.8,       // cushion restitution for a gentle hit...
    railLoss: 0.02,   // ...minus this much per unit of impact speed
    railGrip: 0.9,    // share of the along-the-rail speed a cushion keeps
    slip: 5,          // how fast a sliding cue ball settles into natural roll (widths / s^2)
    grab: 4.5,        // how fast follow or draw bends the cue ball after contact (widths / s^2)
    english: 0.3,     // side-spin kick off a cushion
    maxT: 12,         // no shot simulates longer than this (s)
  };
  const speedOfPower = (p) => PH.vmax * Math.pow(clamp(p, 0, 1), 1.5);
  const powerOfSpeed = (v) => Math.pow(clamp(v / PH.vmax, 0, 1), 2 / 3);

  // A shot in progress. spin: {x: side (-1 left .. 1 right), y: -1 draw .. 1 follow}.
  function newShot(balls, angle, speed, spin) {
    const cue = balls[0];
    const sp = clamp(speed, 0, PH.vmax);
    const dx = Math.cos(angle), dy = Math.sin(angle);
    cue.vx = dx * sp; cue.vy = dy * sp;
    for (const b of balls) if (!b.on) { b.vx = 0; b.vy = 0; }
    const sy = spin ? clamp(+spin.y || 0, -1, 1) : 0, sx = spin ? clamp(+spin.x || 0, -1, 1) : 0;
    return {
      balls, t: 0, done: false, timeout: false,
      first: -1, pocketed: [], scratch: false, rails: 0, railAfter: false,
      roll: sy * 1.35 * sp,   // cue-ball spin, as the rolling speed it is worth along its line (natural roll = speed)
      side: sx * sp,          // side spin (english)
      px: 0, py: 0,           // follow / draw still to be applied after the first contact
      events: [], quiet: false,
    };
  }
  function sink(S, b, k) {
    if (!S.quiet) S.events.push({ t: 'pocket', n: b.n, p: k, x: b.x, y: b.y, vx: b.vx, vy: b.vy });
    b.on = false; b.pocket = k; b.vx = 0; b.vy = 0;
    S.pocketed.push({ n: b.n, p: k });
    if (b.n === 0) { S.scratch = true; S.px = 0; S.py = 0; }
  }
  function firstContact(S, cue, n, vx0, vy0) {
    S.first = n;
    const sp0 = Math.hypot(vx0, vy0) || 1e-9;
    // momentum + spin about the cloth contact: the cue ball ends up rolling along 5/7 of its new
    // velocity plus 2/7 of its spin, which still points along the old line (follow or draw)
    const fx = (5 / 7) * cue.vx + (2 / 7) * S.roll * (vx0 / sp0);
    const fy = (5 / 7) * cue.vy + (2 / 7) * S.roll * (vy0 / sp0);
    S.px = fx - cue.vx; S.py = fy - cue.vy;
  }
  function railHit(S, b, sg) {
    let t = ((b.x - sg.x1) * sg.ex + (b.y - sg.y1) * sg.ey) / sg.len2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const qx = sg.x1 + sg.ex * t, qy = sg.y1 + sg.ey * t;
    const dx = b.x - qx, dy = b.y - qy, d2 = dx * dx + dy * dy;
    if (d2 >= R * R) return;
    const d = Math.sqrt(d2);
    let nx, ny;
    if (d > 1e-9) { nx = dx / d; ny = dy / d; } else { nx = sg.nx; ny = sg.ny; }
    b.x = qx + nx * R; b.y = qy + ny * R;
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const e = Math.max(0.5, PH.eRail - PH.railLoss * -vn);
    const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
    const nvn = -vn * e;
    let nvt = vt * PH.railGrip;
    if (b.n === 0 && S.side) {
      // english: right spin walks the ball right off the cushion
      const lim = 0.75 * -vn + 0.2;
      nvt += clamp(-PH.english * S.side, -lim, lim);
      S.side *= 0.45;
    }
    b.vx = nx * nvn + tx * nvt; b.vy = ny * nvn + ty * nvt;
    if (b.n === 0 && S.first < 0) S.roll = Math.hypot(b.vx, b.vy);
    S.rails++;
    if (S.first >= 0) S.railAfter = true;
    if (!S.quiet) S.events.push({ t: 'rail', v: -vn, n: b.n });
  }
  function substep(S, h) {
    const B = S.balls, nb = B.length, D = 2 * R, D2 = D * D;
    for (let i = 0; i < nb; i++) { const b = B[i]; if (b.on && (b.vx || b.vy)) { b.x += b.vx * h; b.y += b.vy * h; } }
    const cue = B[0];
    if (S.px || S.py) {
      const m = Math.hypot(S.px, S.py), k = Math.min(m, PH.grab * h) / m;
      cue.vx += S.px * k; cue.vy += S.py * k; S.px -= S.px * k; S.py -= S.py * k;
      if (m * (1 - k) < 1e-5) { S.px = 0; S.py = 0; }
    } else if (S.first < 0 && cue.on) {
      const sp = Math.hypot(cue.vx, cue.vy), d = sp - S.roll, st = PH.slip * h;
      S.roll += d > st ? st : d < -st ? -st : d;
    }
    if (S.side) S.side *= Math.exp(-0.8 * h);
    // ball against ball: rewind each new contact to the moment of touch, so cut angles come out exact
    for (let i = 0; i < nb; i++) {
      const a = B[i];
      if (!a.on) continue;
      for (let j = i + 1; j < nb; j++) {
        const c = B[j];
        if (!c.on) continue;
        let dx = c.x - a.x, dy = c.y - a.y;
        if (dx > D || dx < -D || dy > D || dy < -D) continue;
        let d2 = dx * dx + dy * dy;
        if (d2 >= D2) continue;
        const rvx = c.vx - a.vx, rvy = c.vy - a.vy, pv = dx * rvx + dy * rvy;
        if (pv < 0) {
          const vv = rvx * rvx + rvy * rvy;
          let s = (pv + Math.sqrt(Math.max(0, pv * pv - vv * (d2 - D2)))) / vv;
          if (!(s > 0)) s = 0; else if (s > h) s = h;
          a.x -= a.vx * s; a.y -= a.vy * s; c.x -= c.vx * s; c.y -= c.vy * s;
          dx = c.x - a.x; dy = c.y - a.y;
          const d = Math.hypot(dx, dy) || 1e-9, nx = dx / d, ny = dy / d;
          const u = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
          if (u > 0) {
            const J = ((1 + PH.eBall) / 2) * u;
            const ax0 = a.vx, ay0 = a.vy;
            a.vx -= J * nx; a.vy -= J * ny; c.vx += J * nx; c.vy += J * ny;
            if (i === 0 && S.first < 0) firstContact(S, a, c.n, ax0, ay0);
            if (!S.quiet) S.events.push({ t: 'hit', v: u });
          }
          a.x += a.vx * s; a.y += a.vy * s; c.x += c.vx * s; c.y += c.vy * s;
          dx = c.x - a.x; dy = c.y - a.y; d2 = dx * dx + dy * dy;
        }
        if (d2 < D2) {
          const d = Math.sqrt(d2);
          let nx = 1, ny = 0;
          if (d > 1e-9) { nx = dx / d; ny = dy / d; }
          const push = (D - d) / 2 + 1e-7;
          a.x -= nx * push; a.y -= ny * push; c.x += nx * push; c.y += ny * push;
        }
      }
    }
    // cushions, pockets, cloth
    for (let i = 0; i < nb; i++) {
      const b = B[i];
      if (!b.on) continue;
      if (b.x < R * 1.6 || b.x > W - R * 1.6 || b.y < R * 1.6 || b.y > L - R * 1.6) {
        for (let k = 0; k < SEGS.length; k++) railHit(S, b, SEGS[k]);
        for (let k = 0; k < POCKETS.length; k++) {
          const p = POCKETS[k], dx = b.x - p.x, dy = b.y - p.y;
          if (dx * dx + dy * dy < p.r * p.r) { sink(S, b, k); break; }
        }
        if (b.on && (b.x < 0 || b.x > W || b.y < 0 || b.y > L)) {
          // past a cushion nose: only possible inside a pocket mouth. Anything else is a bug: put it back.
          let best = -1, bd = Infinity;
          for (let k = 0; k < POCKETS.length; k++) { const dd = Math.hypot(b.x - POCKETS[k].x, b.y - POCKETS[k].y); if (dd < bd) { bd = dd; best = k; } }
          if (bd > 4.5 * R) {
            b.x = clamp(b.x, R, W - R); b.y = clamp(b.y, R, L - R); b.vx *= -0.5; b.vy *= -0.5;
          } else if (b.x < -1.5 * R || b.x > W + 1.5 * R || b.y < -1.5 * R || b.y > L + 1.5 * R) sink(S, b, best);
        }
      }
      if (b.on && (b.vx || b.vy)) {
        const sp = Math.hypot(b.vx, b.vy), ns = sp - (PH.decel + PH.drag * sp) * h;
        if (ns <= 0.003) { b.vx = 0; b.vy = 0; } else { const f = ns / sp; b.vx *= f; b.vy *= f; }
      }
    }
  }
  function tick(S) {
    if (S.done) return;
    const B = S.balls;
    let vmax = Math.hypot(S.px, S.py);
    for (const b of B) if (b.on && (b.vx || b.vy)) { const s = Math.hypot(b.vx, b.vy); if (s > vmax) vmax = s; }
    const n = Math.max(1, Math.min(64, Math.ceil((vmax * PH.tick) / (0.2 * R))));
    const h = PH.tick / n;
    for (let k = 0; k < n; k++) substep(S, h);
    S.t += PH.tick;
    for (const b of B) {
      if (b.on && !(Number.isFinite(b.x) && Number.isFinite(b.y) && Number.isFinite(b.vx) && Number.isFinite(b.vy))) {
        b.vx = 0; b.vy = 0;
        if (!(Number.isFinite(b.x) && Number.isFinite(b.y))) { const s = freeSpot(B, FOOT.x, FOOT.y, false, b.n); b.x = s.x; b.y = s.y; }
      }
    }
    if (!Number.isFinite(S.px) || !Number.isFinite(S.py)) { S.px = 0; S.py = 0; }
    let moving = !!(S.px || S.py);
    if (!moving) for (const b of B) if (b.on && (b.vx || b.vy)) { moving = true; break; }
    if (!moving) S.done = true;
    else if (S.t >= PH.maxT) {
      for (const b of B) { b.vx = 0; b.vy = 0; }
      S.px = 0; S.py = 0; S.done = true; S.timeout = true;
    }
  }
  function runShot(S, maxT) {
    const cap = maxT == null ? PH.maxT : maxT;
    while (!S.done && S.t < cap) tick(S);
    return S;
  }

  /* ================================================================ geometry helpers */
  // First thing the cue ball meets going from (x, y) along ang: a ball (with the ghost-ball spot) or a cushion.
  function castFrom(balls, x, y, ang) {
    const dx = Math.cos(ang), dy = Math.sin(ang), D2 = 4 * R * R;
    let tb = Infinity, hit = null;
    for (let i = 1; i < balls.length; i++) {
      const b = balls[i];
      if (!b.on) continue;
      const ox = b.x - x, oy = b.y - y, al = ox * dx + oy * dy;
      if (al <= -2 * R) continue;
      const pp = ox * ox + oy * oy - al * al;
      if (pp >= D2) continue;
      const t = al - Math.sqrt(D2 - pp);
      if (t < tb && t > -R) { tb = t; hit = b; }
    }
    let tw = Infinity;
    if (dx > 1e-9) tw = Math.min(tw, (W - R - x) / dx); else if (dx < -1e-9) tw = Math.min(tw, (R - x) / dx);
    if (dy > 1e-9) tw = Math.min(tw, (L - R - y) / dy); else if (dy < -1e-9) tw = Math.min(tw, (R - y) / dy);
    tw = Math.max(0, tw);
    if (hit && tb <= tw) {
      const t = Math.max(0, tb), gx = x + dx * t, gy = y + dy * t;
      let nx = hit.x - gx, ny = hit.y - gy;
      const nl = Math.hypot(nx, ny) || 1e-9; nx /= nl; ny /= nl;
      const cos = clamp(dx * nx + dy * ny, -1, 1);
      let tx = dx - cos * nx, ty = dy - cos * ny;
      const tl = Math.hypot(tx, ty);
      if (tl > 1e-9) { tx /= tl; ty /= tl; } else { tx = 0; ty = 0; }
      return { ball: hit.n, t, gx, gy, nx, ny, cos, tx, ty };
    }
    return { ball: -1, t: tw, gx: x + dx * tw, gy: y + dy * tw };
  }
  function validSpot(balls, x, y, kitchen, skip) {
    if (!(x >= R && x <= W - R && y >= R && y <= L - R)) return false;
    if (kitchen && y < HEAD_Y) return false;
    for (const p of POCKETS) if (Math.hypot(x - p.x, y - p.y) < p.r + 0.5 * R) return false;
    for (const b of balls) {
      if (!b.on || b.n === skip) continue;
      if ((b.x - x) * (b.x - x) + (b.y - y) * (b.y - y) < 4 * R * R * 1.0025) return false;
    }
    return true;

            const lo = (0.035 + 0.19 * Math.max(0, hit.cos)) * s;
            g.lineWidth = 2;
            line(os.x + hit.nx * rs, os.y + hit.ny * rs, os.x + hit.nx * (rs + lo), os.y + hit.ny * (rs + lo));
            const sn = Math.sqrt(Math.max(0, 1 - hit.cos * hit.cos)), lc = (0.02 + 0.15 * sn) * s;
            g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1.4;
            line(gs.x, gs.y, gs.x + hit.tx * lc, gs.y + hit.ty * lc);
            if (legalNow().indexOf(hit.ball) < 0) {
              g.strokeStyle = '#ff5a4a'; g.lineWidth = 2.2; const q = rs * 0.5;
              line(gs.x - q, gs.y - q, gs.x + q, gs.y + q); line(gs.x - q, gs.y + q, gs.x + q, gs.y - q);
            }
          }
          g.restore();
        }
        // a cue stick, drawn tip-first along +x in the current transform
        const STICK = [[0, 0.012, '#3f6fa6'], [0.012, 0.042, '#efe7d2'], [0.042, 0.86, '#e2c38c'], [0.86, 0.875, '#c79f45'], [0.875, 1.13, '#4b2412'], [1.13, 1.142, '#ece0c4'], [1.142, 1.36, '#1d1815'], [1.36, 1.49, '#4b2412'], [1.49, 1.52, '#0e0b0a']];
        function stickShape(len, w0, w1, sh) {
          const hw = (x) => w0 + (w1 - w0) * (x / len);
          const sc = len / 1.52;
          if (sh) {
            g.save(); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 7; g.shadowOffsetX = 4; g.shadowOffsetY = 8;
            g.fillStyle = '#000'; g.beginPath(); g.moveTo(0, -hw(0)); g.lineTo(len, -hw(len)); g.lineTo(len, hw(len)); g.lineTo(0, hw(0)); g.closePath(); g.fill();
            g.restore();
          }
          for (const [a, b, col] of STICK) {
            const x0 = a * sc, x1 = b * sc;
            const gr = g.createLinearGradient(0, -w1, 0, w1);
            gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(0.32, 'rgba(255,255,255,.35)'); gr.addColorStop(0.55, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)');
            g.beginPath(); g.moveTo(x0, -hw(x0)); g.lineTo(x1, -hw(x1)); g.lineTo(x1, hw(x1)); g.lineTo(x0, hw(x0)); g.closePath();
            g.fillStyle = col; g.fill(); g.fillStyle = gr; g.fill();
          }
          // forearm points
          g.fillStyle = 'rgba(236,224,196,.85)';
          for (const sgn of [-1, 1]) { const x0 = 0.875 * sc, x1 = 1.0 * sc; g.beginPath(); g.moveTo(x0, sgn * hw(x0) * 0.85); g.lineTo(x1, 0); g.lineTo(x0, sgn * hw(x0) * 0.2); g.closePath(); g.fill(); }
        }
        function drawStick() {
          if (stickAlpha <= 0.01 || !cue.on) return;
          let gap;
          if (phase === 'strike') { const k = Math.min(1, strikeT / 0.07); gap = (0.012 + strikeFrom * 0.24) * (1 - k * k) - 0.004 * k; }
          else if (phase === 'roll' || phase === 'end') gap = stickGap;
          else gap = 0.012 + power * 0.24;
          stickGap = gap;
          const c = toS(cue.x, cue.y), dx = Math.cos(aim), dy = Math.sin(aim);
          g.save();
          g.globalAlpha = stickAlpha;
          g.translate(c.x - dx * (R * s + gap * s), c.y - dy * (R * s + gap * s));
          g.rotate(aim + Math.PI);
          stickShape(1.52 * s, 0.0085 * s, 0.02 * s, true);
          g.restore();
        }
        function drawBar() {
          const x = bar.x, w = bar.w, y0 = bar.y0, y1 = bar.y1;
          const live = (phase === 'aim' && game.turn === 0) || (phase === 'bot' && power > 0) || phase === 'strike';
          g.save();
          g.globalAlpha = live || phase === 'bot' ? 1 : 0.55;
          g.fillStyle = '#140b07'; roundRect(g, x, y0, w, y1 - y0, w / 2); g.fill();
          g.strokeStyle = 'rgba(214,170,90,.75)'; g.lineWidth = 1.5; roundRect(g, x + 0.75, y0 + 0.75, w - 1.5, y1 - y0 - 1.5, w / 2); g.stroke();
          const ix = x + 5, iw = w - 10, top = y0 + 10;
          const pw = phase === 'strike' ? strikeFrom * (1 - Math.min(1, strikeT / 0.07)) : power;
          if (pw > 0) {
            const gr = g.createLinearGradient(0, top, 0, top + bar.travel);
            gr.addColorStop(0, '#5e8f3a'); gr.addColorStop(0.55, '#d9a12a'); gr.addColorStop(1, '#c8392b');
            g.fillStyle = gr; roundRect(g, ix, top, iw, Math.max(iw, pw * bar.travel), iw / 2); g.fill();
          }
          g.strokeStyle = 'rgba(240,228,200,.25)'; g.lineWidth = 1;
          for (let k = 1; k < 10; k++) { const yy = top + (k / 10) * bar.travel; line(x + w - 8, yy, x + w - 4, yy); }
          // the cue sits in the slot, tip up, and slides down as you pull
          g.save();
          g.beginPath(); roundRect(g, x + 2, y0 + 2, w - 4, y1 - y0 - 4, w / 2); g.clip();
          g.translate(x + w / 2, top + 2 + pw * bar.travel);
          g.rotate(Math.PI / 2);
          stickShape((y1 - y0) * 1.4, w * 0.13, w * 0.3, false);
          g.restore();
          if (phase === 'aim' && game.turn === 0 && power === 0 && !RM) {
            const a = 0.5 + 0.5 * Math.sin(T * 5);
            g.fillStyle = `rgba(243,230,200,${0.35 + 0.5 * a})`;
            const yy = top + bar.travel * 0.42 + a * 6, cx = x + w / 2;
            g.beginPath(); g.moveTo(cx - 6, yy); g.lineTo(cx + 6, yy); g.lineTo(cx, yy + 7); g.closePath(); g.fill();
            g.beginPath(); g.moveTo(cx - 6, yy + 9); g.lineTo(cx + 6, yy + 9); g.lineTo(cx, yy + 16); g.closePath(); g.fill();
          }
          if (pw > 0.005 && phase !== 'strike') {
            g.fillStyle = '#f3e6c8'; g.font = util.font('sign', 11, 900); g.textAlign = 'center'; g.textBaseline = 'bottom';
            g.fillText(Math.round(pw * 100) + '%', x + w / 2, y0 - 2 < 14 ? y0 + 14 : y0 - 2);
          }
          g.restore();
        }
        function drawPockets() {
          const p0 = game.turn;
          const calling = phase === 'aim' && p0 === 0 && onEight(game, 0);
          HOLES.forEach((p, k) => {
            const c = toS(p.x, p.y), r = p.r * s;
            if (game.called === k && (calling || phase === 'bot' || phase === 'strike' || phase === 'roll')) {
              g.save();
              g.strokeStyle = '#f2c14e'; g.lineWidth = 3;
              g.shadowColor = 'rgba(242,193,78,.8)'; g.shadowBlur = 10;
              g.beginPath(); g.arc(c.x, c.y, r + 4, 0, 6.283); g.stroke();
              g.restore();
              // arrow pointing into the called pocket
              const tx = ox + clamp(p.x, 0, W) * s, ty = oy + clamp(p.y, 0, L) * s;
              const vx = ox + W * s / 2 - tx, vy = oy + L * s / 2 - ty, vl = Math.hypot(vx, vy), ux = vx / vl, uy = vy / vl;
              const bob = RM ? 0 : Math.sin(T * 6) * 3;
              const ax = tx + ux * (r + 16 + bob), ay = ty + uy * (r + 16 + bob);
              g.save(); g.translate(ax, ay); g.rotate(Math.atan2(-uy, -ux));
              g.fillStyle = '#f2c14e'; g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1.2;
              g.beginPath(); g.moveTo(9, 0); g.lineTo(-5, -7); g.lineTo(-2, 0); g.lineTo(-5, 7); g.closePath(); g.fill(); g.stroke();
              g.restore();
            } else if (calling && game.called < 0) {
              const a = RM ? 0.7 : 0.45 + 0.4 * Math.sin(T * 5 + k);
              g.save(); g.strokeStyle = `rgba(242,193,78,${a})`; g.lineWidth = 2.5; g.setLineDash([5, 4]);
              g.beginPath(); g.arc(c.x, c.y, r + 4, 0, 6.283); g.stroke(); g.restore();
            }
          });
        }
        function drawKitchen() {
          if (!(game.kitchen && game.bih && phase === 'aim')) return;
          g.save();
          g.fillStyle = 'rgba(255,255,255,.045)'; g.fillRect(ox, oy + HEAD_Y * s, W * s, (L - HEAD_Y) * s);
          g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.2; g.setLineDash([6, 6]);
          line(ox, oy + HEAD_Y * s, ox + W * s, oy + HEAD_Y * s);
          g.restore();
        }
        function drawBallInHand() {
          if (!(game.bih && phase === 'aim' && game.turn === 0 && cue.on)) return;
          const c = toS(cue.x, cue.y), rr = R * s + 7;
          const bad = drag && drag.kind === 'place' && !drag.ok;
          g.save();
          g.strokeStyle = bad ? '#ff5a4a' : 'rgba(255,255,255,.85)'; g.lineWidth = 2;
          g.setLineDash([5, 5]); g.lineDashOffset = RM ? 0 : -T * 14;
          g.beginPath(); g.arc(c.x, c.y, rr, 0, 6.283); g.stroke();
          g.setLineDash([]);
          g.fillStyle = bad ? '#ff5a4a' : 'rgba(255,255,255,.9)';
          for (let k = 0; k < 4; k++) {
            const a = k * Math.PI / 2, ex = c.x + Math.cos(a) * (rr + 7), ey = c.y + Math.sin(a) * (rr + 7);
            g.save(); g.translate(ex, ey); g.rotate(a);
            g.beginPath(); g.moveTo(4, 0); g.lineTo(-2, -4); g.lineTo(-2, 4); g.closePath(); g.fill();
            g.restore();
          }
          g.restore();
        }
        function drawStatus() {
          let text = '';
          if (noteT > 0 && note) text = note;
          else if (phase === 'end') text = note;
          else if (phase === 'aim' && game.turn === 0) {
            if (onEight(game, 0) && game.called < 0) text = 'Tap a pocket to call the 8';
            else if (onEight(game, 0)) text = `8 called: ${POCKETS[game.called].name} pocket. Pull to shoot`;
            else if (game.isBreak) text = 'Your break: slide the cue ball, aim, pull the cue';
            else if (game.bih) text = 'Ball in hand: drag the cue ball anywhere';
            else text = 'Drag to aim. Pull the cue down to shoot';
          } else if (phase === 'bot') {
            if (bot && bot.st === 'place') text = `${FOE} has ball in hand`;
            else if (game.called >= 0 && game.turn === 1) text = `${FOE} calls the ${POCKETS[game.called].name} pocket`;
            else text = `${FOE} is lining up a shot`;
          }
          if (!text) return;
          const left = bar.x, right = (parseFloat(spinBtn.style.left) || Wc) - 10;
          const maxW = Math.max(60, right - left);
          let fs = 13;
          g.save();
          g.font = util.font('sign', fs, 800);
          while (g.measureText(text.toUpperCase()).width > maxW && fs > 9) { fs -= 0.5; g.font = util.font('sign', fs, 800); }
          g.textAlign = 'center'; g.textBaseline = 'middle';
          const tw = Math.min(maxW, g.measureText(text.toUpperCase()).width) + 22, mx = (left + right) / 2;
          g.fillStyle = 'rgba(16,9,5,.72)'; roundRect(g, mx - tw / 2, botY + 29 - 13, tw, 26, 13); g.fill();
          g.fillStyle = '#f3e6c8'; g.fillText(text.toUpperCase(), mx, botY + 29.5);
          g.restore();
        }
        function draw() {
          frames++;
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.clearRect(0, 0, Wc, Hc);
          g.drawImage(bgc, 0, 0, Wc, Hc);
          drawKitchen();
          drawPockets();
          // sinking balls drop into their hole
          for (const sk of sinking) {
            const k = Math.min(1, sk.t / 0.32);
            const x = sk.x + (sk.hx - sk.x) * ease(k * 1.3), y = sk.y + (sk.hy - sk.y) * ease(k * 1.3);
            const c = toS(x, y), st = look[sk.n];
            if (!st.size) continue;
            const sc = 1 - 0.45 * k, sz = (st.size / dpr) * sc;
            g.save(); g.globalAlpha = 1 - k * 0.85;
            g.drawImage(st.cv, c.x - sz / 2, c.y - sz / 2, sz, sz);
            g.fillStyle = `rgba(0,0,0,${0.6 * k})`; g.beginPath(); g.arc(c.x, c.y, R * s * sc, 0, 6.283); g.fill();
            g.restore();
          }
          // shadows, then balls
          const sw = shadowC.width / dpr;
          for (const b of B) if (b.on) { const c = toS(b.x, b.y); g.drawImage(shadowC, c.x - sw / 2 + R * s * 0.2, c.y - sw / 2 + R * s * 0.32, sw, sw); }
          for (const b of B) if (b.on) { const c = toS(b.x, b.y); drawBallAt(b.n, c.x, c.y); }
          const showGuide = (phase === 'aim' && game.turn === 0) || (phase === 'bot' && bot && (bot.st === 'turn' || bot.st === 'hold' || bot.st === 'pull'));
          if (showGuide) drawGuide();
          drawBallInHand();
          drawStick();
          drawBar();
          drawStatus();
        }

        /* ---------- input: drag to aim, pull the bar, drag the cue ball, tap a pocket ---------- */
        const toTable = (p) => ({ x: (p.x - ox) / s, y: (p.y - oy) / s });
        const inBar = (p) => p.x <= bar.x + bar.w + 8 && p.y >= bar.y0 - 24 && p.y <= bar.y1 + 24;
        function pocketAt(p) {
          let best = -1, bd = Infinity;
          HOLES.forEach((q, k) => { const c = toS(q.x, q.y), d = Math.hypot(p.x - c.x, p.y - c.y); if (d < Math.max(28, 2.8 * R * s) && d < bd) { bd = d; best = k; } });
          return best;
        }
        cv.canvas.addEventListener('pointerdown', (e) => {
          if (drag || spinOpen || phase !== 'aim' || game.turn !== 0) return;
          e.preventDefault();
          const p = cv.toLocal(e);
          if (inBar(p)) { drag = { kind: 'power', id: e.pointerId, y0: p.y }; power = 0; return; }
          if (onEight(game, 0)) {
            const k = pocketAt(p);
            if (k >= 0) { game.called = k; noteT = 0; sound.play('tap'); drag = { kind: 'none', id: e.pointerId }; paintHud(); return; }
          }
          const c = toS(cue.x, cue.y);
          if (game.bih && Math.hypot(p.x - c.x, p.y - c.y) < Math.max(30, 2.8 * R * s)) {
            drag = { kind: 'place', id: e.pointerId, dx: c.x - p.x, dy: c.y - p.y, ok: true };
            return;
          }
          drag = { kind: 'aim', id: e.pointerId, a: Math.atan2(p.y - c.y, p.x - c.x), x: p.x, y: p.y, t: e.timeStamp };
        }, { signal });
        window.addEventListener('pointermove', (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const p = cv.toLocal(e);
          if (drag.kind === 'power') power = clamp((p.y - drag.y0) / bar.travel, 0, 1);
          else if (drag.kind === 'aim') {
            const c = toS(cue.x, cue.y), a = Math.atan2(p.y - c.y, p.x - c.x), dist = Math.hypot(p.x - c.x, p.y - c.y);
            let da = wrapA(a - drag.a);
            if (dist < 50) da *= dist / 50;
            // slow drags turn the cue slower than the finger: easy fine adjustments, quick swipes still swing it round
            const v = Math.hypot(p.x - drag.x, p.y - drag.y) / Math.max(1, e.timeStamp - drag.t);
            aim = wrapA(aim + da * clamp(0.3 + v * 0.9, 0.3, 1));
            drag.a = a; drag.x = p.x; drag.y = p.y; drag.t = e.timeStamp;
          } else if (drag.kind === 'place') {
            const q = toTable({ x: p.x + drag.dx, y: p.y + drag.dy });
            cue.x = clamp(q.x, R, W - R); cue.y = clamp(q.y, game.kitchen ? HEAD_Y : R, L - R);
            drag.ok = validSpot(B, cue.x, cue.y, game.kitchen, 0);
            const st = look[0]; st.lx = cue.x; st.ly = cue.y;
          }
        }, { signal });
        function release(e, cancel) {
          if (!drag || e.pointerId !== drag.id) return;
          const d = drag;
          drag = null;
          if (d.kind === 'power') { if (!cancel && power > 0.03) shoot(power); else power = 0; }
          else if (d.kind === 'place') {
            if (!validSpot(B, cue.x, cue.y, game.kitchen, 0)) { const sp = freeSpot(B, cue.x, cue.y, game.kitchen, 0); cue.x = sp.x; cue.y = sp.y; }
            look[0].lx = cue.x; look[0].ly = cue.y;
            sound.play('tick');
          }
        }
        window.addEventListener('pointerup', (e) => release(e, false), { signal });
        window.addEventListener('pointercancel', (e) => release(e, true), { signal });
        window.addEventListener('keydown', (e) => {
          if (spinOpen) { if (e.key === 'Escape') closeSpin(); return; }
          if (phase !== 'aim' || game.turn !== 0) return;
          const k = e.key;
          if (k === 'ArrowLeft' || k === 'ArrowRight') { aim = wrapA(aim + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 2 : 0.2) * DEG); e.preventDefault(); }
          else if (k === 'ArrowUp' || k === 'ArrowDown') { power = clamp(power + (k === 'ArrowDown' ? 0.05 : -0.05), 0, 1); e.preventDefault(); }
          else if ((k === ' ' || k === 'Enter') && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); if (power > 0.03) shoot(power); }
          else if (/^[1-6]$/.test(k) && onEight(game, 0)) { game.called = +k - 1; noteT = 0; sound.play('tap'); }
        }, { signal });

        /* ---------- spin (english) picker ---------- */
        function closeSpin() { if (spinOpen) { spinOpen.remove(); spinOpen = null; } }
        spinBtn.addEventListener('click', () => {
          if (phase !== 'aim' || game.turn !== 0 || spinOpen) return;
          drag = null;
          const dot = h('i'), ball = h('span', { class: 'pl-cb pl-big', role: 'slider', 'aria-label': 'Where the cue hits the cue ball' }, dot);
          const paintBig = () => { dot.style.left = 50 + spin.x * 36 + '%'; dot.style.top = 50 - spin.y * 36 + '%'; paintSpin(); };
          const setFrom = (e) => {
            const r = ball.getBoundingClientRect();
            let x = ((e.clientX - r.left) / r.width) * 2 - 1, y = ((e.clientY - r.top) / r.height) * 2 - 1;
            const m = Math.hypot(x, y), lim = 0.72;
            if (m > lim) { x *= lim / m; y *= lim / m; }
            spin = { x: x / lim, y: -y / lim };
            paintBig();
          };
          let down = false;
          ball.addEventListener('pointerdown', (e) => { e.preventDefault(); down = true; setFrom(e); }, { signal });
          ball.addEventListener('pointermove', (e) => { if (down) setFrom(e); }, { signal });
          ball.addEventListener('pointerup', () => { down = false; }, { signal });
          ball.addEventListener('pointerleave', () => { down = false; }, { signal });
          const ov = h('div', { class: 'pl-ov' },
            h('div', { class: 'pl-panel' },
              h('h3', {}, 'Spin'),
              ball,
              h('p', {}, 'Top for follow, bottom for draw, a side for english off the rail.'),
              h('div', { class: 'pl-row' },
                h('button', { class: 'btn small secondary', type: 'button', onclick: () => { spin = { x: 0, y: 0 }; paintBig(); } }, 'Center'),
                h('button', { class: 'btn small', type: 'button', onclick: () => closeSpin() }, 'Done'))));
          ov.addEventListener('pointerdown', (e) => { if (e.target === ov) closeSpin(); }, { signal });
          stage.append(ov);
          spinOpen = ov;
          paintBig();
        }, { signal });

        /* ---------- debug-only test hooks ---------- */
        if (ctx.debug) {
          const client = (x, y) => { const r = cv.canvas.getBoundingClientRect(); return { x: r.left + (ox + x * s) * (r.width / cv.w), y: r.top + (oy + y * s) * (r.height / cv.h) }; };
          SCQ.test.pool = {
            state: () => ({
              phase, turn: game.turn, groups: game.groups.slice(), bih: game.bih, kitchen: game.kitchen, isBreak: game.isBreak, called: game.called,
              aim, power, spin: Object.assign({}, spin), shots: game.shots, over: game.over, onEight: [onEight(game, 0), onEight(game, 1)],
              balls: B.map((b) => ({ n: b.n, x: b.x, y: b.y, on: b.on })), banner: lastBanner, note: noteT > 0 ? note : '', frames, settled,
              bot: bot ? bot.st : null, spinOpen: !!spinOpen,
              params: Object.assign({}, K),
            }),
            client,
            pocketClient: (k) => client(HOLES[k].x, HOLES[k].y),
            barClient: () => { const r = cv.canvas.getBoundingClientRect(), k = r.width / cv.w; return { x: r.left + (bar.x + bar.w / 2) * k, y0: r.top + (bar.y0 + 20) * k, travel: bar.travel * k }; },
            // put balls anywhere: { balls: {n: [x, y]}, cue: [x, y], groups: [g0, g1], turn, bih }
            setup(spec) {
              for (const b of B) { b.on = false; b.vx = 0; b.vy = 0; b.pocket = -1; }
              const pos = Object.assign({}, spec.balls || {});
              pos[0] = spec.cue || [HEAD.x, HEAD.y];
              for (const k in pos) { const b = B[+k]; b.x = pos[k][0]; b.y = pos[k][1]; b.on = true; look[b.n].lx = b.x; look[b.n].ly = b.y; look[b.n].dirty = true; }
              game.groups = (spec.groups || [null, null]).slice();
              game.isBreak = false; game.kitchen = false; game.bih = !!spec.bih; game.called = -1; game.over = null; game.turn = spec.turn || 0;
              S = null; bannerQ.length = 0; sinking.length = 0; noteT = 0; closeSpin();
              if (game.turn === 0) startMyTurn(); else startBotTurn();
              paintHud();
            },
            aimAt(x, y) { aim = Math.atan2(y - cue.y, x - cue.x); return aim; },
            setAim(a) { aim = a; },
            // what a simulated player of this skill would do now (for scripted soak tests)
            plan(model) {
              const p = planShot(game, 0, MODELS[model || 'decent'], rng);
              return { kind: p.kind, angle: p.angle, power: powerOfSpeed(p.speed), place: p.place, called: p.called };
            },
            shoot(p) { power = p; shoot(p); },
            speed(k) { speedMul = k; },
            core: Core,
          };
        }

        /* ---------- go ---------- */
        cv.onResize = () => layout();
        layout();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!signal.aborted && !settled) layout(); }).catch(() => {});
        game.balls[0].x = HEAD.x; game.balls[0].y = HEAD.y;
        look[0].lx = HEAD.x; look[0].ly = HEAD.y;
        queueBanner('Your break', 1000);
        startMyTurn();
        util.loop((dt) => {
          if (settled) return false;
          update(dt * speedMul);
          draw();
          return !settled;
        }, signal);
      });
    },
  });
})();

</script>
<script>/* games/portrait.js */

.pt-doodle { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pt-placard {
  width: min(300px, 100%); background: var(--card); border: 1px solid var(--ink-soft);
  box-shadow: 3px 3px 0 var(--paper-2); padding: 8px 12px 9px; font-size: .84rem; line-height: 1.35;
}
.pt-placard b { display: block; font-weight: 900; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
.pt-placard span { display: block; font-family: var(--f-story); font-style: italic; color: var(--ink-soft); }

  function injectStyle() {

  }

  /* Exhibit A: a deliberately terrible ballpoint doodle of Stella on notebook paper */
  function doodle(cv) {
    const S = 600;

    const g = cv.getContext('2d');
    const R = SCQ.util.seeded(711);

    g.fillStyle = '#fdfaf0'; g.fillRect(0, 0, S, S);
    g.strokeStyle = 'rgba(110, 160, 205, .45)'; g.lineWidth = 2;
    for (let y = 70; y < S; y += 36) { g.beginPath(); g.moveTo(0, y); g.lineTo(S, y); g.stroke(); }
    g.strokeStyle = 'rgba(214, 110, 110, .55)';
    g.beginPath(); g.moveTo(62, 0); g.lineTo(62, S); g.stroke();
    const PEN = '#2c4a92', RED = '#c8443a';
    g.lineCap = 'round'; g.lineJoin = 'round';

        g.strokeStyle = color || PEN; g.lineWidth = w * (p ? 0.7 : 1);
        const q = pts.map(([x, y]) => [x + J(3.5), y + J(3.5)]);

        for (let i = 1; i < q.length - 1; i++) g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);

    g.fillStyle = 'rgba(232, 120, 140, .3)';
    g.beginPath(); g.arc(212, 300, 26, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(398, 282, 34, 0, Math.PI * 2); g.fill();
    // the enormous head
    wob(ring(300, 238, 152, 170, 28, 10, -1.3), 5);
    // hair: a scribbled zigzag crown, loops, and strands that give up halfway
    const crown = [];
    for (let i = 0; i <= 34; i++) { const a = Math.PI * (1.02 + (i / 34) * 0.96); const r = 166 + (i % 2 ? 30 : 0) + J(8); crown.push([300 + Math.cos(a) * r, 236 + Math.sin(a) * r * 1.02]); }
    wob(crown, 4, PEN, 1);
    for (let k = 0; k < 9; k++) {
      const a = Math.PI * (1.12 + k * 0.095);
      wob(ring(300 + Math.cos(a) * 178, 232 + Math.sin(a) * 182, 16 + J(5), 13 + J(4), 10, 3), 3, PEN, 1);
    }
    wob([[150, 190], [128, 262], [146, 330], [122, 392], [138, 438]], 4, PEN, 1);
    wob([[162, 214], [150, 300], [168, 372]], 3, PEN, 1);
    wob([[452, 196], [474, 268], [458, 342], [482, 412], [470, 452]], 4, PEN, 1);
    wob([[438, 220], [452, 300], [440, 360]], 3, PEN, 1);
    // eyes that do not agree with each other
    g.fillStyle = PEN;
    g.beginPath(); g.arc(240, 214, 11, 0, Math.PI * 2); g.fill();
    wob([[226, 196], [218, 186]], 3, PEN, 1); wob([[240, 194], [240, 182]], 3, PEN, 1); wob([[254, 197], [262, 187]], 3, PEN, 1);
    wob(ring(362, 204, 27, 24, 14, 3), 4, PEN, 1);
    g.beginPath(); g.arc(373, 213, 8, 0, Math.PI * 2); g.fill();
    // brows: one calm, one deeply surprised
    wob([[218, 172], [262, 168]], 4, PEN, 1);
    wob([[336, 150], [362, 130], [394, 142]], 4, PEN, 1);
    // nose
    wob([[302, 222], [286, 282], [314, 286]], 4, PEN, 1);
    // the lopsided smile and its single tooth
    wob([[212, 318], [252, 348], [304, 352], [350, 332], [398, 284]], 5);
    g.strokeStyle = PEN; g.lineWidth = 3; g.strokeRect(296 + J(2), 347, 16, 14);
    // a body that ran out of paper budget
    wob([[300, 406], [303, 452], [306, 506]], 5);
    wob([[302, 432], [356, 404], [416, 352]], 5);
    wob([[416, 352], [424, 330]], 3, PEN, 1); wob([[416, 352], [440, 340]], 3, PEN, 1); wob([[416, 352], [438, 362]], 3, PEN, 1);
    wob([[302, 434], [256, 470], [222, 508]], 5);
    wob([[306, 506], [282, 556], [262, 590]], 5);
    wob([[306, 506], [334, 548], [376, 574]], 5);

  const PENCIL = (color) => `<svg viewBox="0 0 26 76" aria-hidden="true">
    <path d="M5 22 L13 3 L21 22 Z" fill="#e8c493" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M10.3 9.4 L13 3 L15.7 9.4 Z" fill="${color}"/>
    <rect x="5" y="22" width="16" height="54" fill="${color}" stroke="currentColor" stroke-width="1.2"/>
    <path d="M10.3 22 V76 M15.7 22 V76" stroke="rgba(255,255,255,.28)" stroke-width="1.4"/>
    <path d="M5 22 Q9 25 13 22 Q17 25 21 22" fill="none" stroke="currentColor" stroke-width="1"/>
  </svg>`;
  const ERASER_SVG = `<svg viewBox="0 0 26 76" aria-hidden="true">
    <rect x="4" y="4" width="18" height="30" rx="4" fill="#efa9a1" stroke="currentColor" stroke-width="1.2"/>

  const UNDO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';

  SCQ.screens.portrait = function (root) {
    if (!SCQ.sideQuestUnlocked('portrait')) return SCQ.go('glovebox');
    injectStyle();
    const { h, Store, Sync, toast, confirmInline, Sound, fmtDate } = SCQ;
    const INKS = readInks();

    /* ---------------------------------------------------------- Exhibit A */
    const photo = SCQ.photoEl('micah-portrait', "Micah's portrait of you", 'pencil', { eager: true });
    const hasPhoto = !!(window.SCQ_PHOTOS && window.SCQ_PHOTOS['micah-portrait']);

      const ph = photo.querySelector('.ph');
      const dc = h('canvas', { class: 'pt-doodle', role: 'img', 'aria-label': 'A wobbly ballpoint stick figure with a huge head, scribbled hair and a lopsided smile' });

      doodle(dc);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (dc.isConnected) doodle(dc); }).catch(() => {});

    } else {
      placardA = h('div', { class: 'pt-placard' }, h('b', {}, "Micah's portrait of you"), h('span', {}, 'Ballpoint on whatever paper was nearby.'));

    const cv = h('canvas', { class: 'pt-canvas', width: SIZE, height: SIZE, role: 'img', 'aria-label': 'Drawing paper. Draw your portrait of Micah here.' });
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.fillStyle = PAPER; g.fillRect(0, 0, SIZE, SIZE);
    g.lineCap = 'round'; g.lineJoin = 'round';
    const saved = Store.state.portrait;
    const hasSaved = !!(saved && typeof saved.image === 'string' && saved.image.startsWith('data:image/'));
    const hint = h('div', { class: 'pt-hint' + (hasSaved ? ' gone' : '') }, 'Draw Micah here.', h('br'), 'He promises not to laugh.');
    const frame = h('div', { class: 'pt-frame' }, cv, hint);
    let loading = false;
    if (hasSaved) {
      loading = true;
      const img = new Image();
      img.onload = () => { g.drawImage(img, 0, 0, SIZE, SIZE); loading = false; };
      img.onerror = () => { loading = false; };

    }

    let tool = 'ink', sizeIdx = 1;
    const undo = [];
    const tools = [
      ['ink', 'Ink pencil'], ['route', 'Highway red pencil'], ['shield', 'Interstate blue pencil'], ['park', 'Park green pencil'], ['gold', 'Gold pencil'],
    ];
    const toolBtns = {};
    const tin = h('div', { class: 'pt-tin', role: 'group', 'aria-label': 'Pencils' });
    tools.forEach(([id, label]) => {
      const b = h('button', { class: 'pt-pencil', type: 'button', 'aria-label': label, 'aria-pressed': 'false', html: PENCIL(INKS[id]) });
      b.addEventListener('click', () => { tool = id; paintTools(); Sound.play('tap'); });
      toolBtns[id] = b; tin.append(b);
    });
    const eraserBtn = h('button', { class: 'pt-pencil', type: 'button', 'aria-label': 'Eraser', 'aria-pressed': 'false', html: ERASER_SVG });
    eraserBtn.addEventListener('click', () => { tool = 'eraser'; paintTools(); Sound.play('tap'); });
    toolBtns.eraser = eraserBtn; tin.append(eraserBtn);

    const sizeBtns = SIZES.map((s, i) => {
      const d = [6, 11, 19][i];
      const b = h('button', { class: 'pt-size', type: 'button', 'aria-label': ['Thin', 'Medium', 'Thick'][i] + ' line', 'aria-pressed': 'false' }, h('i', { style: { width: d + 'px', height: d + 'px' } }));
      b.addEventListener('click', () => { sizeIdx = i; paintTools(); Sound.play('tap'); });

    });
    const undoBtn = h('button', { class: 'btn small secondary', type: 'button', 'aria-label': 'Undo the last stroke' }, h('span', { html: UNDO_SVG, style: { display: 'inline-flex' } }), 'Undo');
    undoBtn.addEventListener('click', doUndo);
    const clearBtn = h('button', { class: 'btn small secondary', type: 'button' }, 'Clear');
    clearBtn.addEventListener('click', () => confirmInline(clearBtn, 'Start a fresh page?', () => {
      pushUndo();
      g.fillStyle = PAPER; g.fillRect(0, 0, SIZE, SIZE);
      Sound.play('whoosh');
    }, 'Clear'));
    const acts = h('div', { class: 'pt-acts' }, undoBtn, clearBtn);

    function penColor() { return tool === 'eraser' ? PAPER : INKS[tool]; }
    function penWidth() { return SIZES[sizeIdx] * (tool === 'eraser' ? ERASER : 1); }
    function paintTools() {
      Object.entries(toolBtns).forEach(([id, b]) => b.setAttribute('aria-pressed', String(id === tool)));
      sizeBtns.forEach((b, i) => {
        b.setAttribute('aria-pressed', String(i === sizeIdx));
        b.style.setProperty('--pt-c', tool === 'eraser' ? 'transparent' : INKS[tool]);

    }

    function pushUndo() {

    let active = null;

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

      const last = pts[pts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) < 1.5) return;
      pts.push(p);

      g.beginPath();

    }
    cv.addEventListener('pointerdown', (e) => {
      if (active || loading) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
