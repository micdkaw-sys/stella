    /* ---------------------------------------------------------- hang it on the wall */
    const dateLine = h('span', { class: 'pt-date' }, hasSaved ? 'Hung ' + fmtDate(saved.at, true) : 'Not on the wall yet');
    const placardB = h('div', { class: 'pt-placard' }, h('b', {}, 'Your portrait of Micah'), h('span', {}, 'Colored pencil on paper.'), dateLine);
    const hang = h('button', { class: 'btn pt-hang', type: 'button' }, 'Hang it on the wall');

      h('button', { class: 'link-btn', type: 'button', onclick: () => SCQ.go('glovebox') }, '← Glovebox'),
      h('header', { class: 'deck-head' },
        h('div', { class: 'eyebrow' }, 'Side quest'),
        h('h1', { class: 'sign' }, 'Portrait Studio'),
        h('p', { class: 'pt-lede' }, 'Two artists. Two portraits. One of them tried.')),
      h('div', { class: 'section-title' }, h('h2', {}, 'Exhibit A'), h('span', {}, 'By Micah')),

    { fur: '#3d3431', ear: '#2a2321', muzzle: '#56493f', ears: 'flop' },                 // black lab
    { fur: '#d8772f', ear: '#c0612a', muzzle: '#fbf1e0', ears: 'point', blaze: true },   // corgi
    { fur: '#f6f1e6', ear: '#3d3431', muzzle: '#ffffff', ears: 'flop', spots: true },    // dalmatian
    { fur: '#e2c290', ear: '#3d3431', muzzle: '#4a3c33', ears: 'fold', mask: true },     // pug

  /* ---------- the pop-up field: pure, shared by the live game and the debug simulator ---------- */
  const RISE = 0.13, FALL = 0.16, HAPPY = 0.32;
  function newField(K, rnd) {
    return {
      t: 0, fed: 0, misses: 0, spawnT: 0.25, lastMicah: -9, ev: [],
      spots: Array.from({ length: 9 }, (_, i) => ({ i, row: Math.floor(i / 3), col: i % 3, state: 'idle', t: 0, hold: 0, who: 'pup', breed: 0, fed: false, cool: 0, up: 0, woke: false })),

  const progress = (F) => Math.min(1, F.fed / F.K.goal);
  function spawn(F) {
    const K = F.K, rnd = F.rnd;
    const free = F.spots.filter((s) => s.state === 'idle' && s.cool <= 0);
    if (!free.length) return;
    const s = free[Math.floor(rnd() * free.length)];
    const micahUp = F.spots.some((x) => x.who === 'micah' && x.state !== 'idle');
    const pupsUp = F.spots.some((x) => x.who === 'pup' && x.state !== 'idle');

  function stepField(F, dt) {

            if (s.row !== row || s.up <= 0.001) continue;
            if (s.who === 'micah') drawMicah(s); else drawPup(s);
          }
          g.restore();
          // paws resting on the edge
          for (const s of F.spots) {
            if (s.row !== row || s.who !== 'pup' || s.up < 0.75) continue;
            const r = L.r * L.scale[row], b = BREEDS[s.breed];
            g.fillStyle = b.fur; g.strokeStyle = C.out; g.lineWidth = 1.5;
            [-1, 1].forEach((d) => { g.beginPath(); g.ellipse(L.cols[s.col] + d * r * 0.5, a + 1, r * 0.24, r * 0.15, 0, 0, 6.29); g.fill(); g.stroke(); });
          }
        }
        function draw() {
          g.clearRect(0, 0, W, H);
          if (layers[0]) g.drawImage(layers[0], 0, 0, W, H);
          drawRow(0);
          if (layers[1]) g.drawImage(layers[1], 0, 0, W, H);
          drawRow(1);
          if (layers[2]) g.drawImage(layers[2], 0, 0, W, H);
          drawRow(2);
          if (layers[3]) g.drawImage(layers[3], 0, 0, W, H);
          drawJar();
          drawFx();
        }

        util.loop((dt) => { if (settled) return false; frames++; update(dt); draw(); return true; }, signal);
        draw();
        util.countdown(stage, signal).then(() => {
          if (signal.aborted) return;
          phase = 'play';
        }).catch((err) => reject(err));
      });
    },
  });
})();

<script>/* games/rhythm.js */
/* Stella's Cozy Quest - Front Row: the finale in Raleigh. Notes roll down three lanes from the stage
   to the barricade in time with an original synthesized tune. Timing runs on performance.now, so the
   game plays the same with the sound off; when audio is running, the music is scheduled to match. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ---------------------------------------------------------------- color helpers */
  function rgb(c) {
    if (Array.isArray(c)) return c;
    const s = String(c || '').trim();
    let m = /^#([0-9a-f]{3,8})$/i.exec(s);
    if (m) {
      let hx = m[1];
      if (hx.length < 6) hx = hx.split('').map((ch) => ch + ch).join('');
      return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
    }
    m = /rgba?\(([^)]+)\)/i.exec(s);
    if (m) { const p = m[1].split(/[\s,/]+/).filter(Boolean).map(parseFloat); return [p[0] || 0, p[1] || 0, p[2] || 0]; }

  /* ---------------------------------------------------------------- the song (original)

     two-note chords. 17 bars after a one-bar count-in. MIDI numbers: 62 = D4. */
  const CH = {
    D: { bass: 50, tones: [62, 66, 69] },
    A6: { bass: 49, tones: [61, 64, 69] },
    Bm: { bass: 47, tones: [62, 66, 71] },
    G: { bass: 43, tones: [62, 67, 71] },
    Em: { bass: 40, tones: [64, 67, 71] },
    A: { bass: 45, tones: [61, 64, 69] },
  };
  const PROG = ['D', 'A6', 'Bm', 'G', 'D', 'A6', 'Bm', 'G', 'Em', 'G', 'D', 'A', 'D', 'A6', 'Bm', 'G', 'D'];
  // lead line, one tap per pitch: [bar, beat, pitch or [two pitches], length in beats]
  const LEAD = [
    [0, 0, 66, 2], [0, 2, 69, 2],
    [1, 0, 64, 2], [1, 2, 73, 2],
    [2, 0, 66, 1], [2, 1, 71, 1], [2, 2, 74, 1], [2, 3, 71, 1],
    [3, 0, 67, 1], [3, 1, 71, 1], [3, 2, 74, 1], [3, 3, 69, 1],
    [4, 0, 69, 1.5], [4, 1.5, 74, 1.5], [4, 3, 76, 1],
    [5, 0, 73, 1], [5, 1, 71, 1], [5, 2, 69, 1.5], [5, 3.5, 64, 0.5],
    [6, 0, 71, 1], [6, 1, 74, 1], [6, 2, 73, 0.5], [6, 2.5, 71, 0.5], [6, 3, 66, 1],
    [7, 0, 67, 1.5], [7, 1.5, 69, 0.5], [7, 2, 71, 1.5], [7, 3.5, 69, 0.5],
    [8, 0, 76, 1], [8, 1, 74, 0.5], [8, 1.5, 71, 0.5], [8, 2, 67, 1], [8, 3, 71, 0.5], [8, 3.5, 74, 0.5],
    [9, 0, 74, 1], [9, 1, 71, 0.5], [9, 1.5, 67, 0.5], [9, 2, 62, 1], [9, 3, 67, 0.5], [9, 3.5, 71, 0.5],
    [10, 0, 69, 0.5], [10, 0.5, 66, 0.5], [10, 1, 69, 1], [10, 2, 74, 0.5], [10, 2.5, 73, 0.5], [10, 3, 74, 1],
    [11, 0, 76, 1.5], [11, 1.5, 73, 0.5], [11, 2, 69, 1], [11, 3, 64, 0.5], [11, 3.5, 69, 0.5],
    [12, 0, [66, 74], 1], [12, 1, 69, 0.5], [12, 1.5, 74, 0.5], [12, 2, 66, 1], [12, 3, 69, 0.5], [12, 3.5, 74, 0.5],
    [13, 0, [64, 73], 1], [13, 1, 71, 0.5], [13, 1.5, 69, 0.5], [13, 2, 64, 1], [13, 3, [69, 76], 1],
    [14, 0, [66, 71], 1], [14, 1, 74, 0.5], [14, 1.5, 73, 0.5], [14, 2, 71, 0.5], [14, 2.5, 66, 0.5], [14, 3, [71, 74], 1],
    [15, 0, [67, 74], 1.5], [15, 1.5, 71, 0.5], [15, 2, 69, 1], [15, 3, 66, 0.5], [15, 3.5, 64, 0.5],

  ];
  const laneOf = (m) => (m < 69 ? 0 : m < 73 ? 1 : 2);
  const section = (b) => (b < 4 ? 'A' : b < 8 ? 'B' : b < 12 ? 'C' : b < 16 ? 'D' : 'E');
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* the song speeds up bar by bar: bar k (0 = count-in) plays at bpm * (1 + ramp * progress) */
  function makeClock(bpm, ramp) {
    const n = PROG.length + 1;
    const start = [0], spbs = [];
    for (let k = 0; k < n; k++) {
      const prog = k === 0 ? 0 : (k - 1) / (PROG.length - 1);

    }

  }
  /* extra taps in the second half: up to fillsMax notes per bar on empty off-beats, from the chord */
  function fillNotes(maxPerBar) {
    if (!maxPerBar) return [];
    const out = [];
    for (let b = 8; b < 16; b++) {
      const allow = b >= 12 ? maxPerBar : Math.max(1, maxPerBar - 1);
      const taken = new Set(LEAD.filter((x) => x[0] === b).map((x) => x[1]));
      const tones = CH[PROG[b]].tones;
      let added = 0;
      for (const bt of [1.5, 3.5, 0.5, 2.5]) {
        if (added >= allow) break;
        if (taken.has(bt)) continue;
        out.push([b, bt, tones[(b + added) % 3] + 12, 0.5]);
        added++;
      }
    }
    return out;
  }
  function buildSong(bpm, ramp, fills) {
    const clock = makeClock(bpm, ramp);
    const spb = 60 / bpm;
    const T = clock.T;
    const ev = [];
    const add = (t, kind, a) => ev.push(Object.assign({ t, kind }, a || {}));
    for (let i = 0; i < 4; i++) add(i * spb, 'stick', { v: i === 0 ? 0.26 : 0.18 });
    PROG.forEach((name, b) => {
      const c = CH[name], s = section(b);
      const last = s === 'E';
      const bar = 4 * clock.spbOf(b);
      c.tones.forEach((m) => add(T(b, 0), 'pad', { m, d: last ? bar * 1.1 : bar }));
      const bassPat = {
        A: [[0, 2], [2, 2]],
        B: [[0, 1.5], [1.5, 0.5], [2, 1.5], [3.5, 0.5]],
        C: [[0, 1], [1, 0.5], [1.5, 0.5], [2, 1], [3, 0.5], [3.5, 0.5]],
        D: [[0, 1.5], [1.5, 0.5], [2, 1], [3, 0.5], [3.5, 0.5]],
        E: [[0, 4]],
      }[s];
      bassPat.forEach(([bt, d], k) => add(T(b, bt), 'bass', { m: c.bass + (s === 'D' && k % 2 ? 12 : 0), d: d * clock.spbOf(b) }));
      if (s === 'B' || s === 'C' || s === 'D') {
        const arp = [c.tones[0] + 12, c.tones[1] + 12, c.tones[2] + 12, c.tones[1] + 12];
        for (let k = 0; k < 8; k++) add(T(b, k * 0.5), 'arp', { m: arp[k % 4] });
      }
      if (s === 'A' && b >= 2) for (let k = 0; k < 4; k++) add(T(b, k), 'hat', { v: 0.022 });
      if (s === 'B' || s === 'C' || s === 'D') {
        (s === 'B' ? [0, 2] : [0, 1.5, 2]).forEach((bt) => add(T(b, bt), 'kick'));
        [1, 3].forEach((bt) => add(T(b, bt), 'snare'));
        for (let k = 0; k < 8; k++) add(T(b, k * 0.5), 'hat', { v: k % 2 ? 0.018 : 0.03 });
      }
      if (b === 11) [3.25, 3.5, 3.75].forEach((bt) => add(T(b, bt), 'snare', { v: 0.09 }));
      if (b === 12 || last) add(T(b, 0), 'crash');
      if (last) add(T(b, 0), 'kick');

    LEAD.concat(fillNotes(fills)).forEach(([b, bt, m, d]) => [].concat(m).forEach((p) => add(T(b, bt), 'lead', { m: p, d: d * clock.spbOf(b) })));
    ev.sort((a, b) => a.t - b.t);

  }
  function buildNotes(bpm, ramp, fills) {
    const clock = makeClock(bpm, ramp);
    const out = [];
    LEAD.concat(fillNotes(fills)).forEach(([b, bt, m]) => {
      const t = clock.T(b, bt);
      const ps = [].concat(m);
      ps.forEach((p) => out.push({ t, lane: laneOf(p), chord: ps.length > 1, res: null }));

  const KEYMAP = { j: 0, k: 1, l: 2, a: 0, s: 1, d: 2, ArrowLeft: 0, ArrowDown: 1, ArrowRight: 2 };
  // lane edges at the hit rail (bottom) and where the lanes leave the stage (top), as shares of the width
  const BX = [0.04, 0.35, 0.65, 0.96];
  const TX = [0.34, 0.447, 0.553, 0.66];

  SCQ.registerGame('rhythm', {
    title: 'Front Row',
    howTo: [
      'Tap a lane as its note reaches the rail. Keys: J K L, A S D, or the arrows.',
      'Hits keep the crowd with you. Misses and wild taps lose them.',
      'Finish the song above the accuracy shown up top.',
    ],
    defaults: {
      bpm: 96,             // tempo of the tune (about 40 seconds of notes)
      approach: 1.7,       // seconds a note takes to roll from the stage to the rail (at the start)
      tempoRamp: 0.22,     // the song ends this much faster than it starts (0.22 = 22% faster)
      approachRamp: 0.25,  // notes fall this much faster by the end of the song
      fills: 2,            // extra off-beat notes per bar in the second half (0 = melody only)
      perfect: 0.06,       // timing window either side of the beat for Perfect (seconds)
      good: 0.13,          // ...and for Good; anything later is a Miss
      goodCredit: 0.75,    // a Good counts this much toward accuracy (Perfect = 1)
      passAccuracy: 0.8,   // accuracy needed at the end of the song
      latency: 0.03,       // allowance for touch-screen lag, taken off every tap (seconds)
      crowdStart: 50,      // crowd meter (0-100) at the start; empty = lose
      crowdPerfect: 4,
      crowdGood: 2,
      crowdMiss: 10,
      crowdStray: 3,       // a tap with no note near it
      eased: { bpm: 84, approach: 2.0, tempoRamp: 0.1, approachRamp: 0.1, fills: 1, perfect: 0.075, good: 0.16, passAccuracy: 0.65, crowdStart: 60, crowdMiss: 8, crowdStray: 2 },
    },

    async start(stage, ctx) {
      const { util, signal, sound } = ctx;
      const P = ctx.params;
      const rm = !!ctx.reducedMotion;
      const { clamp, lerp } = util;
      const pal = ctx.palette;
      const D = rgb(pal.dark ? pal.paper : pal.ink);   // night
      const L = rgb(pal.dark ? pal.ink : pal.card);    // light
      const K = { gold: rgb(pal.gold), route: rgb(pal.route), shield: rgb(pal.shield), park: rgb(pal.park), card: rgb(pal.card), ink: rgb(pal.ink) };
      const LANE = [K.route, K.gold, K.shield].map((c) => (pal.dark ? c : mix(c, L, 0.22)));

      const PRE = 0.5;

      const cv = util.makeCanvas(stage, { signal });
      const g = cv.g;
      const hud = util.hud(stage, [
        { key: 'acc', label: 'Need ' + Math.round(P.passAccuracy * 100) + '%', value: '100%' },
        { key: 'combo', label: 'Streak', value: '0' },
      ]);
      const hudItem = hud.el.firstChild;
      const hudH = (hudItem && hudItem.offsetHeight) || 42;
      const hudW = (hudItem && hudItem.offsetWidth) || 72;

      const st = {
        perfect: 0, good: 0, miss: 0, stray: 0, combo: 0, best: 0, crowd: P.crowdStart,
        press: [0, 0, 0], burst: [0, 0, 0], ghost: [0, 0, 0], pops: [], confetti: [], sweep: 0,
        ended: null, endedAt: 0, why: '', lastNow: 0, count: -1, shownAcc: '', shownCombo: '',
      };
      let W = 1, H = 1, G = null, bg = null;
      let t0 = 0, started = false, pausedAt = 0;
      const songAt = (ms) => (started ? (ms - t0) / 1000 - PRE : -PRE);

      /* ---------------------------------------------------------- geometry */
      const bAt = (k, y) => { const u = (y - G.laneTop) / (G.hitY - G.laneTop); return W * (TX[k] + (BX[k] - TX[k]) * u); };
      const laneC = (i, y) => (bAt(i, y) + bAt(i + 1, y)) / 2;
      const laneW = (i, y) => bAt(i + 1, y) - bAt(i, y);
      const yOf = (u) => G.laneTop + (G.hitY - G.laneTop) * (u <= 1 ? u * (0.55 + 0.45 * u) : 1 + (u - 1) * 1.45);
      const noteR = (y) => Math.min(laneW(1, y) * 0.34, 44);

      function layout() {
        W = cv.w; H = cv.h;
        G = {
          trussY: Math.max(H * 0.1, hudH + 26),
          floorTop: H * 0.265, lip: H * 0.33, face: H * 0.365,
          hitY: H * 0.8,
        };
        G.laneTop = G.face;
        G.cans = [0.1, 0.3, 0.5, 0.7, 0.9].map((x, i) => ({ x: W * x, y: G.trussY + 9, aim: [0.24, 0.4, 0.5, 0.6, 0.76][i], c: [K.gold, K.route, L, mix(K.shield, L, 0.35), K.gold][i] }));
        G.heads = [
          { x: -0.03, r: 0.13, dy: 0.0, phone: 1 },
          { x: 0.17, r: 0.085, dy: 0.014 },
          { x: 0.34, r: 0.095, dy: 0.004, phone: -1 },
          { x: 0.51, r: 0.08, dy: 0.02 },
          { x: 0.68, r: 0.095, dy: 0.006, phone: 1 },
          { x: 0.85, r: 0.088, dy: 0.012 },

      /* ---------------------------------------------------------- the venue, painted once */
      function paintBackdrop(x) {
        const R = util.seeded(96);

        let gr = x.createLinearGradient(0, 0, 0, G.lip);
        gr.addColorStop(0, col(mix(D, BLACK, 0.3))); gr.addColorStop(1, col(mix(D, K.shield, 0.32)));

          const fg = x.createLinearGradient(fx, 0, fx + fw, 0);
          fg.addColorStop(0, col(L, 0)); fg.addColorStop(0.5, col(L, 0.05)); fg.addColorStop(1, col(L, 0));

        }

        const mx = W * 0.5, my = G.trussY + (G.floorTop - G.trussY) * 0.45, mr = Math.min(W * 0.15, (G.floorTop - G.trussY) * 0.42);
        const mg = x.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 1.9);

          if (Math.hypot(sx - mx, sy - my) < mr * 1.3) continue;

        }

        const ty = G.trussY;
        x.strokeStyle = col(mix(L, D, 0.5)); x.lineWidth = 2;
        x.beginPath(); x.moveTo(0, ty - 5); x.lineTo(W, ty - 5); x.moveTo(0, ty + 5); x.lineTo(W, ty + 5); x.stroke();
        x.lineWidth = 1; x.beginPath();
        for (let i = 0; i * 10 < W; i++) { x.moveTo(i * 10, ty - 5); x.lineTo(i * 10 + 5, ty + 5); x.lineTo(i * 10 + 10, ty - 5); }
        x.stroke();
        G.cans.forEach((c) => {
          x.fillStyle = col(mix(D, L, 0.22));

          x.restore();
        });
        // stage floor with boards
        x.fillStyle = col(mix(D, L, 0.09));
        x.fillRect(0, G.floorTop, W, G.lip - G.floorTop);
        x.strokeStyle = col(L, 0.06); x.lineWidth = 1;
        for (let i = -6; i <= 6; i++) { x.beginPath(); x.moveTo(W / 2 + i * W * 0.06, G.floorTop); x.lineTo(W / 2 + i * W * 0.1, G.lip); x.stroke(); }
        // drum riser and kit

        x.fillStyle = col(mix(D, L, 0.14)); x.fillRect(rz - W * 0.17, rTop, W * 0.34, H * 0.02);

        [[-0.13, -0.06], [0.13, -0.075], [-0.07, -0.03]].forEach(([dx, dy]) => {
          x.beginPath(); x.moveTo(rz + dx * W, rTop); x.lineTo(rz + dx * W, rTop + dy * H); x.stroke();
          x.fillStyle = col(K.gold, 0.75);

        x.beginPath(); x.arc(rz, rTop - kr * 0.05, kr, 0, Math.PI * 2); x.fill();
        x.fillStyle = col(mix(L, D, 0.15));
        x.beginPath(); x.arc(rz, rTop - kr * 0.05, kr * 0.8, 0, Math.PI * 2); x.fill();
        x.strokeStyle = col(K.gold); x.lineWidth = 2;
        x.beginPath(); x.arc(rz, rTop - kr * 0.05, kr * 0.58, 0, Math.PI * 2); x.stroke();
        // amp stacks

            const px = sx + Math.sin(ang) * len, py = sy - Math.cos(ang) * len;
            const pr = Math.min(r, W * 0.09);
            g.strokeStyle = col(dark); g.lineWidth = pr * 0.26; g.lineCap = 'round';
            g.beginPath(); g.moveTo(sx, sy); g.lineTo(px, py + pr * 0.15); g.stroke();
            g.save(); g.translate(px, py); g.rotate(ang);
            g.fillStyle = col(dark);
            g.fillRect(-pr * 0.22, -pr * 0.42, pr * 0.44, pr * 0.76);
            g.fillStyle = col(mix(L, K.shield, 0.12), 0.8);
            g.fillRect(-pr * 0.16, -pr * 0.36, pr * 0.32, pr * 0.54);
            g.fillStyle = col(K.gold);
            g.beginPath(); g.arc(0, -pr * 0.3, pr * 0.05, 0, Math.PI * 2); g.fill();
            g.restore();
            g.globalCompositeOperation = 'lighter';
            const fl = g.createRadialGradient(px, py - pr * 0.25, 1, px, py - pr * 0.25, pr * 1.15);
            fl.addColorStop(0, col(L, 0.2)); fl.addColorStop(1, col(L, 0));
            g.fillStyle = fl; g.fillRect(px - pr * 1.2, py - pr * 1.4, pr * 2.4, pr * 2.4);
            g.globalCompositeOperation = 'source-over';
          }
          g.fillStyle = col(dark);
          g.beginPath(); g.ellipse(hx, H + r * 0.45, r * 1.5, r * 0.75, 0, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.arc(hx, hy, r, 0, Math.PI * 2); g.fill();
          g.strokeStyle = col(L, 0.14); g.lineWidth = 2;
          g.beginPath(); g.arc(hx, hy, r - 1, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
        });
      }
      function drawPads() {
        for (let i = 0; i < 3; i++) {
          const p = st.press[i];
          if (p <= 0) continue;
          g.fillStyle = col(LANE[i], 0.22 * p);
          g.beginPath();
          g.moveTo(bAt(i, G.hitY), G.hitY); g.lineTo(bAt(i + 1, G.hitY), G.hitY);
          g.lineTo(bAt(i + 1, H), H); g.lineTo(bAt(i, H), H); g.closePath(); g.fill();
        }
      }
      function drawPops() {
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
        st.pops.forEach((p) => {
          const a = clamp(p.life / 0.3, 0, 1);
          const x = laneC(p.lane, G.hitY), y = G.hitY - noteR(G.hitY) - 16 - (0.62 - p.life) * 42;
          g.font = util.font('sign', p.text === 'PERFECT' ? 17 : 16, 900);
          g.lineWidth = 4; g.strokeStyle = col(mix(D, BLACK, 0.3), a * 0.9);
          g.strokeText(p.text, x, y);
          g.fillStyle = col(p.color, a); g.fillText(p.text, x, y);
          if (p.sub) {
            g.font = util.font('hand', 18, 700);
            g.strokeText(p.sub, x, y + 16); g.fillStyle = col(L, a * 0.9); g.fillText(p.sub, x, y + 16);
          }
        });
      }
      function drawMeter(now) {
        const gap = 10;
        const mw = Math.min(230, W - 2 * (8 + hudW + gap));
        if (mw < 80) return;
        const mx = (W - mw) / 2, my = 8, mh = hudH;
        g.fillStyle = col(K.card); g.strokeStyle = col(K.ink); g.lineWidth = 2;
        g.beginPath(); if (g.roundRect) g.roundRect(mx + 1, my + 1, mw - 2, mh - 2, 4); else g.rect(mx + 1, my + 1, mw - 2, mh - 2);
        g.fill(); g.stroke();
        const segs = 10, pad = 8, sh = Math.max(8, mh * 0.34);
        const sw = (mw - pad * 2 - (segs - 1) * 3) / segs;
        const lit = Math.round(st.crowd / 10);
        const low = st.crowd < 25;
        const blink = low && !rm ? 0.55 + 0.45 * Math.sin(now / 90) : 1;
        for (let i = 0; i < segs; i++) {
          const on = i < lit;
          const c = low ? K.route : i < 4 ? K.gold : K.park;
          g.fillStyle = on ? col(c, blink) : col(K.ink, 0.12);
          g.fillRect(mx + pad + i * (sw + 3), my + 6, sw, sh);
        }
        g.fillStyle = col(mix(K.ink, K.card, 0.35));
        g.font = util.font('sign', 9.5, 800);
        g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        g.fillText('C R O W D', W / 2, my + mh - 6);
      }
      function drawConfetti(dt) {
        st.confetti.forEach((c) => {
          c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt;
          g.save(); g.translate(c.x, c.y); g.rotate(c.r);
          g.fillStyle = col(c.c, 0.9); g.fillRect(-c.w / 2, -2, c.w, 4);
          g.restore();
        });
      }
      function draw(s, now, dt) {
        const beats = Math.max(0, s - BAR) / spb;
        g.drawImage(bg, 0, 0, W, H);
        drawLights(s, beats, now);
        drawDashes(s);
        drawRings();
        drawNotes(s);
        drawCrowd(beats, now);
        drawPads();
        drawPops();
        drawConfetti(dt);
        drawMeter(now);
      }
      function fade(dt) {
        for (let i = 0; i < 3; i++) {
          st.press[i] = Math.max(0, st.press[i] - dt * 5);
          st.burst[i] = Math.max(0, st.burst[i] - dt * 3.2);
          st.ghost[i] = Math.max(0, st.ghost[i] - dt * 4);
        }
        st.pops.forEach((p) => { p.life -= dt; });
        st.pops = st.pops.filter((p) => p.life > 0);
      }

      /* ---------------------------------------------------------- input */
      const stamp = (e) => { const now = performance.now(); const ts = e.timeStamp; return ts > 0 && Math.abs(now - ts) < 1000 ? ts : now; };
      function laneAt(clientX) {
        const r = cv.canvas.getBoundingClientRect();
        const x = (clientX - r.left) * (W / (r.width || 1));
        return x < W * BX[1] ? 0 : x < W * BX[2] ? 1 : 2;
      }
      stage.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); tap(laneAt(e.clientX), stamp(e)); }, { signal });
      window.addEventListener('keydown', (e) => {
        if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        const lane = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
        if (lane == null) return;
        e.preventDefault();
        tap(lane, stamp(e));
      }, { signal });
      document.addEventListener('visibilitychange', () => {
        if (!started || st.ended) return;
        if (document.hidden) {
          if (!pausedAt) { pausedAt = performance.now(); stopAll(0.05); }
        } else if (pausedAt) {
          t0 += performance.now() - pausedAt;
          pausedAt = 0;
          off = null;
          const s = songAt(performance.now());
          while (evIdx > 0 && events[evIdx - 1].t > s) evIdx--;
          while (evIdx < events.length && events[evIdx].t < s) evIdx++;
          st.lastNow = performance.now();
        }
      }, { signal });

      /* ---------------------------------------------------------- run */
      layout();
      cv.onResize = () => { layout(); draw(songAt(performance.now()), performance.now(), 0); };
      if (ctx.debug) {
        SCQ.test.rhythm = {
          params: P,
          now: () => songAt(performance.now()),
          notes: () => notes.map((n) => ({ t: n.t, lane: n.lane, res: n.res })),
          stats: () => ({ perfect: st.perfect, good: st.good, miss: st.miss, stray: st.stray, crowd: st.crowd, accuracy: accuracy(), total: notes.length, ended: st.ended, why: st.why, combo: st.combo, best: st.best }),
          tapPoint: (i) => { const r = cv.canvas.getBoundingClientRect(); return { x: r.left + laneC(i, G.hitY) * r.width / W, y: r.top + (G.hitY + H * 0.08) * r.height / H }; },
          audio: () => ({ live: live.size, bus: !!bus, busOn, scheduled: evIdx, events: events.length, dead }),
        };
      }
      draw(-PRE, performance.now(), 0);

      return new Promise((resolve) => {
        t0 = performance.now(); started = true; st.lastNow = t0;
        util.loop(() => {
          if (pausedAt) return true;
          const now = performance.now();
          const dt = Math.min(0.05, Math.max(0, (now - st.lastNow) / 1000)); st.lastNow = now;
          const s = st.ended ? st.endS : songAt(now);
          if (!st.ended) {
            pump(s);
            sweep(s);
            countIn(s);
            if (st.crowd <= 0) finish('lose', 'crowd');
            else if (s >= endAt) finish(accuracy() >= P.passAccuracy ? 'win' : 'lose', 'song');
          }
          fade(dt);
          draw(s, now, dt);
          if (st.ended && now - st.endedAt > 1500) { resolve(st.ended); return false; }
          return true;
        }, signal);
      });
    },
  });
})();

<script>/* games/sneak.js */
/* Stella's Cozy Quest - minigame "Sneak Out" (Poquoson, Fourth of July).
   Turn-based stealth on a backyard grid: reach Micah's car without ending a turn in anyone's sightline. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ------------------------------------------------------------------ rules (pure; the test solver uses these too) */
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // N E S W
  const DIRCH = { N: 0, E: 1, S: 2, W: 3 };
  const BLOCK = 'FTRCBHK'; // fence, picnic table, grill, cooler, cornhole board, shrub, fire pit

  // Map legend: G gate to the street (goal), S start by the back door, . lawn, plus BLOCK tiles.
  // Guests either stand and turn through `look` every `every` turns, or walk a `path` (back and forth, or `loop`).
  // `ease` lists the guests who go home first in eased mode.
  const LEVELS = [
    {
      name: 'Cornhole showdown',
      map: [
        'FFFFGFF',
        '.......',
        '.TT..R.',
        '.......',
        'B.....B',
        '.......',
        '.C..TT.',
        '.......',
        '.......',
        'H..S..H',
      ],
      guests: [
        { at: [1, 4], look: 'E' },
        { at: [5, 4], look: 'W' },
        { at: [5, 3], look: 'NW', every: 3 },
        { path: [[0, 7], [1, 7], [2, 7], [3, 7]] },
        { at: [6, 8], look: 'WN', every: 2 },
        { at: [2, 1], look: 'ESWN', every: 2 },
      ],
      ease: [3, 5],
    },
    {
      name: 'Picnic row',
      map: [
        'FGFFFFF',
        '.......',
        '..TT.TT',
        '.......',
        '...C...',
        '.......',
        'TT...TT',
        '.......',
        '.......',
        'H...S.H',
      ],
      guests: [
        { path: [[2, 3], [3, 3], [4, 3], [5, 3], [6, 3]] },
        { at: [3, 5], look: 'NESW', every: 2 },
        { at: [0, 4], look: 'E' },
        { at: [6, 4], look: 'W' },
        { at: [3, 8], look: 'WE', every: 3 },
        { at: [0, 1], look: 'ES', every: 2 },
      ],
      ease: [1, 4],
    },
    {
      name: 'Fire pit',
      map: [
        'FFGFFFF',
        '.......',
        '.TT..H.',
        '.......',
        '...K...',
        '.......',
        'C.....H',
        '.......',
        '.TT....',
        'H....SH',
      ],
      guests: [
        { path: [[2, 3], [3, 3], [4, 3], [4, 4], [4, 5], [3, 5], [2, 5], [2, 4]], loop: true },
        { path: [[2, 3], [3, 3], [4, 3], [4, 4], [4, 5], [3, 5], [2, 5], [2, 4]], loop: true, offset: 4 },
        { at: [6, 7], look: 'WN', every: 3 },
        { at: [0, 1], look: 'ES', every: 3 },
        { path: [[1, 7], [2, 7], [3, 7]] },
        { at: [6, 1], look: 'WS', every: 2, offset: 1 },
      ],
      ease: [4, 5],
    },
  ];

  function parse(level) {
    const rows = level.map.length, cols = level.map[0].length;
    let start = null, goal = null;
    level.map.forEach((row, y) => row.split('').forEach((ch, x) => {
      if (ch === 'S') start = { x, y };
      if (ch === 'G') goal = { x, y };
    }));
    const guests = level.guests.map((g) => (g.path
      ? { path: g.path.map(([x, y]) => ({ x, y })), loop: !!g.loop, offset: g.offset || 0 }
      : { x: g.at[0], y: g.at[1], look: g.look.split('').map((c) => DIRCH[c]), every: g.every || 0, offset: g.offset || 0 }));
    return { cols, rows, start, goal, map: level.map, guests };
  }
  const chAt = (L, x, y) => (x < 0 || y < 0 || x >= L.cols || y >= L.rows ? 'F' : L.map[y][x]);
  const blocks = (L, x, y) => BLOCK.includes(chAt(L, x, y));
  function pingpong(k, n) { const p = 2 * (n - 1); k = ((k % p) + p) % p; return k < n ? k : p - k; }
  function guestAt(g, t) {
    if (g.path) {
      const n = g.path.length;
      const ix = (k) => (g.loop ? ((k % n) + n) % n : pingpong(k, n));
      const a = g.path[ix(t + g.offset)], b = g.path[ix(t + g.offset + 1)];
      const d = b.x > a.x ? 1 : b.x < a.x ? 3 : b.y > a.y ? 2 : 0;
      return { x: a.x, y: a.y, d };
    }
    const k = g.every ? Math.floor((t + g.offset) / g.every) : 0;
    return { x: g.x, y: g.y, d: g.look[k % g.look.length] };
  }
  function period(g) { return g.path ? (g.loop ? g.path.length : 2 * (g.path.length - 1)) : (g.every ? g.every * g.look.length : 1); }
  const isFireworks = (t, K) => K > 0 && t > 0 && t % K === 0;
  function sightOf(L, g, t, R) {
    const p = guestAt(g, t), out = [];
    for (let i = 1; i <= R; i++) {
      const x = p.x + DX[p.d] * i, y = p.y + DY[p.d] * i;
      if (blocks(L, x, y)) break;
      out.push({ x, y });
    }
    return out;
  }
  const occupied = (guests, t, x, y) => guests.some((g) => { const p = guestAt(g, t); return p.x === x && p.y === y; });
  // One turn: Stella moves (a = 0..3) or waits (a = -1), then everyone takes their turn, then sightlines are checked.
  function step(L, guests, st, a, P) {
    let x = st.x, y = st.y;
    if (a >= 0) {
      x += DX[a]; y += DY[a];
      if (blocks(L, x, y) || occupied(guests, st.t, x, y)) return null;
    }
    const t = st.t + 1;
    if (x === L.goal.x && y === L.goal.y) return { x, y, t, won: true };
    for (let i = 0; i < guests.length; i++) { const p = guestAt(guests[i], t); if (p.x === x && p.y === y) return { x, y, t, caught: i }; }
    if (!isFireworks(t, P.fireworksEvery)) {
      for (let i = 0; i < guests.length; i++) if (sightOf(L, guests[i], t, P.sight).some((q) => q.x === x && q.y === y)) return { x, y, t, caught: i };
    }
    return { x, y, t };
  }
  function activeGuests(L, level, eased, drop) {
    const gone = eased ? (level.ease || []).slice(0, drop) : [];
    return L.guests.filter((g, i) => !gone.includes(i));
  }
  const sim = { LEVELS, parse, guestAt, period, isFireworks, sightOf, step, blocks, activeGuests, DX, DY };

  /* ------------------------------------------------------------------ color helpers */
  function rgb(c) {
    c = String(c || '').trim();
    if (c[0] === '#') {
      if (c.length === 4) c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
      return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    }
    const m = c.match(/[\d.]+/g);
    return m && m.length >= 3 ? m.slice(0, 3).map(Number) : [128, 128, 128];
  }
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
  const rgba = (c, a) => { const A = rgb(c); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
  const dirAngle = (d) => (d - 1) * Math.PI / 2;

  SCQ.registerGame('sneak', {
    title: 'Sneak Out',
    howTo: [
      'Tap a square next to Stella (or swipe) to move one step. Tap Stella to wait a turn.',
      'Everyone takes a turn after you. End your turn in a sightline and you are caught.',
      'Fireworks blind the whole party for one turn.',
    ],
    defaults: {
      sight: 3,            // tiles a guest can see down their sightline
      fireworksEvery: 6,   // a fireworks turn every N turns
      preview: false,      // dotted outlines of next turn's sightlines
      dropGuests: 0,       // guests who went home (from each level's `ease` list)
      eased: { preview: true, dropGuests: 2 },
    },
    sim,
    start(stage, ctx) {
      const U = ctx.util, P = ctx.params, pal = ctx.palette, signal = ctx.signal, snd = ctx.sound;
      const dark = !!pal.dark;
      return new Promise((resolve) => {
        /* ---------- level */
        let wins = 0;
        try { wins = (SCQ.Store && SCQ.Store.state && SCQ.Store.state.wins && SCQ.Store.state.wins.sneak) || 0; } catch (e) { wins = 0; }
        let lvIdx = ((ctx.attempt || 1) - 1 + wins) % LEVELS.length;
        if (ctx.debug && SCQ.test && Number.isInteger(SCQ.test.sneakLevel)) lvIdx = SCQ.test.sneakLevel % LEVELS.length;
        const level = LEVELS[lvIdx];
        const L = parse(level);
        const guests = activeGuests(L, level, ctx.eased, P.dropGuests || 0);
        const K = P.fireworksEvery;

        /* ---------- canvas + colors */
        const cv = U.makeCanvas(stage, { signal });
        const g = cv.g;
        const col = {
          lawn: dark ? mix(pal.paper, pal.park, 0.2) : mix(pal.paper, pal.park, 0.42),
          lawn2: dark ? mix(pal.paper, pal.park, 0.26) : mix(pal.paper, pal.park, 0.5),
          yardSide: dark ? mix(pal.paper, pal.park, 0.12) : mix(pal.paper, pal.park, 0.3),
          water: dark ? mix(pal.paper, pal.water, 0.55) : mix(pal.paper, pal.water, 0.7),
          asphalt: dark ? '#121219' : mix(pal.ink, pal.paper, 0.22),
          walk: dark ? mix(pal.paper2, pal.ink, 0.08) : pal.paper2,
          wood: dark ? '#7a5a3a' : '#b88a52',
          woodDark: dark ? '#4e3925' : '#8a6238',
          roof: dark ? '#3a2e2c' : mix(pal.route, pal.ink, 0.35),
          beam: dark ? '#ffe7a3' : mix(pal.gold, pal.route, 0.3),
          line: dark ? pal.ink : pal.ink,
          cream: '#fbf4e2',
        };
        const SHIRTS = [pal.shield, pal.park, pal.gold, '#7a5ba3', '#2f7f86', mix(pal.route, pal.gold, 0.5), '#5a6b7d'];
        const SKIN = ['#e9c09a', '#c98e62', '#8d5a3b', '#f2d0b0', '#b07850', '#6e452e', '#dcae86'];
        const HATS = [['#b3362b', '#fbf4e2'], ['#22477e', '#fbf4e2'], ['#b3362b', '#22477e'], ['#c98f22', '#b3362b'], ['#22477e', '#c98f22'], ['#fbf4e2', '#b3362b'], ['#56763a', '#fbf4e2']];

        /* ---------- state */
        let st = { x: L.start.x, y: L.start.y, t: 0 };
        let over = false, animT = 0, queued = null, moves = 0, time = 0;
        const stella = { fx: st.x, fy: st.y, ang: -Math.PI / 2, bump: 0, alpha: 1 };
        const gv = guests.map((gu, i) => {
          const p = guestAt(gu, 0);
          return { fx: p.x, fy: p.y, ang: dirAngle(p.d), len: sightOf(L, gu, 0, P.sight).length, shirt: SHIRTS[(i + lvIdx * 2) % SHIRTS.length], skin: SKIN[(i * 3 + lvIdx) % SKIN.length], hat: HATS[(i + lvIdx) % HATS.length] };
        });
        let catcher = -1, caughtT = 0, winT = -1, flash = 0, fwShow = 0;
        const sparks = [], rings = [];
        let carX = 0;

        /* ---------- layout */
        let W = 0, H = 0, T = 40, ox = 0, oy = 0, gw = 0, gh = 0, streetTop = 0, streetH = 0, houseTop = 0, bg = null;
        function layout() {
          W = cv.w; H = cv.h;
          const hudSpace = 54;
          T = Math.floor(Math.min((W - 20) / L.cols, (H - hudSpace - 8) / (L.rows + 2.25)));
          T = Math.max(26, T);
          gw = T * L.cols; gh = T * L.rows;
          streetH = Math.round(T * 1.25);
          const minHouse = Math.round(T * 1.0);
          const free = H - (streetH + gh + minHouse);
          streetTop = Math.round(Math.max(hudSpace, Math.min(free, hudSpace + T * 0.9)));
          oy = streetTop + streetH;
          ox = Math.round((W - gw) / 2);
          houseTop = oy + gh;
          carX = ox + (L.goal.x + 0.5) * T;
          bg = buildBg();
        }
        const cx = (x) => ox + (x + 0.5) * T;
        const cy = (y) => oy + (y + 0.5) * T;

        /* ---------- static background (cached) */
        function buildBg() {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(W * cv.dpr)); c.height = Math.max(1, Math.round(H * cv.dpr));
          const b = c.getContext('2d');
          b.setTransform(cv.dpr, 0, 0, cv.dpr, 0, 0);
          drawStatic(b);
          return c;
        }
        function drawStatic(b) {
          b.fillStyle = pal.paper; b.fillRect(0, 0, W, H);
          // water band: the river behind the street
          b.fillStyle = col.water; b.fillRect(0, 0, W, streetTop);
          b.strokeStyle = rgba(pal.shield, dark ? 0.45 : 0.35); b.lineWidth = 1.3;
          for (let y = 14, row = 0; y < streetTop - 16; y += 15, row++) {
            for (let x = (row % 2) * 22 + 6; x < W; x += 44) {
              b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x + 5, y - 4, x + 10, y); b.quadraticCurveTo(x + 15, y + 4, x + 20, y); b.stroke();
            }
          }
          b.fillStyle = rgba(pal.shield, dark ? 0.85 : 0.75);
          b.font = 'italic 400 13px ' + U.FONTS.story; b.textAlign = 'center'; b.textBaseline = 'middle';

          g.beginPath(); g.moveTo(x, y + s * 0.9);
          g.bezierCurveTo(x - s * 1.4, y, x - s * 0.7, y - s * 1.1, x, y - s * 0.35);
          g.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y, x, y + s * 0.9);
          g.fill(); g.stroke();
        }
        function beamShape(x, y, ang, len, alpha) {
          if (len <= 0.02) return;
          g.save(); g.translate(x, y); g.rotate(ang);
          const Lx = (len + 0.42) * T, w0 = 0.1 * T, w1 = 0.44 * T;
          const grad = g.createLinearGradient(0.2 * T, 0, Lx, 0);
          grad.addColorStop(0, rgba(col.beam, (dark ? 0.5 : 0.62) * alpha)); grad.addColorStop(1, rgba(col.beam, (dark ? 0.1 : 0.16) * alpha));
          g.fillStyle = grad;
          g.beginPath(); g.moveTo(0.2 * T, -w0); g.lineTo(Lx, -w1); g.quadraticCurveTo(Lx + 0.14 * T, 0, Lx, w1); g.lineTo(0.2 * T, w0); g.closePath(); g.fill();
          g.restore();
        }
        function figure(x, y, ang, o) {
          const s = T;
          g.save(); g.translate(x, y);
          g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(2, 3, s * 0.27, s * 0.24, 0, 0, Math.PI * 2); g.fill();
          g.rotate(ang);
          if (o.stella) {
            g.fillStyle = '#6b3f22'; // hair flowing behind
            g.beginPath(); g.ellipse(-s * 0.1, 0, s * 0.19, s * 0.13, 0, 0, Math.PI * 2); g.fill();
          }
          // arms + cup
          g.fillStyle = o.skin; g.strokeStyle = '#1a1410'; g.lineWidth = 1.2;
          if (!o.stella) cup(g, s * 0.22, s * 0.2, s * 0.065);
          g.beginPath(); g.arc(s * 0.12, -s * 0.22, s * 0.06, 0, Math.PI * 2); g.fill(); g.stroke();
          g.beginPath(); g.arc(s * 0.12, s * 0.22, s * 0.06, 0, Math.PI * 2); g.fill(); g.stroke();
          // shoulders
          g.fillStyle = o.shirt; g.beginPath(); g.ellipse(0, 0, s * 0.15, s * 0.25, 0, 0, Math.PI * 2); g.fill(); g.stroke();
          if (o.stella) { // dress dots
            g.fillStyle = '#b3362b';
            for (const [dx, dy] of [[-0.05, -0.14], [0.05, 0.12], [-0.06, 0.05], [0.06, -0.04]]) { g.beginPath(); g.arc(dx * s, dy * s, s * 0.022, 0, Math.PI * 2); g.fill(); }
          }
          // head
          g.fillStyle = o.skin; g.beginPath(); g.arc(s * 0.03, 0, s * 0.12, 0, Math.PI * 2); g.fill(); g.stroke();
          g.beginPath(); g.arc(s * 0.15, 0, s * 0.03, 0, Math.PI * 2); g.fill();
          if (o.stella) {
            g.fillStyle = '#6b3f22'; g.beginPath(); g.arc(s * 0.0, 0, s * 0.115, Math.PI * 0.55, Math.PI * 1.45); g.fill();
          } else if (o.lookUp) { // face up at the sky
            g.restore(); g.save(); g.translate(x, y);
            g.fillStyle = o.skin; g.strokeStyle = '#1a1410'; g.beginPath(); g.arc(0, 0, s * 0.13, 0, Math.PI * 2); g.fill(); g.stroke();
            g.fillStyle = '#1a1410';
            g.beginPath(); g.arc(-s * 0.045, -s * 0.03, s * 0.018, 0, Math.PI * 2); g.arc(s * 0.045, -s * 0.03, s * 0.018, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.ellipse(0, s * 0.05, s * 0.03, s * 0.035, 0, 0, Math.PI * 2); g.fill();
          } else if (o.hat) { // party hat seen from above
            const r = s * 0.1;
            for (let i = 0; i < 6; i++) { g.fillStyle = o.hat[i % 2]; g.beginPath(); g.moveTo(s * 0.02, 0); g.arc(s * 0.02, 0, r, i * Math.PI / 3, (i + 1) * Math.PI / 3); g.closePath(); g.fill(); }
            g.strokeStyle = '#1a1410'; g.lineWidth = 1; g.beginPath(); g.arc(s * 0.02, 0, r, 0, Math.PI * 2); g.stroke();
            g.fillStyle = '#c98f22'; g.beginPath(); g.arc(s * 0.02, 0, s * 0.035, 0, Math.PI * 2); g.fill();
          }
          g.restore();
        }
        function turnArrow(x, y, a0, a1) {
          let d = a1 - a0; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
          if (Math.abs(d) < 0.01) return;
          const r = T * 0.36, sgn = Math.sign(d), a = a0 + sgn * 0.25, b = a0 + d * 0.85;
          g.strokeStyle = dark ? 'rgba(239,227,200,.9)' : 'rgba(42,34,28,.85)'; g.lineWidth = 2; g.lineCap = 'round';
          g.beginPath(); g.arc(x, y, r, Math.min(a, b), Math.max(a, b)); g.stroke();
          const ex = x + Math.cos(b) * r, ey = y + Math.sin(b) * r, ta = b + sgn * Math.PI / 2;
          g.fillStyle = g.strokeStyle;
          g.beginPath(); g.moveTo(ex + Math.cos(ta) * 5, ey + Math.sin(ta) * 5); g.lineTo(ex + Math.cos(ta + 2.4) * 5, ey + Math.sin(ta + 2.4) * 5); g.lineTo(ex + Math.cos(ta - 2.4) * 5, ey + Math.sin(ta - 2.4) * 5); g.closePath(); g.fill();
        }
        function bubble(x, y, text) {
          g.font = U.font('hand', Math.round(Math.max(18, T * 0.42)), 700);
          const tw = g.measureText(text).width, pw = tw + 22, ph = Math.max(34, T * 0.7);
          let bx = Math.max(8, Math.min(W - 8 - pw, x - pw / 2)), by = y - T * 0.55 - ph;
          if (by < 56) by = y + T * 0.55;
          g.fillStyle = col.cream; g.strokeStyle = '#1a1410'; g.lineWidth = 2;
          g.beginPath(); g.roundRect ? g.roundRect(bx, by, pw, ph, 10) : g.rect(bx, by, pw, ph); g.fill(); g.stroke();
          const tx = Math.max(bx + 14, Math.min(bx + pw - 14, x)), up = by > y;
          g.beginPath(); g.moveTo(tx - 7, up ? by + 1 : by + ph - 1); g.lineTo(x, up ? by - 10 : by + ph + 10); g.lineTo(tx + 7, up ? by + 1 : by + ph - 1); g.fill();
          g.beginPath(); g.moveTo(tx - 7, up ? by : by + ph); g.lineTo(x, up ? by - 10 : by + ph + 10); g.lineTo(tx + 7, up ? by : by + ph); g.stroke();
          g.fillStyle = '#b3362b'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, bx + pw / 2, by + ph / 2 + 1);
        }
        function chevron(x, y, d, a) {
          g.save(); g.translate(x, y); g.rotate(dirAngle(d));
          g.strokeStyle = rgba(dark ? '#efe3c8' : pal.ink, a); g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round';
          g.beginPath(); g.moveTo(-T * 0.06, -T * 0.11); g.lineTo(T * 0.06, 0); g.lineTo(-T * 0.06, T * 0.11); g.stroke();
          g.restore();
        }

        function draw() {
          if (!bg) return;
          g.setTransform(cv.dpr, 0, 0, cv.dpr, 0, 0);
          g.clearRect(0, 0, W, H);
          g.drawImage(bg, 0, 0, W, H);
          const fwNow = isFireworks(st.t, K);
          // sightlines
          if (!fwNow) {
            guests.forEach((gu, i) => {
              const tiles = sightOf(L, gu, st.t, P.sight);
              const hot = over && catcher === i;
              tiles.forEach((q) => {
                g.fillStyle = rgba(hot ? '#e0544a' : col.beam, hot ? 0.4 : (dark ? 0.13 : 0.2));
                g.fillRect(ox + q.x * T + 1, oy + q.y * T + 1, T - 2, T - 2);
              });
            });
            gv.forEach((v, i) => beamShape(ox + (v.fx + 0.5) * T, oy + (v.fy + 0.5) * T, v.ang, v.len, catcher === i ? 1.25 : 1));
          }
          if (P.preview && !over && !isFireworks(st.t + 1, K)) {
            g.setLineDash([4, 4]); g.lineWidth = 1.6; g.strokeStyle = dark ? 'rgba(239,227,200,.85)' : 'rgba(42,34,28,.75)';
            guests.forEach((gu) => sightOf(L, gu, st.t + 1, P.sight).forEach((q) => g.strokeRect(ox + q.x * T + 4, oy + q.y * T + 4, T - 8, T - 8)));
            g.setLineDash([]);
          }
          flames(time);
          // where Stella can step
          if (!over && animT <= 0) {
            for (let d = 0; d < 4; d++) {
              const nx = st.x + DX[d], ny = st.y + DY[d];
              if (blocks(L, nx, ny) || occupied(guests, st.t, nx, ny)) continue;
              chevron(cx(nx), cy(ny), d, 0.3 + 0.12 * Math.sin(time * 4));
            }
          }
          // guests
          gv.forEach((v, i) => {
            const x = ox + (v.fx + 0.5) * T, y = oy + (v.fy + 0.5) * T;
            figure(x, y, v.ang, { shirt: v.shirt, skin: v.skin, hat: v.hat, lookUp: fwNow && !over });
            if (!over && !fwNow) {
              const a1 = dirAngle(guestAt(guests[i], st.t + 1).d), a0 = dirAngle(guestAt(guests[i], st.t).d);
              if (a1 !== a0) turnArrow(x, y, a0, a1);
            }
          });
          // Stella
          if (stella.alpha > 0) {
            const sx = ox + (stella.fx + 0.5) * T + Math.sin(stella.bump * 40) * stella.bump * 18, sy = oy + (stella.fy + 0.5) * T;
            g.globalAlpha = stella.alpha;
            const pulse = 0.5 + 0.5 * Math.sin(time * 3);
            g.strokeStyle = rgba(dark ? '#ffd36a' : '#b3362b', 0.55 + 0.35 * pulse); g.lineWidth = 2.5;
            g.beginPath(); g.arc(sx, sy, T * (0.38 + 0.03 * pulse), 0, Math.PI * 2); g.stroke();
            figure(sx, sy, stella.ang, { stella: true, shirt: '#fbf4e2', skin: '#e9c09a' });
            g.globalAlpha = 1;
          }
          car(time);
          stringLights(time);
          // first-turn hint on the roof
          if (moves < 4 && !over) {
            const a = 1 - moves / 4, text = 'tap a square to step, tap Stella to wait';
            g.font = U.font('hand', Math.round(Math.max(17, Math.min(22, T * 0.38))), 700);
            const tw = g.measureText(text).width + 24, th = 30;
            const hy = Math.min(H - th / 2 - 6, houseTop + T * 0.36 + (H - houseTop - T * 0.36) / 2);
            g.globalAlpha = a;
            g.fillStyle = col.cream; g.strokeStyle = '#1a1410'; g.lineWidth = 1.5;
            g.beginPath(); g.roundRect ? g.roundRect(W / 2 - tw / 2, hy - th / 2, tw, th, 4) : g.rect(W / 2 - tw / 2, hy - th / 2, tw, th); g.fill(); g.stroke();
            g.fillStyle = '#22477e'; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText(text, W / 2, hy + 1);
            g.globalAlpha = 1;
          }
          // fireworks
          if (sparks.length || rings.length) {
            g.save();
            if (dark) g.globalCompositeOperation = 'lighter';
            rings.forEach((r) => { g.strokeStyle = rgba(r.c, r.life * 0.6); g.lineWidth = 3; g.beginPath(); g.arc(r.x, r.y, r.rad, 0, Math.PI * 2); g.stroke(); });
            sparks.forEach((s) => {
              g.strokeStyle = rgba(s.c, Math.max(0, s.life)); g.lineWidth = 2.2; g.lineCap = 'round';
              g.beginPath(); g.moveTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06); g.lineTo(s.x, s.y); g.stroke();
            });
            g.restore();
          }
          if (flash > 0) { g.fillStyle = `rgba(255,248,225,${flash})`; g.fillRect(0, 0, W, H); }
          // caught
          if (catcher >= 0) {
            const v = gv[catcher], x = ox + (v.fx + 0.5) * T, y = oy + (v.fy + 0.5) * T;
            const pop = Math.min(1, caughtT / 0.18);
            g.fillStyle = '#b3362b'; g.font = U.font('mark', Math.round(T * 0.55 * pop + 1)); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
            g.fillText('!', x + T * 0.3, y - T * 0.25);
            if (caughtT > 0.2) bubble(x, y, 'Stella! Stay for one more!');
          }
        }

        /* ---------- fireworks */
        function fireworks() {
          const colors = ['#e0544a', '#86a8e3', '#ffd36a', '#fbf4e2', '#ff8fb0'];
          const n = ctx.reducedMotion ? 2 : 3;
          for (let k = 0; k < n; k++) {
            const x = W * (0.2 + 0.6 * Math.random()), y = streetTop * 0.5 + Math.random() * (gh * 0.55);
            const c = colors[(k + st.t) % colors.length];
            const count = ctx.reducedMotion ? 18 : 30;
            for (let i = 0; i < count; i++) {
              const a = i / count * Math.PI * 2 + Math.random() * 0.15, sp = T * (2.2 + Math.random() * 1.2);
              sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 + k * 0.15, c });
            }
            rings.push({ x, y, rad: 2, life: 1, c });
          }
          flash = ctx.reducedMotion ? 0.12 : (dark ? 0.42 : 0.32);
          fwShow = 1;
          U.banner(stage, 'Fireworks!', 1100);
          snd.noise(0.6, { vol: 0.35, filter: 380 });
          snd.tone(70, 0.4, { type: 'sine', vol: 0.4, slide: 40 });
          snd.noise(0.5, { vol: 0.12, filter: 4000, type: 'highpass', when: 0.18 });
        }

        /* ---------- turns */
        const timers = [];
        function later(ms, fn) { const id = setTimeout(() => { if (!signal.aborted) fn(); }, ms); timers.push(id); }
        signal.addEventListener('abort', () => timers.forEach(clearTimeout), { once: true });
        function hudFw() {
          if (isFireworks(st.t, K)) return 'BOOM';
          const n = K - (st.t % K);
          return n === 1 ? 'NEXT' : 'in ' + n;
        }
        const hud = U.hud(stage, [{ key: 'turn', label: 'Turn', value: '0' }, { key: 'fw', label: 'Fireworks', value: hudFw() }]);
        function finish(result) { if (!finish.done) { finish.done = true; resolve(result); } }

        function act(a) {
          if (over) return;
          if (animT > 0) { queued = a; return; }
          const r = step(L, guests, st, a, P);
          if (!r) { stella.bump = 0.25; snd.play('tick'); return; }
          st = { x: r.x, y: r.y, t: r.t };
          moves++;
          animT = 0.17;
          if (a >= 0) stella.ang = unwrap(stella.ang, dirAngle(a));
          guests.forEach((gu, i) => {
            const p = guestAt(gu, st.t);
            gv[i].ang = unwrap(gv[i].ang, dirAngle(p.d));
          });
          hud.set('turn', String(st.t));
          hud.set('fw', hudFw());
          if (r.won) {
            over = true; snd.play('good');
            later(170, () => { winT = 0; });
            return;
          }
          if (r.caught != null) {
            over = true; catcher = r.caught; caughtT = 0;
            later(140, () => { snd.play('bad'); });
            later(1900, () => finish('lose'));
            return;
          }
          snd.play(a < 0 ? 'tick' : 'tap');
          if (isFireworks(st.t, K)) fireworks();
        }
        // keep the drawn angle continuous so turns animate the short way round
        function unwrap(cur, target) { let d = target - cur; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return cur + d; }

        /* ---------- input */
        let down = null;
        cv.canvas.addEventListener('pointerdown', (e) => {
          down = { p: cv.toLocal(e), id: e.pointerId };
          try { cv.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        }, { signal });
        cv.canvas.addEventListener('pointerup', (e) => {
          if (!down || down.id !== e.pointerId) return;
          const p = cv.toLocal(e), d0 = down.p; down = null;
          const dx = p.x - d0.x, dy = p.y - d0.y;
          if (Math.hypot(dx, dy) > 24) { act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); return; }
          const sx = ox + (st.x + 0.5) * T, sy = oy + (st.y + 0.5) * T;
          const tx = p.x - sx, ty = p.y - sy;
          if (Math.abs(tx) < T * 0.5 && Math.abs(ty) < T * 0.5) { act(-1); return; }
          act(Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 1 : 3) : (ty > 0 ? 2 : 0));
        }, { signal });
        cv.canvas.addEventListener('pointercancel', () => { down = null; }, { signal });
        const KEYS = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3, ' ': -1, '.': -1 };
        window.addEventListener('keydown', (e) => {
          if (!(e.key in KEYS) || e.metaKey || e.ctrlKey || e.altKey) return;
          e.preventDefault();
          if (e.repeat) return;
          act(KEYS[e.key]);
        }, { signal });

        /* ---------- frame loop */
        cv.onResize = () => layout();
        layout();
        U.loop((dt) => {
          time += dt;
          const k = Math.min(1, dt * 16);
          if (animT > 0) { animT -= dt; if (animT <= 0 && queued != null && !over) { const q = queued; queued = null; animT = 0; act(q); } }
          stella.fx += (st.x - stella.fx) * k; stella.fy += (st.y - stella.fy) * k;
          stella.bump = Math.max(0, stella.bump - dt);
          guests.forEach((gu, i) => {
            const p = guestAt(gu, st.t), v = gv[i];
            v.fx += (p.x - v.fx) * k; v.fy += (p.y - v.fy) * k;

            v.ang += (tgt - v.ang) * k;
            v.len += (sightOf(L, gu, st.t, P.sight).length - v.len) * k;
          });

            const s = sparks[i];

            if (s.life <= 0) sparks.splice(i, 1);
          }
          for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.rad += T * 4 * dt; r.life -= dt * 2.2; if (r.life <= 0) rings.splice(i, 1); }

          fwShow = Math.max(0, fwShow - dt);
          if (catcher >= 0) {
            caughtT += dt;
            const v = gv[catcher];
            stella.ang = unwrap(stella.ang, Math.atan2(v.fy - st.y, v.fx - st.x));
          }
          if (winT >= 0) {
            winT += dt;
            const u = Math.min(1, winT / 0.4), carFy = (streetTop + streetH * 0.74 * 0.66 - oy) / T - 0.5;
            stella.fy = L.goal.y + u * (carFy - L.goal.y);
            stella.fx = L.goal.x;
            stella.alpha = 1 - Math.max(0, (winT - 0.3) / 0.15);
            if (winT > 0.5 && !finish.honked) { finish.honked = true; snd.play('horn'); }
            if (winT > 1.75) finish('win');
          }
          draw();
          return !finish.done;
        }, signal);

        if (ctx.debug) {
          SCQ.test = SCQ.test || {};
          SCQ.test.sneak = { level: lvIdx, guests: guests.length, eased: !!ctx.eased, geom: () => ({ ox, oy, T }), state: () => ({ x: st.x, y: st.y, t: st.t, over, busy: animT > 0 || queued != null, caught: catcher, won: winT >= 0 }) };
        }
      });
    },
  });
})();

</script>
<script>/* games/style.js */
/* Stella's Cozy Quest - minigame: Style Micah (Macy's, Newport News). */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* Paper-doll colors: real clothing colors, so they read the same in light and dark mode. */
  const LOOK = {
    skin: '#e8b48e', skinShade: '#d39a74', hair: '#4a2f1e', line: '#2a221c',
    navy: '#27406b', navyLight: '#3b5a8f', red: '#b3362b', redDark: '#7f231c', white: '#f7f3ea', whiteShade: '#ddd6c6',
    green: '#4f7a3a', greenLight: '#6b9a52', khaki: '#c9a86a', khakiDark: '#a8884e', denim: '#4d6f9c', denimDark: '#3a5781',
    black: '#2b2b31', olive: '#7d8a4a', sneaker: '#f4f1ea', boot: '#7a4b26', bootDark: '#56331a', loafer: '#5e2620',
    flip: '#2f8f9a', gold: '#d9a43a', capRed: '#b3362b', lens: '#1b1b22',
  };

  const CATS = [
    { key: 'shirt', label: 'Shirt', base: 'Undershirt', opts: ['Navy polo', 'Red flannel', 'White button-down', 'Green sweater', 'Striped tee'] },
    { key: 'pants', label: 'Pants', base: 'Boxers', opts: ['Khakis', 'Jeans', 'Black slacks', 'Shorts'] },
    { key: 'shoes', label: 'Shoes', base: 'Socks', opts: ['White sneakers', 'Brown boots', 'Loafers', 'Flip-flops'] },
    { key: 'extra', label: 'Extra', base: null, opts: ['None', 'Ball cap', 'Sunglasses', 'Tie', 'Watch'] },
  ];

  function rgbOf(c) {
    c = String(c || '').trim();
    let m = c.match(/^#([0-9a-f]{3})$/i);
    if (m) return m[1].split('').map((x) => parseInt(x + x, 16));
    m = c.match(/^#([0-9a-f]{6})/i);
    if (m) return [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16));
    m = c.match(/rgba?\(([^)]+)\)/i);
    if (m) return m[1].split(/[ ,/]+/).slice(0, 3).map((x) => parseFloat(x) || 0);
    return [128, 128, 128];
  }
  function mix(a, b, t) {
    const x = rgbOf(a), y = rgbOf(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  SCQ.registerGame('style', {
    title: 'Style Micah',
    howTo: [
      'Study his outfit while the curtain is open.',
      'Rebuild it with the arrows, then tap Check out. All four pieces have to match.',
      'Two rounds in a row. The second look is quicker.',
    ],
    defaults: {
      memorizeSec: 3,      // round 1 study time
      round2Sec: 2.5,      // round 2 study time
      timeLimit: 15,       // seconds to rebuild and check out, per round
      rounds: 2,
      peeks: 0,            // 1-second peeks per round
      peekSec: 1,
      eased: { memorizeSec: 5, round2Sec: 4.5, peeks: 1 },
    },

    start(stage, ctx) {
      const { util, sound, signal } = ctx;
      const params = ctx.params || {};
      const h = util.h;
      const P = ctx.palette, dk = !!P.dark;
      const rm = !!ctx.reducedMotion;
      const U = 'st' + Math.random().toString(36).slice(2, 8);
      const L = dk ? '#16141c' : LOOK.line;
      const rounds = Math.max(1, Math.min(4, +params.rounds || 2));
      const timeLimit = Math.max(4, +params.timeLimit || 15);
      const studyFor = (r) => Math.max(0.8, r === 0 ? (+params.memorizeSec || 3) : (+params.round2Sec || 2.5));

      const wait = (ms) => util.wait(ms, signal);
      const on = (el, type, fn) => el.addEventListener(type, fn, { signal });

      /* ---------------------------------------------------------- DOM */
      const style = h('style', {}, css());
      const sceneBox = h('div', { class: 'st-scene' });
      const curtL = h('div', { class: 'st-curtain l' }), curtR = h('div', { class: 'st-curtain r' });
      const rod = h('div', { class: 'st-rod' });
      const msg = h('div', { class: 'st-msg', 'aria-live': 'polite' });
      sceneBox.append(curtL, curtR, rod, msg);
      const panel = h('div', { class: 'st-panel st-locked' });
      const root = h('div', { class: 'st-root' + (rm ? ' st-rm' : '') }, sceneBox, panel);
      stage.append(style, root);
      const hud = util.hud(stage, [{ key: 'r', label: 'Round', value: '1/' + rounds }, { key: 't', label: 'Memorize', value: '' }]);
      const hudLabels = hud.el.querySelectorAll('.item span');
      const hudT = hud.el.querySelectorAll('.item b')[1];
      const setTLabel = (t) => { if (hudLabels[1]) hudLabels[1].textContent = t; };

      sceneBox.insertAdjacentHTML('afterbegin', roomSVG());
      const svg = sceneBox.querySelector('svg');
      const dollG = svg.querySelector('#' + U + '-doll');
      const mirrorNum = svg.querySelector('#' + U + '-num');
      function fitView() {

      }

        const ro = new ResizeObserver(fitView);
        ro.observe(sceneBox);

      /* controls */
      const picks = { shirt: -1, pants: -1, shoes: -1, extra: 0 };
      const valEls = {};
      const buttons = [];
      CATS.forEach((c) => {
        const val = h('b', {}, '');
        valEls[c.key] = val;
        const prev = h('button', { type: 'button', class: 'st-arrow', 'aria-label': 'Previous ' + c.label.toLowerCase(), html: util.icon('back') });
        const next = h('button', { type: 'button', class: 'st-arrow nx', 'aria-label': 'Next ' + c.label.toLowerCase(), html: util.icon('back') });

        on(next, 'click', () => step(c, 1));
        buttons.push(prev, next);
        panel.append(h('div', { class: 'st-row' }, prev, h('div', { class: 'st-val' }, h('small', {}, c.label), val), next));
      });

      const peeksPerRound = Math.max(0, +params.peeks || 0);

      const label = (c, i) => (i < 0 ? c.base : c.opts[i]);

      async function run() {

          // behind the curtain: dress him in the target look

          setLocked(true, true);
          say(roundIdx === 0 ? 'Round 1' : 'Round ' + (roundIdx + 1) + ': quicker!');
          await wait(rm ? 400 : 850);

          dollG.innerHTML = doll(picks);
          peeksLeft = peeksPerRound;

          await wait(rm ? 150 : 380);
          say('Now dress him!');

          setLocked(true, false);
          const wrong = CATS.filter((c) => picks[c.key] !== target[c.key]);
          if (result === 'timeout' || wrong.length) {

            say(result === 'timeout' ? "Time's up!" : 'Not quite!', 'bad');

        return 'win';
      }

      function build() {

        peeking = false;
        root.classList.remove('st-peeking');
        if (phase === 'build') dollG.innerHTML = doll(picks);
      });

      function stamp() {
        root.classList.remove('st-stamped'); void root.offsetWidth; root.classList.add('st-stamped');
      }

      function showCompare(timeout, wrong) {

          return h('li', { class: ok ? 'ok' : 'no' },
            h('span', { class: 'mk', html: util.icon(ok ? 'check' : 'close') }),
            h('span', {}, h('b', {}, c.label + ': '), label(c, target[c.key]), ok ? '' : h('em', {}, ' (you picked ' + label(c, picks[c.key]).toLowerCase() + ')')));

      if (ctx.debug) {

          arrow: (cat, dir) => center(panel.querySelectorAll('.st-row')[CATS.findIndex((c) => c.key === cat)].querySelectorAll('.st-arrow')[dir > 0 ? 1 : 0]),
          go: () => center(goBtn),
          setLeft: (v) => { buildLeft = v; },
          peek: () => center(peekBtn),
          // taps needed to reach the target from the current pick, going right
          stepsTo: (cat) => { const c = CATS.find((x) => x.key === cat); const n = c.opts.length; const cur = picks[cat], t = target[cat]; return cur < 0 ? t + 1 : (t - cur + n) % n; },

      }

      /* ========================================================== drawing */
      function limb(x1, y1, x2, y2, w, fill) {

      function shirtDetails(i, s) {

          `<path d="M80 103 V206" stroke="${LOOK.whiteShade}" stroke-width="2"/>` + [116, 136, 156, 176, 196].map((y) => `<circle cx="84" cy="${y}" r="1.7" fill="${LOOK.whiteShade}" stroke="${L}" stroke-width=".8"/>`).join('') +
          `<path d="M90 120 h16 v14 q-8 4 -16 0z" fill="none" stroke="${LOOK.whiteShade}" stroke-width="2"/>`;

<script>/* games/trail.js */
/* Stella's Cozy Quest - minigame "Off the Trail" (Shenandoah).
   A forest maze under fog of war: find the trail before sunset, and survive the slip halfway with an epic save. */
(function () {
  'use strict';
  const SCQ = window.SCQ;

  /* ------------------------------------------------------------------ maze (pure; the tests use these too) */
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], BIT = [1, 2, 4, 8]; // N E S W

  // Recursive backtracker. open[i] holds the open sides of cell i as BIT flags.
  function carve(cols, rows, rnd) {
    const open = new Array(cols * rows).fill(0), seen = new Array(cols * rows).fill(false);
    const start = Math.floor(rnd() * cols * rows);
    const stack = [start]; seen[start] = true;
    while (stack.length) {
      const i = stack[stack.length - 1], x = i % cols, y = (i - x) / cols;
      const nbrs = [];
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || seen[ny * cols + nx]) continue;
        nbrs.push(d);
      }
      if (!nbrs.length) { stack.pop(); continue; }
      const d = nbrs[Math.floor(rnd() * nbrs.length)], j = (y + DY[d]) * cols + x + DX[d];
      open[i] |= BIT[d]; open[j] |= BIT[(d + 2) % 4]; seen[j] = true; stack.push(j);
    }
    return open;
  }
  function distancesFrom(m, x0, y0) {
    const dist = new Array(m.cols * m.rows).fill(-1), q = [y0 * m.cols + x0];
    dist[q[0]] = 0;
    for (let k = 0; k < q.length; k++) {
      const i = q[k], x = i % m.cols, y = (i - x) / m.cols;
      for (let d = 0; d < 4; d++) {
        if (!(m.open[i] & BIT[d])) continue;
        const nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= m.cols || ny >= m.rows) continue;
        const j = ny * m.cols + nx;
        if (dist[j] < 0) { dist[j] = dist[i] + 1; q.push(j); }

  }

  // A maze whose solution length sits in a steady band, so every attempt is about as long.
  function makeMaze(cols, rows, rnd, opts) {
    const o = opts || {};
    const lo = Math.round(cols * rows * (o.minPath || 0.34)), hi = Math.round(cols * rows * (o.maxPath || 0.52));
    let m = null;
    for (let tries = 0; tries < 60; tries++) {
      const open = carve(cols, rows, rnd);
      const ex = 1 + Math.floor(rnd() * (cols - 2));
      const cand = { cols, rows, open, exit: { x: ex, y: 0 } };
      const dist = distancesFrom(cand, ex, 0);
      const starts = [];
      for (let x = 0; x < cols; x++) { const dd = dist[(rows - 1) * cols + x]; if (dd >= lo && dd <= hi && Math.abs(x - ex) >= 2) starts.push(x); }
      if (!starts.length && tries < 59) continue;
      const sx = starts.length ? starts[Math.floor(rnd() * starts.length)] : (ex + Math.floor(cols / 2)) % cols;
      cand.start = { x: sx, y: rows - 1 };
      m = cand;
      break;
    }
    m.open[m.exit.y * cols + m.exit.x] |= BIT[0]; // the gap out to the trail
    // solution path (unique in a perfect maze)
    const dist = distancesFrom(m, m.exit.x, 0);
    const path = [{ x: m.start.x, y: m.start.y }];
    let cx = m.start.x, cy = m.start.y;
    while (!(cx === m.exit.x && cy === m.exit.y)) {
      const i = cy * cols + cx;
      for (let d = 0; d < 4; d++) {
        if (!(m.open[i] & BIT[d])) continue;
        const nx = cx + DX[d], ny = cy + DY[d];
        if (ny < 0 || nx < 0 || nx >= cols || ny >= rows) continue;
        if (dist[ny * cols + nx] === dist[i] - 1) { cx = nx; cy = ny; break; }
      }
      path.push({ x: cx, y: cy });
    }

    let k = Math.floor(path.length * 0.5);

    for (let b = 0; b < n; b++) {

  // and stops at a junction, a dead end, the slippery rock (until it is survived), or walks out onto the trail.
  function slide(m, x, y, d, slipDone) {
    const out = [];
    let cx = x, cy = y, dir = d;
    for (let guard = 0; guard < m.cols * m.rows * 2; guard++) {

      if (cx === m.exit.x && cy === m.exit.y && dir === 0) { out.push({ x: cx, y: cy - 1, out: true }); break; }
      cx += DX[dir]; cy += DY[dir];
      out.push({ x: cx, y: cy });

      for (let e = 0; e < 4; e++) if (e !== back && (m.open[j] & BIT[e])) exits.push(e);

  function rgb(c) {

    '<path d="M6 15l6-6 6 6"/>', '<path d="M9 6l6 6-6 6"/>', '<path d="M6 9l6 6 6-6"/>', '<path d="M15 6l-6 6 6 6"/>',
  ];

  SCQ.registerGame('trail', {
    title: 'Off the Trail',
    howTo: [
      'Swipe, use the arrows, or tap the pad. Stella walks to the next fork on her own.',
      'Reach the trail at the top before the sun sets. White blazes mark a few right turns.',
      'If she slips, tap tap tap!',
    ],
    defaults: {
      cols: 9, rows: 13,
      pathMin: 0.42,       // the right path is this share of all cells, at least...
      pathMax: 0.6,        // ...and at most (keeps every attempt about as long)
      seconds: 50,         // daylight left
      vision: 1.4,         // how far Stella sees, in cells
      memory: 0.32,        // how clearly explored ground stays visible (0-1)
      blazes: 3,           // trail blazes on junctions of the right path
      slideSpeed: 10,      // cells per second
      slipTaps: 8,         // taps needed for the epic save...
      slipTime: 2.2,       // ...within this many seconds
      eased: { vision: 2.35, seconds: 72, memory: 0.45, blazes: 5, slipTaps: 6, slipTime: 3.0 },
    },
    sim,
    start(stage, ctx) {
      const U = ctx.util, P = ctx.params, pal = ctx.palette, signal = ctx.signal, snd = ctx.sound;
      const dark = !!pal.dark;

            g.fillText('!', ccx(mp.x) + c * 0.35, ccy(mp.y) - c * 0.3);
          }
          if (winT >= 0) heart((ccx(fx) + ccx(mp.x)) / 2, skyH + bandH * 0.5 - c * 0.7 - Math.min(1, winT) * 8, c * 0.32, Math.min(1, winT * 3));
        }

        /* ---------- movement */
        function go(d) {
          if (!running || over || qte) return;
          if (route) { buffered = d; return; }
          const r = slide(m, pos.x, pos.y, d, slipDone);
          face = d;
          if (!r.length) { bump = 0.18; bumpDir = d; snd.play('tick'); return; }
          route = r; routeT = 0;
          snd.noise(0.08, { vol: 0.05, filter: 1800, type: 'bandpass' });
        }
        function arrive() {
          const last = route[route.length - 1];
          route = null;
          if (last.out) { win(); return; }
          pos = { x: last.x, y: last.y };
          if (!slipDone && pos.x === m.slip.x && pos.y === m.slip.y) { startSlip(); return; }
          if (buffered != null) { const b = buffered; buffered = null; go(b); }
        }
        function stepMove(dt) {
          if (!route) return;
          routeT += dt * P.slideSpeed;
          // position along the route: from pos through each route cell
          const pts = [{ x: pos.x, y: pos.y }].concat(route);
          const k = Math.min(pts.length - 1, Math.floor(routeT));
          const a = pts[k], b = pts[Math.min(pts.length - 1, k + 1)], t = Math.min(1, routeT - k);
          fx = a.x + (b.x - a.x) * t; fy = a.y + (b.y - a.y) * t;
          if (b.x !== a.x || b.y !== a.y) face = b.x > a.x ? 1 : b.x < a.x ? 3 : b.y > a.y ? 2 : 0;
          const lastC = crumbs[crumbs.length - 1];
          if (Math.hypot(fx - lastC.x, fy - lastC.y) > 0.08) { crumbs.push({ x: fx, y: fy }); if (crumbs.length > 400) crumbs.splice(0, 100); }
          if (routeT >= pts.length - 1) { fx = route[route.length - 1].x; fy = route[route.length - 1].y; arrive(); }
        }

        /* ---------- the slip */
        let qteEl = null;
        function startSlip() {
          qte = { taps: 0, need: P.slipTaps, t: 0, live: false, done: false };
          snd.play('whoosh');
          U.banner(stage, 'Whoa! EPIC SAVE?', 1300);
          later(380, () => {
            if (!qte || over) return;
            qte.live = true;
            qteEl = U.h('div', { class: 'trail-qte', style: { position: 'absolute', inset: '0', zIndex: '6', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', paddingBottom: '18px', touchAction: 'none', cursor: 'pointer' } });
            const meter = U.h('div', { style: { height: '100%', width: '0%', background: pal.route, transition: 'width 80ms linear' } });
            const clock = U.h('div', { style: { height: '100%', width: '100%', background: pal.gold } });
            const panel = U.h('div', { style: { background: pal.card, border: '2px solid ' + pal.ink, boxShadow: '4px 4px 0 ' + pal.ink, padding: '12px 16px', width: 'min(300px, 86%)', textAlign: 'center', pointerEvents: 'none' } },
              U.h('div', { style: { font: U.font('mark', 30), color: pal.route, lineHeight: '1.1' } }, 'TAP! TAP! TAP!'),
              U.h('div', { style: { margin: '10px 0 6px', height: '18px', border: '2px solid ' + pal.ink, background: pal.paper2 } }, meter),
              U.h('div', { style: { height: '6px', border: '1px solid ' + pal.ink, background: pal.paper2 } }, clock));
            qteEl.append(panel);
            qte.meter = meter; qte.clock = clock;
            qteEl.addEventListener('pointerdown', (e) => { e.preventDefault(); tapQte(); }, { signal });
            stage.append(qteEl);
            pad.style.visibility = 'hidden';
          });
        }
        function tapQte() {
          if (!qte || !qte.live || qte.done) return;
          qte.taps++;
          snd.tone(500 + qte.taps * 60, 0.05, { type: 'square', vol: 0.05 });
          if (qte.meter) qte.meter.style.width = Math.min(100, (qte.taps / qte.need) * 100) + '%';
          if (qte.taps >= qte.need) endQte(true);
        }
        function endQte(ok) {
          qte.done = true;
          if (qteEl) { qteEl.remove(); qteEl = null; }
          pad.style.visibility = '';
          if (ok) {
            slipDone = true;
            snd.play('good');
            U.banner(stage, 'EPIC SAVE!', 1200);
            later(250, () => { qte = null; if (buffered != null) { const b = buffered; buffered = null; go(b); } });
          } else {
            over = true;
            snd.play('thud');
            fall = 0.001;
            later(1300, () => finish('lose'));
          }
        }

        /* ---------- end states */
        function win() {
          over = true;
          winFrom = fy;
          snd.play('good');
          winT = 0;
          pos = { x: m.exit.x, y: -1 };
          later(1500, () => finish('win'));
        }
        function sunset() {
          over = true;
          snd.tone(220, 0.6, { type: 'sine', vol: 0.15, slide: 140 });
          later(1200, () => finish('lose'));
        }

        /* ---------- input: d-pad, swipes, taps, keys */
        const pad = U.h('div', { class: 'trail-pad', style: { position: 'absolute', left: '50%', transform: 'translateX(-50%)', display: 'grid', gridTemplateColumns: 'repeat(3, 62px)', gridTemplateRows: 'repeat(2, 50px)', gap: '6px', zIndex: '3', touchAction: 'none' } });
        const PAD_POS = [[2, 1], [3, 2], [2, 2], [1, 2]];
        for (let d = 0; d < 4; d++) {
          const btn = U.h('button', {
            type: 'button', 'aria-label': ['Up', 'Right', 'Down', 'Left'][d],
            html: `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ARROWS[d]}</svg>`,
            style: { gridColumn: String(PAD_POS[d][0]), gridRow: String(PAD_POS[d][1]), background: pal.card, color: pal.ink, border: '2px solid ' + pal.ink, borderRadius: '10px', boxShadow: '3px 3px 0 ' + pal.ink, display: 'grid', placeItems: 'center', cursor: 'pointer', touchAction: 'none', padding: '0' },
          });
          btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.style.transform = 'translate(2px,2px)'; btn.style.boxShadow = '1px 1px 0 ' + pal.ink; go(d); }, { signal });
          const up = () => { btn.style.transform = ''; btn.style.boxShadow = '3px 3px 0 ' + pal.ink; };
          btn.addEventListener('pointerup', up, { signal }); btn.addEventListener('pointerleave', up, { signal }); btn.addEventListener('pointercancel', up, { signal });
          btn.addEventListener('click', (e) => { if (e.detail === 0) go(d); }, { signal }); // keyboard activation
          pad.append(btn);
        }
        stage.append(pad);
        function placePad() { pad.style.top = Math.round(Math.min(H - padH + 6, padTop + 8)) + 'px'; }
        let down = null;
        cv.canvas.addEventListener('pointerdown', (e) => { down = { p: cv.toLocal(e), id: e.pointerId }; try { cv.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }, { signal });
        cv.canvas.addEventListener('pointerup', (e) => {
          if (!down || down.id !== e.pointerId) return;
          const p = cv.toLocal(e), d0 = down.p; down = null;
          const dx = p.x - d0.x, dy = p.y - d0.y;
          if (Math.hypot(dx, dy) <= 24) { const dk = duckAt(); if (Math.hypot(p.x - dk.x, p.y - dk.y) < 22) { if (SCQ.findEgg) SCQ.findEgg('ankle'); return; } }
          if (Math.hypot(dx, dy) > 24) { go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); return; }
          const tx = p.x - ccx(fx), ty = p.y - ccy(fy);
          if (Math.max(Math.abs(tx), Math.abs(ty)) < c * 0.6) return;
          go(Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 1 : 3) : (ty > 0 ? 2 : 0));
        }, { signal });
        cv.canvas.addEventListener('pointercancel', () => { down = null; }, { signal });
        const KEYS = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3 };
        window.addEventListener('keydown', (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (qte && qte.live && !qte.done && (e.key === ' ' || e.key in KEYS || e.key === 'Enter')) { e.preventDefault(); if (!e.repeat) tapQte(); return; }
          if (!(e.key in KEYS)) return;
          e.preventDefault();
          if (e.repeat) return;
          go(KEYS[e.key]);
        }, { signal });

        /* ---------- loop */
        cv.onResize = () => layout();
        layout();
        explore();
        U.loop((dt) => {
          time += dt;
          if (running && !over) {
            if (!qte) {
              timeLeft -= dt;
              hud.set('sun', fmt(timeLeft));
              if (timeLeft <= 0) { timeLeft = 0; sunset(); }
            } else if (qte.live && !qte.done) {
              qte.t += dt;
              if (qte.clock) qte.clock.style.width = Math.max(0, 100 * (1 - qte.t / P.slipTime)) + '%';
              if (qte.t >= P.slipTime) endQte(false);
            }
            stepMove(dt);
            explore();
          }
          bump = Math.max(0, bump - dt);
          if (fall > 0) fall = Math.min(1, fall + dt * 1.6);
          if (over && timeLeft <= 0) darkT = Math.min(1, darkT + dt * 1.2);
          if (winT >= 0) {
            winT += dt;
            const u = Math.min(1, winT / 0.45), targetFy = (skyH + bandH * 0.5 - my - w - c / 2) / pitch;
            fy = winFrom + (targetFy - winFrom) * u;
            fx = m.exit.x;
            const lastC = crumbs[crumbs.length - 1];
            if (Math.hypot(fx - lastC.x, fy - lastC.y) > 0.08) crumbs.push({ x: fx, y: fy });
          }
          draw();
          return !done;
        }, signal);
        U.countdown(stage, signal).then(() => { running = true; }).catch(() => {});

        if (ctx.debug) {
          SCQ.test = SCQ.test || {};
          SCQ.test.trail = {
            maze: { cols: m.cols, rows: m.rows, open: m.open.slice(), start: m.start, exit: m.exit, path: m.path, slip: m.slip, blazes: m.blazes },
            state: () => ({ x: pos.x, y: pos.y, moving: !!route, running, over, timeLeft, slip: qte ? { live: qte.live, taps: qte.taps, need: qte.need, done: qte.done } : null, slipDone, won: winT >= 0, explored: explored.size }),
            setTime: (t) => { timeLeft = t; },
          };
        }
      });
    },
  });
})();

</script>
<script>/* games/trivia.js */
/* Trivia Night - Bold Rock cidery, Nellysford. A chalkboard quiz about us; Micah "helps". */
(function () {

  .tv-tray i{position:absolute;display:block;border-radius:3px}
